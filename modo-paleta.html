<title>Paleta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: la mesa vertical en el medio, tu paleta abajo y el rival arriba; HUD arriba, dos botones gigantes abajo.
   En 2 jugadores el de arriba tiene sus propios botones, dados vuelta. */
:root {
  --sky: #2ec27e;
  --ink: #1d2340;
  --paper: #fffaf0;
  --cube: #ffcc29;
  --accent: #ff5d7d;
  --good: #1fbf8a;
  --muted: #5b6382;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
  pointer-events: none; zoom: var(--ui, 1);
}
.stat { display: flex; flex-direction: column; line-height: 1; }
.stat.mid { align-items: center; }
.big {
  font-family: var(--display); font-size: clamp(34px, 7vw, 52px); color: var(--paper); font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink);
}
.lbl {
  font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--paper); margin-top: 6px;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 0 var(--ink);
}
.vidas { font-size: clamp(22px, 5vw, 30px); letter-spacing: 2px; line-height: 1; filter: drop-shadow(0 2px 0 var(--ink)); }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font-weight: 800; font-size: 13px; padding: 5px 10px; border-radius: 999px;
  background: var(--paper); border: 2px solid var(--ink); font-variant-numeric: tabular-nums;
}
.chip svg { flex: none; color: var(--ink); }
.hbtns { display: flex; gap: 8px; }
.smallbtn {
  pointer-events: auto; font: 800 13px var(--body); color: var(--ink); white-space: nowrap;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; box-shadow: 0 3px 0 var(--ink); cursor: pointer; min-height: 40px; min-width: 44px;
}
.smallbtn.icon { font-size: 17px; line-height: 1; }
.smallbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.pad {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 560px; margin: 0 auto;
  zoom: var(--ui, 1);
}
.pad.off { visibility: hidden; }
.pad[hidden] { display: none; }
/* el de arriba (2 jugadores): los mismos botones, dados vuelta para que los use quien está enfrente */
.pad.arriba { bottom: auto; top: 0; transform: rotate(180deg); }
.pad button {
  height: clamp(70px, 12vh, 110px); border-radius: 22px; background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; touch-action: none;
  font: 400 clamp(19px, 5.4vw, 26px) var(--display); transition: transform .05s, box-shadow .05s;
}
.pad.arriba button { background: #dff1ff; }
.pad button svg { width: 36px; height: 36px; flex: none; }
.pad button.on { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); background: var(--cube); }
/* en 2 jugadores, los botones de menú van al costado, a mitad de la mesa */
.lado {
  position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px; zoom: var(--ui, 1);
}
.lado[hidden] { display: none; }

.overlay {
  position: fixed; inset: 0; display: flex; overflow-y: auto; touch-action: pan-y;
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(29, 35, 64, .28);
}
.card {
  width: min(420px, 100%); margin: auto; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
  padding: 20px; display: flex; flex-direction: column; gap: 14px; zoom: var(--ui, 1);
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 48px; height: 48px; flex: none; border-radius: 10px; background: var(--cube);
  border: 3px solid var(--ink); position: relative; transform: rotate(-6deg);
}
.logo::before, .logo::after { content: ""; position: absolute; top: 13px; width: 8px; height: 11px; border-radius: 4px; background: var(--ink); }
.logo::before { left: 11px; } .logo::after { right: 11px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: clamp(32px, 9vw, 42px); }
h2 { font-size: 34px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.intro b { color: var(--ink); }
.back { align-self: flex-start; }
/* modo: contra la máquina o 2 jugadores */
.modos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modo {
  font: 800 14px/1.2 var(--body); color: var(--ink); cursor: pointer; padding: 10px 8px; text-align: center;
  background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.modo span { font-size: 22px; line-height: 1; }
.modo small { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.modo[aria-checked="true"] { background: var(--cube); transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.modo[aria-checked="true"] small { color: var(--ink); }
.go { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: stretch; }
.go.solo { grid-template-columns: 1fr; }
.best[hidden] { display: none; }
.best {
  display: flex; flex-direction: column; justify-content: center; padding: 6px 14px;
  border: 3px solid var(--ink); border-radius: 14px; background: #fff;
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.best b { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; line-height: 1.1; }
kbd { font: 800 12px var(--body); border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; color: var(--ink); background: #fff; }

.result { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.result .num { font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.result .sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lbl-dif { margin: 0 0 -6px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.xp {
  font-family: var(--display); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums;
  background: var(--cube); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 14px; margin-top: 4px;
}
.badge {
  font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  background: var(--good); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px;
}
.logros { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 2px; }
.logro { font-weight: 800; font-size: 13px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 10px; }
.logro::before { content: "★ "; color: #e0a000; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.btn {
  font: 800 16px var(--body); color: var(--ink); padding: 14px 10px; cursor: pointer;
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.small { padding: 10px; font-size: 15px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.big { font: 400 26px var(--display); padding: 12px 10px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (max-width: 380px) { .card { padding: 16px; gap: 12px; } }
@media (pointer: coarse) { .kbd-only { display: none; } }
@media (pointer: fine) { .card { gap: 12px; } }
@media (prefers-reduced-motion: reduce) { .pad button, .btn { transition: none; } }
/* jerarquía de botones: un solo protagonista por pantalla (igual que los otros juegos) */
.card .btn.primary { background: var(--cube); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .01em; }
.card .btn.primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.card .btn:not(.primary) { background: #fff; border-width: 2px; box-shadow: 0 2px 0 var(--ink); font-family: var(--body); font-weight: 800; font-size: 15px; }
.card .btn:not(.primary):active { transform: translateY(2px); box-shadow: none; }
.card .ter { background: transparent !important; border: 2px solid var(--ink) !important; box-shadow: 0 2px 0 var(--ink) !important; color: var(--ink);
  font: 800 14px var(--body) !important; padding: 8px 14px !important; min-height: 44px; }
.card .ter:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink) !important; }
</style>

<canvas id="cv"></canvas>

<div class="hud" id="hud" hidden>
  <div class="stat"><span class="big" id="hScore">0</span><span class="lbl">puntos</span></div>
  <div class="stat mid"><span class="vidas" id="hVidas">❤️❤️❤️</span><span class="lbl" id="hRival">rival 1</span></div>
  <div class="right">
    <div class="hbtns">
      <button class="smallbtn" id="btnQuit" type="button" title="Volver al menú (Esc)">← Menú</button>
      <button class="smallbtn icon" id="btnRestart" type="button" aria-label="Reiniciar (R)" title="Reiniciar (R)">↻</button>
    </div>
    <span class="chip" id="hDif">Normal</span>
  </div>
</div>

<div class="pad arriba off" id="pad2" hidden>
  <button id="bL2" type="button" aria-label="Izquierda del jugador de arriba"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg>Izquierda</button>
  <button id="bR2" type="button" aria-label="Derecha del jugador de arriba">Derecha<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
</div>
<div class="pad off" id="pad">
  <button id="bL" type="button" aria-label="Izquierda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg>Izquierda</button>
  <button id="bR" type="button" aria-label="Derecha">Derecha<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
</div>
<div class="lado" id="lado" hidden>
  <button class="smallbtn" id="btnQuit2" type="button" title="Volver al menú (Esc)">← Menú</button>
  <button class="smallbtn icon" id="btnRestart2" type="button" aria-label="Reiniciar (R)">↻</button>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <button class="ter smallbtn back" id="btnBack" type="button">← Juegos</button>
    <div class="brand"><div class="logo" aria-hidden="true"></div><h1>Paleta</h1></div>
    <p class="intro">Mové tu paleta con <b>◀ ▶</b> y devolvé la pelota. Si le pegás con la punta, sale cruzada. ¿Cuántos puntos le hacés?</p>
    <div class="modos" id="modos" role="radiogroup" aria-label="Modo">
      <button class="modo" type="button" role="radio" data-m="cpu" aria-checked="true"><span>🤖</span>Contra la máquina<small>Rivales cada vez mejores</small></button>
      <button class="modo" type="button" role="radio" data-m="dos" aria-checked="false"><span>👥</span>2 jugadores<small>En el mismo celu o compu</small></button>
    </div>
    <div id="difs"></div>
    <div class="go">
      <span class="best">Récord<b id="mBest">—</b></span>
      <button class="btn primary big" id="btnPlay" type="button">Jugar</button>
    </div>
    <div class="row">
      <button class="btn small" id="btnRank" type="button">🏆 Ranking</button>
      <button class="ter btn small" id="btnMute" type="button">Sonido: sí</button>

</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <div class="result">
      <h2 id="eTitle">¡Partido!</h2>
      <span class="num" id="eNum">0</span>
      <span class="sub" id="eSub"></span>
      <span class="badge" id="eBadge" hidden>Nuevo récord</span>
      <span class="sub" id="eSub2"></span>
      <span class="xp" id="eXP" hidden>+0 XP</span>
      <div class="logros" id="eLogros" hidden></div>
    </div>
    <button class="btn primary big" id="btnAgain" type="button">↻ Otra vez <kbd class="kbd-only">R</kbd></button>
    <p class="lbl-dif" id="eDifL">Dificultad</p>
    <div id="difs2"></div>
    <div class="row">
      <button class="btn small" id="btnRank2" type="button">🏆 Ranking</button>
      <button class="ter btn small" id="btnMenu" type="button">☰ Menú</button>
      <button class="ter btn small" id="btnHome" type="button">⌂ Juegos</button>
    </div>
  </div>
</div>

<script src="cubo-comun.js"></script>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CC = window.CuboComun; // perfil compartido (XP, personaje, récords); si no está, el juego anda solo
  // desafío del día (?diario=1): contra la máquina en Normal, 3 intentos y los rivales juegan con la semilla del día
  const DIA = CC && CC.diarioDe ? CC.diarioDe('paleta') : null;
  let azar = Math.random;

  // ---------- reglas ----------
  // La mesa mide FW × FH (en "unidades"); vos abajo, el rival arriba. Cada 3 puntos que hacés llega un rival mejor.
  const FW = 10, FH = 16, R_BOLA = 0.32, PALETA_Y = 1.15, VEL_PALETA = 13;
  const PUNTOS_RIVAL = 3, META_DOS = 7;
  // base y tope: velocidad de la pelota (unidades/s) · hw: media paleta · ia: velocidad del rival · err: cuánto le erra al principio
  const DIFS = {
    facil:   { name: 'Fácil',   base: 6.5,  tope: 15, crece: 1.03,  hw: 1.5,  ia: 5,    err: 2.1, vidas: 5 },
    normal:  { name: 'Normal',  base: 8,    tope: 18, crece: 1.04,  hw: 1.25, ia: 6.5,  err: 1.8, vidas: 3 },
    dificil: { name: 'Difícil', base: 9.5,  tope: 21, crece: 1.045, hw: 1.1,  ia: 8,    err: 1.5, vidas: 3 },
    extremo: { name: 'Extremo', base: 11,   tope: 24, crece: 1.05,  hw: 0.95, ia: 9.5,  err: 1.3, vidas: 2 },
    maestro: { name: 'Maestro', base: 12.5, tope: 27, crece: 1.055, hw: 0.85, ia: 11,   err: 1.1, vidas: 1 },
  };
  const NOTAS = {
    facil: 'Paleta ancha, pelota lenta y 5 vidas.',
    normal: '3 vidas. Cada 3 puntos viene un rival mejor.',
    dificil: 'Pelota más rápida y paleta más chica.',
    extremo: 'Rapidísima, paleta corta y 2 vidas. XP ×3.',
    maestro: 'Una sola vida y la pelota vuela. XP ×4.',
  };
  const RIVALES = [
    { n: 'Tito', c: '#ff7a59' }, { n: 'Lola', c: '#8f6bff' }, { n: 'Rulo', c: '#3fc1c9' }, { n: 'Mora', c: '#ff6fae' },
    { n: 'Coco', c: '#5b8cff' }, { n: 'Juana', c: '#f5b84a' }, { n: 'Tano', c: '#1fbf8a' }, { n: 'El Profe', c: '#2b3470' },
  ];
  const rivalDe = k => { const r = RIVALES[k % RIVALES.length], v = Math.floor(k / RIVALES.length); return { ...r, n: r.n + (v ? ' ' + ['II', 'III', 'IV', 'V'][Math.min(3, v - 1)] : '') }; };
  const XP_MALO = 2, XP_EXPERTO = 24;

  // ---------- récords y sonido ----------
  const REC_KEY = 'cubo-paleta-records';
  let rec = {};
  try { rec = JSON.parse(localStorage.getItem(REC_KEY)) || {}; } catch (e) { rec = {}; }
  const saveRec = () => { try { localStorage.setItem(REC_KEY, JSON.stringify(rec)); } catch (e) {} };
  let actx = null, muted = !!rec.muted;
  function beep(freq, dur, type = 'triangle', vol = 0.07, slide = 0) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sfxPaleta = n => beep(440 * Math.pow(2, Math.min(n, 14) / 12), 0.07, 'square', 0.05, 1.15);
  const sfxPared = () => beep(300, 0.04, 'triangle', 0.04);
  const sfxPunto = () => [659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.045), i * 70));
  const sfxPierdo = () => { beep(160, 0.3, 'sawtooth', 0.06, 0.45); beep(95, 0.22, 'square', 0.04); };
  const sfxTic = () => beep(880, 0.05, 'triangle', 0.05);

  // ---------- canvas y mesa ----------
  let W = 0, H = 0, S = 30, OX = 0, OY = 0;
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // la mesa va entre lo de arriba (HUD o botones del de arriba) y los botones de abajo
    const dos = G && G.modo === 'dos' && !G.demo;
    const enJuego = state === 'play';
    const pad = $('pad').getBoundingClientRect();
    let arriba = 16, abajo = H - 16;
    if (enJuego) {
      abajo = pad.top - 12;
      arriba = dos ? $('pad2').getBoundingClientRect().bottom + 12 : $('hud').getBoundingClientRect().bottom + 10;
    }
    const alto = Math.max(160, abajo - arriba), ancho = W - 24;
    S = Math.max(8, Math.min(ancho / FW, alto / FH));
    OX = (W - FW * S) / 2; OY = arriba + (alto - FH * S) / 2;
  }
  addEventListener('resize', resize);
  const sx = x => OX + x * S, sy = y => OY + y * S;

  // ---------- estado ----------
  let state = 'menu';   // menu | play | end
  let G = null, shake = 0, particles = [], floats = [], banner = null;
  let modo = rec.modo === 'dos' ? 'dos' : 'cpu';
  // ?dos=1 (desde el botón 1v1 del inicio): arranca elegido el modo de a dos
  try { if (new URLSearchParams(location.search).has('dos')) modo = 'dos'; } catch (e) {}
  const teclas = { p1: 0, p2: 0, l1: false, r1: false, l2: false, r2: false };

  function paleta(y, hw) { return { x: FW / 2, y, hw, v: 0, golpe: -9, objetivo: FW / 2, err: 0 }; }
  function newRun(demo, d = 'normal', m = 'cpu') {
    const D = DIFS[d];
    G = {
      demo, diff: d, D, modo: demo ? 'cpu' : m, t: 0,
      abajo: paleta(FH - PALETA_Y, D.hw), arriba: paleta(PALETA_Y, D.hw),
      bola: { x: FW / 2, y: FH / 2, vx: 0, vy: 0, vel: D.base, estela: [] },
      fase: 'cuenta', faseT: demo ? 0.5 : 1.6, saca: 'abajo',
      score: 0, contra: 0, vidas: D.vidas, nivel: 0, rival: rivalDe(0), rally: 0, mejorRally: 0, golpes: 0,
      done: false, settled: false, r: null,
    };
    particles = []; floats = []; banner = null;
  }
  // nivel del rival: cada PUNTOS_RIVAL puntos tuyos llega uno mejor (más rápido y erra menos)
  const iaVel = (G_, pad) => G_.demo ? G_.D.ia * 0.9 : G_.D.ia * (1 + 0.07 * Math.min(12, G_.nivel));
  const iaErr = G_ => G_.D.err * Math.max(0.3, 1 - 0.08 * G_.nivel);

  function sacar() {
    const b = G.bola, hacia = G.saca === 'abajo' ? 1 : -1;
    b.x = FW / 2; b.y = FH / 2; b.estela = [];
    b.vel = G.D.base * (1 + (G.modo === 'cpu' ? 0.03 * Math.min(10, G.nivel) : 0)) * 0.85;
    const ang = (azar() * 2 - 1) * 0.42;

  }
  // dónde va a cruzar la pelota la altura y (rebotando en las bandas)
  function cruce(b, y) {
    if (!b.vy) return b.x;
    const t = (y - b.y) / b.vy;
    if (t < 0) return b.x;
    const ancho = FW - 2 * R_BOLA;
    let x = b.x - R_BOLA + b.vx * t;
    x = ((x % (2 * ancho)) + 2 * ancho) % (2 * ancho);
    if (x > ancho) x = 2 * ancho - x;
    return x + R_BOLA;
  }
  // la máquina elige a dónde ir cada vez que la pelota sale para su lado (y con qué error)
  function pensarIA() {
    const lados = G.demo ? ['abajo', 'arriba'] : G.modo === 'cpu' ? ['arriba'] : [];
    for (const lado of lados) {
      const p = G[lado], vaHacia = lado === 'arriba' ? G.bola.vy < 0 : G.bola.vy > 0;
      if (!vaHacia) { p.objetivo = FW / 2 + (G.bola.x - FW / 2) * 0.3; continue; }
      const e = G.demo ? 0.9 : iaErr(G);

      // los mejores apuntan: le pegan con la punta para mandarla cruzada
      const apunta = G.demo ? 0 : Math.min(0.7, 0.12 * G.nivel) * (azar() < 0.5 ? -1 : 1);
      p.objetivo = cruce(G.bola, p.y) + p.err - apunta * p.hw;
    }
  }

  function golpe(lado, p) {
    const b = G.bola, dir = lado === 'abajo' ? -1 : 1;
    const off = Math.max(-1, Math.min(1, (b.x - p.x) / (p.hw + R_BOLA)));
    let ang = off * 1.0 + Math.max(-0.25, Math.min(0.25, p.v * 0.012));
    ang = Math.max(-1.1, Math.min(1.1, ang));
    b.vel = Math.min(G.D.tope, b.vel * G.D.crece);
    b.vx = b.vel * Math.sin(ang); b.vy = dir * b.vel * Math.cos(ang);

    pensarIA();
  }

  function punto(ganoAbajo) {
    G.fase = 'punto'; G.faseT = 1.0;
    const b = G.bola;
    chispas(b.x, ganoAbajo ? 0 : FH, ganoAbajo ? '#ffcc29' : '#ff5d7d', 16, 1.4);
    if (G.demo) { G.saca = ganoAbajo ? 'arriba' : 'abajo'; return; }
    if (ganoAbajo) {
      G.score++; sfxPunto();
      if (G.modo === 'cpu') {
        floats.push({ text: '+1', x: b.x, y: 1.6, t: performance.now() });
        if (G.score % PUNTOS_RIVAL === 0) {
          G.nivel++; G.rival = rivalDe(G.nivel);
          banner = { text: `¡Rival nuevo: ${G.rival.n}!`, t: performance.now() };

        if (marca) marca.ver(G.score);

    } else {
      sfxPierdo(); shake = reduceMotion ? 0 : 10; CC?.vibrar(40);

        G.vidas--;

    hudCache = '';
    // saca el que perdió el punto
    G.saca = ganoAbajo ? 'arriba' : 'abajo';

    if (termino) { G.done = true; G.fase = 'fin'; setTimeout(terminar, 650); }
  }

  // ---------- actualizar ----------
  function moverPaleta(p, dir, dt) {
    const obj = dir * VEL_PALETA;

  function moverIA(p, dt) {

  }
  function update(now, dt) {
    if (!G) return;
    G.t += dt;
    if (state === 'play' || G.demo) {
      // paletas
      const dirAbajo = G.demo ? null : (teclas.r1 ? 1 : 0) - (teclas.l1 ? 1 : 0);
      if (G.demo) moverIA(G.abajo, dt); else moverPaleta(G.abajo, dirAbajo, dt);
      if (G.demo || G.modo === 'cpu') moverIA(G.arriba, dt);
      else moverPaleta(G.arriba, (teclas.r2 ? 1 : 0) - (teclas.l2 ? 1 : 0), dt);

  // ---------- fin de partida ----------

      $('eBadge').hidden = true; $('eXP').hidden = true; $('eLogros').hidden = true;

    } else {

      $('eNum').textContent = G.score;

      $('eSub2').textContent = `Rally más largo: ${G.mejorRally} ${G.mejorRally === 1 ? 'golpe' : 'golpes'}` +

  // ---------- dibujo ----------

  function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
  function dibujarPaleta(p, color, arriba, sk, now) {
    const px = sx(p.x), py = sy(p.y), w = p.hw * 2 * S, h = Math.max(8, 0.34 * S);
    const golpeo = Math.max(0, 1 - (G.t - p.golpe) / 0.15);
    // el cubo va detrás de su paleta (abajo del todo o arriba del todo)
    if (CC && sk) {

      ctx.save();
      if (arriba) { ctx.translate(px, py - h * 0.2); ctx.scale(1, -1); }
      else ctx.translate(px, py + h * 0.2 + lado);
      CC.dibujarCubo(ctx, 0, 0, lado, { skin: sk, t: now, efecto: !arriba, mirar: p.v > 1 ? 1 : p.v < -1 ? -1 : 1 });
      ctx.restore();

  let hudCache = '';
  function draw(now) {

    g.addColorStop(0, '#46d08f'); g.addColorStop(1, '#22a86b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // mesa
    const mx = sx(0), my = sy(0), mw = FW * S, mh = FH * S;
    ctx.fillStyle = '#1d2340'; rr(ctx, mx - 6, my - 6 + 6, mw + 12, mh + 12, 18); ctx.fill();
    ctx.fillStyle = MESA; rr(ctx, mx - 6, my - 6, mw + 12, mh + 12, 18); ctx.fill();

    ctx.fillStyle = '#fff'; ctx.fillRect(mx - 10, my + mh / 2 - 4, mw + 20, 2);
    // marcador grande, de fondo
    ctx.font = `400 ${Math.round(S * 2.6)}px "Lilita One", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    if (G.modo === 'dos' && !G.demo) {
      ctx.fillText(String(G.contra), mx + mw / 2, my + mh * 0.25);
      ctx.fillText(String(G.score), mx + mw / 2, my + mh * 0.75);
    } else if (!G.demo) ctx.fillText(String(G.score), mx + mw / 2, my + mh * 0.75);
    // paletas y cubos
    const yo = CC ? CC.skin() : null;
    const otro = G.modo === 'dos' && !G.demo ? (CC ? { ...CC.SKINS[0], cuerpo: '#62c6ff' } : null) : (CC ? { ...CC.SKINS[0], cuerpo: G.rival.c } : null);
    dibujarPaleta(G.arriba, G.modo === 'dos' && !G.demo ? '#62c6ff' : G.rival.c, true, otro, now);

    // pelota
    const b = G.bola;
    if (G.fase === 'juego' || G.fase === 'punto' || G.fase === 'fin') {
      b.estela.forEach((p, i) => {

      });
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(sx(b.x), sy(b.y), R_BOLA * S, 0, Math.PI * 2);
      ctx.fillStyle = b.vel > G.D.tope * 0.85 ? '#ffcc29' : '#fff'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#1d2340'; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(sx(FW / 2), sy(FH / 2), R_BOLA * S, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#1d2340'; ctx.stroke();

    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // cuenta regresiva y carteles
    const texto = (t, y, tam, girar) => {
      ctx.save(); ctx.translate(W / 2, y); if (girar) ctx.rotate(Math.PI);
      ctx.font = `400 ${tam}px "Lilita One", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(4, tam * 0.12); ctx.strokeStyle = '#1d2340'; ctx.strokeText(t, 0, 0);
      ctx.fillStyle = '#fffaf0'; ctx.fillText(t, 0, 0); ctx.restore();

      if (G.fase === 'cuenta' && G.faseT > 0) {

        if (G.modo === 'dos') texto(n > 3 ? '3' : String(n), sy(FH * 0.38), Math.round(S * 2.4), true);

      if (banner && now - banner.t < 1500) texto(banner.text, sy(FH * 0.38), Math.round(Math.min(34, S * 1.3)));

  function pintarHud() {

  // ---------- pantallas ----------

    if (DIA) { modo = 'cpu'; DIA.menu($('difs'), [$('modos')]); }

  } else { $('difs').hidden = true; $('difs2').hidden = true; $('eDifL').hidden = true; }
  function renderMenu() {
    for (const b of $('modos').children) b.setAttribute('aria-checked', String(b.dataset.m === modo));
    const best = CC ? CC.perfil().mejores['paleta:' + dif()] : rec[dif()];
    $('mBest').textContent = modo === 'dos' ? '—' : best ? String(best) : '—';
    $('mBest').parentNode.hidden = modo === 'dos';
    $('mBest').parentNode.parentNode.classList.toggle('solo', modo === 'dos');
    $('btnRank').hidden = !CC || modo === 'dos';
    $('btnMute').textContent = 'Sonido: ' + (muted ? 'no' : 'sí');
  }
  $('modos').addEventListener('click', e => {
    const b = e.target.closest('.modo'); if (!b) return;
    modo = b.dataset.m; rec.modo = modo; saveRec(); renderMenu();
  });
  let marca = null;
  function ponerMarca(on) {
    if (marca) { marca.quitar(); marca = null; }
    if (on && CC && CC.sombra && G && !G.demo && G.modo === 'cpu') marca = CC.sombra.marca('paleta', G.diff);
  }
  function soltarTeclas() { teclas.l1 = teclas.r1 = teclas.l2 = teclas.r2 = false; for (const b of document.querySelectorAll('.pad button')) b.classList.remove('on'); }
  function start() {
    if (DIA) { if (!DIA.empezar()) return DIA.normal(); azar = DIA.azar(); modo = 'cpu'; }
    newRun(false, dif(), modo);
    state = 'play';
    const dos = G.modo === 'dos';
    $('menu').hidden = true; $('end').hidden = true;
    $('hud').hidden = dos; $('lado').hidden = !dos;
    $('pad').classList.remove('off'); $('pad2').hidden = !dos; $('pad2').classList.toggle('off', !dos);
    $('hDif').innerHTML = (CC ? CC.iconoDif(G.diff, 16) : '') + G.D.name;

  function cortar() { if (state === 'play' && G && !G.demo && !G.done && G.modo === 'cpu' && G.score > 0) return settle(); return null; }

  }
  const volver = () => { cortar(); if (CC) CC.volver(); else location.href = 'index.html'; };

  $('btnPlay').addEventListener('click', start);
  $('btnAgain').addEventListener('click', start);
  $('btnBack').addEventListener('click', volver);
  $('btnHome').addEventListener('click', volver);
  $('btnMenu').addEventListener('click', showMenu);
  $('btnRank').addEventListener('click', () => verRanking(dif()));
  $('btnRank2').addEventListener('click', () => verRanking(G ? G.diff : dif()));
  for (const id of ['btnQuit', 'btnQuit2']) $(id).addEventListener('click', showMenu);
  for (const id of ['btnRestart', 'btnRestart2']) $(id).addEventListener('pointerdown', e => { e.preventDefault(); restart(); });
  $('btnMute').addEventListener('click', () => { muted = !muted; rec.muted = muted; saveRec(); renderMenu(); if (!muted) beep(660, 0.08); });

  // ---------- entrada: se mantienen apretados ----------
  function apretar(btn, k, on) {
    teclas[k] = on;
    btn.classList.toggle('on', on);
  }
  // el de arriba ve la mesa dada vuelta: su "izquierda" es la derecha de la pantalla
  const BOTONES = [['bL', 'l1'], ['bR', 'r1'], ['bL2', 'r2'], ['bR2', 'l2']];
  for (const [id, k] of BOTONES) {
    const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} apretar(b, k, true); });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => apretar(b, k, false));
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
  const TECLA = { ArrowLeft: 'l1', ArrowRight: 'r1' };
  function teclaDe(e) {
    if (TECLA[e.key]) return TECLA[e.key];
    const k = e.key.toLowerCase();
    // A y D: en 2 jugadores son del de arriba; si no, también mueven tu paleta
    if (k === 'a') return G && G.modo === 'dos' && !G.demo ? 'l2' : 'l1';
    if (k === 'd') return G && G.modo === 'dos' && !G.demo ? 'r2' : 'r1';
    return null;
  }
  addEventListener('keydown', e => {
    if (document.getElementById('cc-rank')) return;   // la ventana del ranking maneja su teclado
    const k = e.key;
    if (state === 'play') {
      const t = teclaDe(e);
      if (t) { e.preventDefault(); teclas[t] = true; return; }
      if (k === 'Escape') showMenu();
      else if ((k === 'r' || k === 'R') && !e.repeat) restart();
    } else if (state === 'menu') {
      if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); if (sel && !DIA) sel.siguiente(k === 'ArrowUp' ? -1 : 1); }
      else if (k === 'Enter' && document.activeElement === document.body) start();
      else if (k === 'Escape') volver();
    } else if (state === 'end') {
      if ((k === 'r' || k === 'R') && !e.repeat) start();
      else if (k === 'Escape') showMenu();
      else if ((k === 'Enter' || k === ' ') && document.activeElement === document.body) { e.preventDefault(); start(); }
    }
  });
  addEventListener('keyup', e => { const t = teclaDe(e); if (t) teclas[t] = false; });
  addEventListener('blur', soltarTeclas);
  document.addEventListener('visibilitychange', () => { if (document.hidden) soltarTeclas(); });

  // ---------- arranque ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(now, dt); draw(now);
    requestAnimationFrame(frame);
  }
  showMenu();
  requestAnimationFrame(frame);
  if (CC && CC.pedirApodo) setTimeout(() => CC.pedirApodo(), 600);
})();
</script>
