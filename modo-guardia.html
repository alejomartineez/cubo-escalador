<title>Guardia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: el piso cruza la pantalla y tu cubo está en el medio; los enemigos llegan por los dos costados.
   HUD arriba, dos botones gigantes abajo (uno para pegar a cada lado). */
:root {
  --sky: #e2525f;
  --ink: #1d2340;
  --paper: #fffaf0;
  --cube: #ffcc29;
  --accent: #ff5d7d;
  --good: #1fbf8a;
  --muted: #5b6382;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
  pointer-events: none; zoom: var(--ui, 1);
}
.stat { display: flex; flex-direction: column; line-height: 1; min-width: 0; }
.stat.mid { align-items: center; }
.big {
  font-family: var(--display); font-size: clamp(34px, 7vw, 52px); color: var(--paper); font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink);
}
.lbl {
  font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--paper); margin-top: 6px;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 0 var(--ink);
  white-space: nowrap;
}
.vidas { font-size: clamp(22px, 5vw, 30px); letter-spacing: 2px; line-height: 1; filter: drop-shadow(0 2px 0 var(--ink)); }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font-weight: 800; font-size: 13px; padding: 5px 10px; border-radius: 999px;
  background: var(--paper); border: 2px solid var(--ink); font-variant-numeric: tabular-nums;
}
.chip svg { flex: none; color: var(--ink); }
.hbtns { display: flex; gap: 8px; }
.smallbtn {
  pointer-events: auto; font: 800 13px var(--body); color: var(--ink); white-space: nowrap;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; box-shadow: 0 3px 0 var(--ink); cursor: pointer; min-height: 40px; min-width: 44px;
}
.smallbtn.icon { font-size: 17px; line-height: 1; }
.smallbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.pad {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 560px; margin: 0 auto;
  zoom: var(--ui, 1);
}
.pad.off { visibility: hidden; }
.pad button {
  height: clamp(70px, 12vh, 110px); border-radius: 22px; background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; touch-action: none;
  font: 400 clamp(19px, 5.4vw, 26px) var(--display); transition: transform .05s, box-shadow .05s;
}
.pad button svg { width: 36px; height: 36px; flex: none; }
.pad button.on { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); background: var(--cube); }

.overlay {
  position: fixed; inset: 0; display: flex; overflow-y: auto; touch-action: pan-y;
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(29, 35, 64, .28);
}
.card {
  width: min(420px, 100%); margin: auto; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
  padding: 20px; display: flex; flex-direction: column; gap: 14px; zoom: var(--ui, 1);
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 48px; height: 48px; flex: none; border-radius: 10px; background: var(--cube);
  border: 3px solid var(--ink); position: relative; transform: rotate(-6deg);
}
.logo::before, .logo::after { content: ""; position: absolute; top: 13px; width: 8px; height: 11px; border-radius: 4px; background: var(--ink); }
.logo::before { left: 11px; } .logo::after { right: 11px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: clamp(32px, 9vw, 42px); }
h2 { font-size: 34px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.intro b { color: var(--ink); }
.back { align-self: flex-start; }
.go { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: stretch; }
.best[hidden] { display: none; }
.best {
  display: flex; flex-direction: column; justify-content: center; padding: 6px 14px;
  border: 3px solid var(--ink); border-radius: 14px; background: #fff;
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.best b { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; line-height: 1.1; }
kbd { font: 800 12px var(--body); border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; color: var(--ink); background: #fff; }

.result { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.result .num { font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.result .sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lbl-dif { margin: 0 0 -6px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.xp {
  font-family: var(--display); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums;
  background: var(--cube); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 14px; margin-top: 4px;
}
.badge {
  font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  background: var(--good); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px;
}
.logros { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 2px; }
.logro { font-weight: 800; font-size: 13px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 10px; }
.logro::before { content: "★ "; color: #e0a000; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.btn {
  font: 800 16px var(--body); color: var(--ink); padding: 14px 10px; cursor: pointer;
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.small { padding: 10px; font-size: 15px; }
.btn.big { font: 400 26px var(--display); padding: 12px 10px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (max-width: 380px) { .card { padding: 16px; gap: 12px; } }
@media (pointer: coarse) { .kbd-only { display: none; } }
@media (pointer: fine) { .card { gap: 12px; } }
@media (prefers-reduced-motion: reduce) { .pad button, .btn { transition: none; } }
/* jerarquía de botones: un solo protagonista por pantalla (igual que los otros juegos) */
.card .btn.primary { background: var(--cube); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .01em; }
.card .btn.primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.card .btn:not(.primary) { background: #fff; border-width: 2px; box-shadow: 0 2px 0 var(--ink); font-family: var(--body); font-weight: 800; font-size: 15px; }
.card .btn:not(.primary):active { transform: translateY(2px); box-shadow: none; }
.card .ter { background: transparent !important; border: 2px solid var(--ink) !important; box-shadow: 0 2px 0 var(--ink) !important; color: var(--ink);
  font: 800 14px var(--body) !important; padding: 8px 14px !important; min-height: 44px; }
.card .ter:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink) !important; }
</style>

<canvas id="cv"></canvas>

<div class="hud" id="hud" hidden>
  <div class="stat"><span class="big" id="hScore">0</span><span class="lbl">puntos</span></div>

  <button id="bR" type="button" aria-label="Golpe a la derecha">Derecha<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>

<div class="overlay" id="menu">

    </div>
    <div id="leyenda"></div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <div class="result">
      <h2 id="eTitle">¡Cayó la guardia!</h2>
      <span class="num" id="eNum">0</span>
      <span class="sub" id="eSub"></span>
      <span class="badge" id="eBadge" hidden>Nuevo récord</span>
      <span class="sub" id="eSub2"></span>
      <span class="xp" id="eXP" hidden>+0 XP</span>
      <div class="logros" id="eLogros" hidden></div>
    </div>
    <button class="btn primary big" id="btnAgain" type="button">↻ Otra vez <kbd class="kbd-only">R</kbd></button>
    <p class="lbl-dif" id="eDifL">Dificultad</p>
    <div id="difs2"></div>
    <div class="row">
      <button class="btn small" id="btnRank2" type="button">🏆 Ranking</button>
      <button class="ter btn small" id="btnMenu" type="button">☰ Menú</button>
      <button class="ter btn small" id="btnHome" type="button">⌂ Juegos</button>
    </div>
  </div>
</div>

<script src="cubo-comun.js"></script>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CC = window.CuboComun; // perfil compartido (XP, personaje, récords); si no está, el juego anda solo
  // Textos en inglés (la clave es el texto en español). Si cubo-comun.js todavía no tiene idioma, queda en español.
  if (CC && CC.textos) CC.textos({
    'Guardia': 'Guard',
    'Llegan por los dos lados. Pegale con <b>◀</b> o <b>▶</b> al que pisa la franja amarilla. Si pegás antes de tiempo o al aire, te mareás.':
      'They come from both sides. Hit <b>◀</b> or <b>▶</b> when one steps on the yellow strip. Swing too early or at nothing and you get dizzy.',
    'puntos': 'points', 'oleada {n}': 'wave {n}', 'Oleada {n}': 'Wave {n}', 'Golpe a la izquierda': 'Hit left', 'Golpe a la derecha': 'Hit right',
    'Izquierda': 'Left', 'Derecha': 'Right', 'Récord': 'Best', 'Jugar': 'Play', 'Sonido: sí': 'Sound: on', 'Sonido: no': 'Sound: off',
    '¡Cayó la guardia!': 'Guard down!', '¡Buena guardia!': 'Nice guarding!', '¡Imparable!': 'Unstoppable!', 'Nuevo récord': 'New best', 'Primer récord': 'First best',
    'Dificultad': 'Difficulty', 'golpear': 'hit', 'reiniciar': 'restart',
    'Enemigos comunes: pegales cuando pisan la franja.': 'Regular enemies: hit them when they step on the strip.',
    'Rápidos: llegan antes de lo que pensás.': 'Fast ones: they get there sooner than you think.',
    'Con casco: necesitan dos golpes.': 'Helmets: they take two hits.',
    'Saltarines: amagan y cambian de lado.': 'Jumpers: they fake and switch sides.',
    '¡Jefe! Pegale cuando baja el escudo.': 'Boss! Hit it when the shield is down.',
    '¡Jefe!': 'Boss!', '¡Al aire!': 'Whiff!', '¡Muy pronto!': 'Too early!', '¡Bloqueó!': 'Blocked!', '¡Auch!': 'Ouch!',
    '¡Última vida!': 'Last life!', '¡Te quedan {n}!': '{n} left!', 'Combo perdido': 'Combo lost', 'combo': 'combo', '¡Jefe abatido!': 'Boss down!',
    '{n} pts · {d}': '{n} pts · {d}', 'puntos · {d} · llegaste a la oleada {n}': 'points · {d} · you reached wave {n}',
    'Derrotaste a {n} · combo máximo {c}': 'You beat {n} · best combo {c}', ' · récord: {r}': ' · best: {r}',
    'Pocos enemigos y lentos, 5 vidas.': 'Few, slow enemies and 5 lives.',
    '3 vidas. Cada oleada llegan más rápido.': '3 lives. Every wave they come faster.',
    'Más rápidos y la franja más corta.': 'Faster, and a shorter strip.',
    'Llegan de a muchos y 2 vidas. XP ×3.': 'Lots at once and 2 lives. XP ×3.',
    'Una sola vida y vienen volando. XP ×4.': 'One life and they fly in. XP ×4.',
  });
  const T = (s, v) => (CC && CC.T ? CC.T(s, v) : v ? s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)) : s);
  // desafío del día (?diario=1): en Normal, 3 intentos y los enemigos salen con la semilla del día (iguales para todos)
  const DIA = CC && CC.diarioDe ? CC.diarioDe('guardia') : null;
  let azar = Math.random;

  // ---------- reglas ----------
  // Todo se mide en "L": la distancia del centro (donde estás vos) al borde del campo. Los enemigos nacen en SPAWN y
  // caminan hacia el centro. Cuando su frente pisa la franja (entre CONTACTO y el alcance) los podés golpear; si llega a
  // CONTACTO, te pega. Un golpe que no encuentra a nadie en la franja de ese lado te deja mareado un rato.
  const SPAWN = 1.12, CUBO = 0.25, CONTACTO = CUBO / 2 + 0.01;
  // vel: velocidad base (L/s) · alcance: hasta dónde llega tu golpe · gap: tiempo mínimo entre dos llegadas
  // cada: segundos entre enemigos · torpe: cuánto quedás mareado si errás
  const DIFS = {
    facil:   { name: 'Fácil',   vel: 0.34, alcance: 0.44, gap: 0.55, cada: 1.45, torpe: 0.30, vidas: 5 },
    normal:  { name: 'Normal',  vel: 0.42, alcance: 0.40, gap: 0.42, cada: 1.20, torpe: 0.36, vidas: 3 },
    dificil: { name: 'Difícil', vel: 0.48, alcance: 0.38, gap: 0.37, cada: 1.08, torpe: 0.38, vidas: 3 },
    extremo: { name: 'Extremo', vel: 0.54, alcance: 0.37, gap: 0.33, cada: 0.98, torpe: 0.40, vidas: 2 },
    maestro: { name: 'Maestro', vel: 0.60, alcance: 0.36, gap: 0.30, cada: 0.9, torpe: 0.42, vidas: 1 },
  };
  const NOTAS = {
    facil: 'Pocos enemigos y lentos, 5 vidas.',
    normal: '3 vidas. Cada oleada llegan más rápido.',
    dificil: 'Más rápidos y la franja más corta.',
    extremo: 'Llegan de a muchos y 2 vidas. XP ×3.',
    maestro: 'Una sola vida y vienen volando. XP ×4.',
  };
  // tipos de enemigo: aparecen de a poco (desde la oleada `desde`)
  const TIPOS = {
    comun:  { pts: 10, hp: 1, vel: 1,    tam: 0.19, color: '#ff5d5d', desde: 1, intro: 'Enemigos comunes: pegales cuando pisan la franja.' },
    rapido: { pts: 15, hp: 1, vel: 1.6,  tam: 0.16, color: '#ffb02e', desde: 2, intro: 'Rápidos: llegan antes de lo que pensás.' },
    duro:   { pts: 25, hp: 2, vel: 0.85, tam: 0.21, color: '#5b8cff', desde: 3, intro: 'Con casco: necesitan dos golpes.' },
    finta:  { pts: 20, hp: 1, vel: 1.05, tam: 0.18, color: '#a66bff', desde: 4, intro: 'Saltarines: amagan y cambian de lado.' },
    jefe:   { pts: 150, hp: 8, vel: 0.5, tam: 0.36, color: '#4a3a78', intro: '¡Jefe! Pegale cuando baja el escudo.' },
  };
  const JEFE_CADA = 3;                       // un jefe al final de cada 3 oleadas
  const AMAGUE = 0.34, SALTO = 0.5, HOP = 0.3, ATERRIZA = 0.6;   // el saltarín: se frena, salta por arriba tuyo y cae del otro lado
  const ESCUDO_CICLO = 1.7, ESCUDO_ARRIBA = 0.62, ESCUDO_AVISO = 0.25;
  const velOla = w => Math.min(2, 1 + 0.07 * (w - 1));
  const cadaOla = (D, w) => D.cada * Math.max(0.42, 1 - 0.055 * (w - 1));
  const gapOla = (D, w) => D.gap * Math.max(0.72, 1 - 0.03 * (w - 1));
  const cuantosOla = w => Math.min(18, 6 + 2 * w);
  const multDe = c => (c >= 100 ? 5 : c >= 50 ? 4 : c >= 25 ? 3 : c >= 10 ? 2 : 1);
  const XP_MALO = 150, XP_EXPERTO = 6000;

  // ---------- récords y sonido ----------
  const REC_KEY = 'cubo-guardia-records';
  let rec = {};
  try { rec = JSON.parse(localStorage.getItem(REC_KEY)) || {}; } catch (e) { rec = {}; }
  const saveRec = () => { try { localStorage.setItem(REC_KEY, JSON.stringify(rec)); } catch (e) {} };
  let actx = null, muted = !!rec.muted, ruidoBuf = null;
  function audio() {
    if (muted) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function beep(freq, dur, type = 'triangle', vol = 0.07, slide = 0, delay = 0) {
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  // ruido filtrado: el "chas" de los golpes y el "fiu" de pegarle al aire
  function ruido(dur, vol, freq, tipo = 'bandpass', q = 1.2) {
    const a = audio(); if (!a) return;
    try {
      if (!ruidoBuf) {
        ruidoBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.5), a.sampleRate);
        const d = ruidoBuf.getChannelData(0);
        for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
      }
      const t = a.currentTime, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      s.buffer = ruidoBuf; f.type = tipo; f.frequency.value = freq; f.Q.value = q;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sfxGolpe = c => { ruido(0.09, 0.32, 1100 + Math.min(c, 40) * 25); beep(170 + Math.min(c, 30) * 9, 0.09, 'square', 0.05, 0.55); };
  const sfxKO = () => { beep(95, 0.2, 'sine', 0.16, 0.45); ruido(0.14, 0.22, 500, 'lowpass', 0.7); };
  const sfxCasco = () => { beep(1500, 0.08, 'square', 0.035); beep(1100, 0.14, 'triangle', 0.05, 0.8); ruido(0.06, 0.15, 3000); };
  const sfxAire = () => { ruido(0.16, 0.1, 2400, 'highpass', 0.6); beep(150, 0.14, 'sawtooth', 0.03, 0.7); };
  const sfxBloqueo = () => { beep(1300, 0.05, 'square', 0.04); beep(700, 0.12, 'triangle', 0.06, 0.8); };
  const sfxAuch = () => { beep(240, 0.32, 'sawtooth', 0.07, 0.4); beep(120, 0.25, 'square', 0.04, 0.6); ruido(0.2, 0.2, 300, 'lowpass'); };
  const sfxCombo = n => [0, 4, 7, 12].forEach((s, i) => beep(523 * Math.pow(2, (s + Math.min(n, 4) * 2) / 12), 0.1, 'square', 0.04, 0, i * 0.06));
  const sfxOleada = () => { beep(392, 0.1, 'square', 0.045); beep(587, 0.16, 'square', 0.045, 0, 0.1); };
  const sfxJefe = () => { beep(70, 0.7, 'sawtooth', 0.08, 0.7); beep(105, 0.5, 'square', 0.035, 0.8, 0.15); };

  // ---------- canvas y campo ----------
  let W = 0, H = 0, L = 160, CX = 0, GY = 0, ARRIBA = 0, ABAJO = 0;
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // el campo va entre el HUD y los botones; el piso, un poco más abajo de la mitad
    const enJuego = state === 'play';
    const arriba = enJuego ? $('hud').getBoundingClientRect().bottom + 8 : 16;
    const abajo = enJuego ? $('pad').getBoundingClientRect().top - 10 : H - 16;
    const alto = Math.max(160, abajo - arriba);
    L = Math.max(110, Math.min(W / 2 - 12, 430, alto * 0.95));
    // en el menú, con la pantalla parada, el piso va más abajo así el demo se ve debajo del cartel
    CX = W / 2; GY = arriba + alto * (enJuego ? 0.66 : H > W ? 0.86 : 0.7); ARRIBA = arriba; ABAJO = arriba + alto;
  }
  addEventListener('resize', resize);
  const px = x => CX + x * L, py = y => GY - y * L;

  // ---------- estado ----------
  let state = 'menu';   // menu | play | end
  let G = null, shake = 0;
  let idSig = 1;

  function newRun(demo, d = 'normal') {
    const D = DIFS[d];
    G = {
      demo, diff: d, D, t: 0,
      fase: 'cuenta', faseT: demo ? 0.4 : 1.6, oleada: 0, quedan: 0, jefe: null,
      enemigos: [], voladores: [], particulas: [], floats: [], banner: null, aviso: null,
      proxSpawn: 0, proxMinion: 0, ultLlegada: -9, pend: null, vistos: {},
      score: 0, vidas: D.vidas, combo: 0, mejorCombo: 0, kills: 0,
      torpe: 0, invul: 0, parar: 0, ataque: null, retro: null, dano: -9, comboT: -9, mirar: 1,
      done: false, settled: false, r: null,
    };
  }
  const ahora = () => performance.now();
  const alcance = () => G.D.alcance;
  const frente = e => e.d - e.tam / 2;
  const vivo = e => e.est !== 'muerto';

  // el próximo enemigo de la oleada (todo sale de azar(), así el desafío del día es igual para todos)
  // generador con semilla (mulberry32): los enemigos que llegan mientras está el jefe usan uno aparte, así cuánto

  function semillado(a) {
    a >>>= 0;

  }
  function elegirTipo(w, soloFaciles, r0) {
    const pesos = [['comun', 10], ['rapido', w >= 2 ? 3 + w * 0.6 : 0]];
    if (!soloFaciles) pesos.push(['duro', w >= 3 ? 2 + w * 0.45 : 0], ['finta', w >= 4 ? 2 + w * 0.5 : 0]);
    // el primero de un tipo nuevo sale enseguida, para que lo conozcas solo
    for (const [k] of pesos) if (TIPOS[k].desde === w && !G.vistos[k] && w > 1) return k;
    let tot = 0; for (const [, p] of pesos) tot += p;
    let r = r0() * tot;
    for (const [k, p] of pesos) { r -= p; if (r <= 0) return k; }
    return 'comun';
  }
  function specNueva(lado, soloFaciles, r = azar) {
    const w = G.oleada, tipo = elegirTipo(w, soloFaciles, r), tp = TIPOS[tipo];
    const s = { tipo, lado: lado || (r() < 0.5 ? -1 : 1), vel: G.D.vel * tp.vel * velOla(w) * (0.92 + r() * 0.16) };
    if (tipo === 'finta') { s.fintaD = 0.62 + r() * 0.12; s.real = w < 6 || r() < 0.62; }

  // cuánto tarda en pisar la franja (para que nunca lleguen dos juntos)

  function crear(s) {
    const tp = TIPOS[s.tipo];

    if (s.tipo === 'jefe') { e.hp = e.hpMax = tp.hp + 2 * Math.floor((G.oleada - 1) / JEFE_CADA); e.vel = G.D.vel * tp.vel * Math.min(1.5, velOla(G.oleada)); }

  }
  function llegaJefe() {
    G.fase = 'jefe';

    G.azarJefe = semillado(Math.floor(azar() * 4294967296));
    G.proxMinion = G.t + 2.2;
    if (!G.demo) { G.banner = { text: T('¡Jefe!'), t: ahora() }; sfxJefe(); CC?.vibrar(30); shake = reduceMotion ? 0 : 6; }
  }

  // ---------- golpes ----------
  function golpear(lado) {
    if (!G || G.done || G.fase === 'cuenta') return;

  function errar(lado, texto, bloqueo) {

  function pegar(e) {

        sfxGolpe(G.combo); sfxKO(); CC?.vibrar(e.tipo === 'jefe' ? 60 : 14);

  // un enemigo te alcanzó

  // ---------- actualizar ----------
  function update(now, dt) {

    G.torpe = Math.max(0, G.torpe - dt);
    G.invul = Math.max(0, G.invul - dt);

    if (G.fase === 'cuenta') {

  }
  function moverEnemigos(dt) {
    for (const e of G.enemigos) {

      if (e.tipo === 'jefe') e.ciclo += dt;
      if (e.est === 'aturdido') { e.estT -= dt; if (e.estT <= 0) e.est = 'corre'; continue; }
      if (e.est === 'amaga') {
        e.estT -= dt;

        continue;

  // en el menú se juega solo: le pega al que pisa la franja, con un poquito de demora
  function demoIA() {

      let b = null;
      for (const e of G.enemigos) if (e.lado === lado && e.est !== 'salta' && frente(e) <= alcance() - 0.07 && (!b || e.d < b.d)) b = e;

    $('eLogros').replaceChildren(...lg.map(n => Object.assign(document.createElement('span'), { className: 'logro', textContent: n })));

  }
  const LOCALE = (CC && CC.LOCALE) || 'es-AR';

  function showEnd() {
    state = 'end';
    $('end').hidden = false; $('hud').hidden = true;
    $('pad').classList.add('off');
    soltar();
    setTimeout(() => $('btnAgain').focus({ preventScroll: true }), 50);
  }
  const volver = () => { cortar(); if (CC) CC.volver(); else location.href = 'index.html'; };
  const verRanking = t => CC?.verRanking({ juego: 'guardia', tabla: t });
  $('btnPlay').addEventListener('click', start);
  $('btnAgain').addEventListener('click', start);
  $('btnBack').addEventListener('click', volver);
  $('btnHome').addEventListener('click', volver);
  $('btnMenu').addEventListener('click', showMenu);
  $('btnRank').addEventListener('click', () => verRanking(dif()));
  $('btnRank2').addEventListener('click', () => verRanking(G ? G.diff : dif()));
  $('btnQuit').addEventListener('click', showMenu);
  $('btnRestart').addEventListener('pointerdown', e => { e.preventDefault(); restart(); });
  $('btnMute').addEventListener('click', () => { muted = !muted; rec.muted = muted; saveRec(); renderMenu(); if (!muted) beep(660, 0.08); });

  // ---------- entrada: cada toque es un golpe ----------
  function boton(btn, lado) {
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      btn.classList.add('on'); setTimeout(() => btn.classList.remove('on'), 110);
      if (state === 'play') golpear(lado);
    });
    btn.addEventListener('contextmenu', e => e.preventDefault());
  }
  boton($('bL'), -1); boton($('bR'), 1);
  const LADO = { ArrowLeft: -1, ArrowRight: 1, a: -1, A: -1, d: 1, D: 1 };
  addEventListener('keydown', e => {
    if (document.getElementById('cc-rank')) return;   // la ventana del ranking maneja su teclado
    const k = e.key;
    if (state === 'play') {
      if (LADO[k]) {
        e.preventDefault();
        if (e.repeat) return;   // dejar apretado no pega de nuevo
        const b = LADO[k] < 0 ? $('bL') : $('bR');
        b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 110);
        golpear(LADO[k]);
        return;
      }
      if (k === 'Escape') showMenu();
      else if ((k === 'r' || k === 'R') && !e.repeat) restart();
    } else if (state === 'menu') {
      if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); if (sel && !DIA) sel.siguiente(k === 'ArrowUp' ? -1 : 1); }
      else if (k === 'Enter' && document.activeElement === document.body) start();
      else if (k === 'Escape') volver();
    } else if (state === 'end') {
      if ((k === 'r' || k === 'R') && !e.repeat) start();
      else if (k === 'Escape') showMenu();
      else if ((k === 'Enter' || k === ' ') && document.activeElement === document.body) { e.preventDefault(); start(); }
    }
  });

  // ---------- arranque ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(now, dt); draw(now);
    requestAnimationFrame(frame);
  }
  showMenu();
  requestAnimationFrame(frame);
  if (CC && CC.pedirApodo) setTimeout(() => CC.pedirApodo(), 600);
})();
</script>
