<title>Cubo Escalador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: perfil arriba, un juego por pantalla en slides horizontales, barra de secciones abajo */
:root {
  --ink: #1d2340;
  --paper: #fffaf0;
  --cube: #ffcc29;
  --accent: #ff5d7d;
  --muted: #5b6382;
  --bg: #62c6ff;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gx: max(16px, env(safe-area-inset-left, 0px));
  --gy: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  overflow: hidden; transition: background-color .35s ease;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: var(--ink); }
.app { height: 100%; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }

/* ---------- arriba ---------- */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px var(--gy) 2px var(--gx);
}
.brand { font-family: var(--display); font-size: 22px; color: var(--paper); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 var(--ink); white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 8px; min-width: 0; }
.install {
  display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; cursor: pointer;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
  font-weight: 800; font-size: 13px; white-space: nowrap;
}
.install svg { width: 20px; height: 20px; flex: none; }
.install:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.me {
  position: relative; display: flex; align-items: center; gap: 8px; cursor: pointer;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink);
  padding: 3px 10px 3px 4px; min-width: 0;
}
.me:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.me canvas { width: 40px; height: 44px; flex: none; }
.me-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; text-align: left; }
.me-lvl { font-family: var(--display); font-size: 16px; line-height: 1; white-space: nowrap; }
.bar { width: 84px; height: 8px; border-radius: 99px; background: #e6e2d6; border: 2px solid var(--ink); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.me-edit { font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.badge {
  position: absolute; top: -10px; right: -8px; padding: 2px 7px; border-radius: 99px;
  background: var(--accent); color: var(--paper); border: 2.5px solid var(--ink);
  font: 400 13px/1.1 var(--display); letter-spacing: .02em; animation: latir 1.4s ease-in-out infinite;
}
@keyframes latir { 50% { transform: scale(1.12) rotate(-4deg); } }

/* ---------- slides ---------- */
.slides {
  display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
  scrollbar-width: none; overscroll-behavior-x: contain; min-height: 0;
}
.slides::-webkit-scrollbar { display: none; }
.slide {
  flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 6px var(--gy) 8px var(--gx); min-height: 0;
}
.head { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.slide h2 {
  margin: 0; font-family: var(--display); font-weight: 400; line-height: 1; text-align: center;
  font-size: clamp(38px, 10.5vw, 60px); color: var(--paper);
  -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink);
}
.nuevo {
  display: inline-block; vertical-align: top; margin-left: 6px; padding: 3px 8px 2px; border-radius: 10px; transform: rotate(6deg);
  background: var(--accent); color: var(--paper); border: 2.5px solid var(--ink); -webkit-text-stroke: 0;
  font: 400 15px/1 var(--display); text-shadow: none; box-shadow: 0 3px 0 var(--ink);
}
.stage {
  position: relative; width: min(480px, 100%); flex: 1 1 auto; min-height: 120px; max-height: 330px;
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 7px 0 var(--ink); overflow: hidden; background: var(--paper);
}
.stage canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.info {
  width: min(480px, 100%); display: flex; flex-direction: column; gap: 10px;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); padding: 12px 14px;
}
.info p { margin: 0; font-size: 15px; line-height: 1.4; }
.row { display: flex; align-items: center; gap: 10px; }
.rec { flex: 1; min-width: 0; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rec b { display: block; font-family: var(--display); font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 19px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec small { display: block; margin-top: 2px; font-size: 11px; letter-spacing: 0; text-transform: none; }
.icon-btn {
  flex: none; width: 52px; height: 52px; display: grid; place-items: center; cursor: pointer;
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink);
}
.icon-btn svg { width: 26px; height: 26px; }
.icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.play {
  flex: none; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px 0 16px; cursor: pointer;
  font: 400 22px var(--display); background: var(--cube);
  border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink);
}
.play svg { width: 20px; height: 20px; }
.play:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }

/* flechas y puntos */
.pager { display: flex; align-items: center; justify-content: center; gap: 10px; width: min(480px, 100%); }
.arrow {
  flex: none; width: 48px; height: 44px; display: grid; place-items: center; cursor: pointer;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
}
.arrow svg { width: 24px; height: 24px; }
.arrow:active, .arrow.on { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); background: var(--cube); }
.dots { flex: 1; min-width: 0; display: flex; justify-content: center; align-items: center; gap: 4px; }
.dots button { flex: none; width: 9px; height: 9px; padding: 0; border-radius: 99px; border: 2px solid var(--ink); background: var(--paper); cursor: pointer; }
.dots button[aria-current="true"] { width: 20px; background: var(--cube); }
.all {
  flex: none; height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; cursor: pointer;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); font-weight: 800; font-size: 13px;
}
.all svg { width: 18px; height: 18px; }
.all:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

/* ---------- barra de abajo ---------- */
.tabs {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: min(560px, 100%); margin: 0 auto;
  padding: 6px var(--gy) calc(env(safe-area-inset-bottom, 0px) + 10px) var(--gx);
}
.tab {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  height: 58px; cursor: pointer; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink);
  font-weight: 800; font-size: 12px;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { background: var(--cube); }
.tab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.tab .badge { top: -9px; right: -4px; font-size: 12px; }

/* ---------- hojas (personaje, logros, ranking, todos) ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(29, 35, 64, .5);
  padding: 16px var(--gy) calc(env(safe-area-inset-bottom, 0px) + 12px) var(--gx);
}
.card {
  width: min(500px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink); overflow: hidden;
  animation: subir .22s ease-out;
}
@keyframes subir { from { transform: translateY(24px); opacity: 0; } }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px 18px; }
.card-h h3 { margin: 0; flex: 1; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; }
.x { width: 44px; height: 44px; flex: none; cursor: pointer; border-radius: 12px; border: 3px solid var(--ink); background: #fff; font: 700 20px/1 system-ui; }
.card-b { overflow-y: auto; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.preview { display: flex; align-items: center; gap: 14px; }
.preview canvas { width: 112px; height: 120px; flex: none; background: #e9f6ff; border: 2.5px solid var(--ink); border-radius: 16px; }
.preview b { font-family: var(--display); font-weight: 400; font-size: 24px; display: block; line-height: 1.05; }
.preview .sub { font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.35; margin-top: 4px; }
.preview .bar { width: 100%; margin-top: 8px; height: 10px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: #ece8dc; border: 2.5px solid var(--ink); border-radius: 14px; }
.seg button { height: 40px; border: 0; border-radius: 10px; background: transparent; font-weight: 800; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--paper); box-shadow: inset 0 0 0 2.5px var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; }
.item {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 7px; cursor: pointer;
  font-weight: 600; font-size: 12px; background: #fff;
  border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink);
}
.item canvas { width: 60px; height: 64px; }
.item[aria-pressed="true"] { background: var(--cube); }
.item.lock { cursor: default; background: #ece8dc; box-shadow: none; color: var(--muted); }
.item.lock canvas { opacity: .35; filter: grayscale(1); }
.item small { font-weight: 800; font-size: 10px; line-height: 1.2; text-align: center; }
.item .badge { top: -8px; right: -6px; font-size: 11px; animation: none; }
.tip { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.4; }
.apodo { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 2.5px dashed rgba(29,35,64,.35); border-radius: 14px; font-size: 14px; }
.apodo b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini {
  height: 40px; padding: 0 14px; cursor: pointer; flex: none;
  background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); font-weight: 800; font-size: 13px;
}
.mini:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

/* logros */
.resumen { display: flex; align-items: center; gap: 12px; }
.resumen b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; }
.medallas { display: flex; gap: 6px; flex-wrap: wrap; }
.med { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; }
.med i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); }
.grupo h4 { margin: 4px 0 8px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.logro { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 14px; background: #fff; border: 2.5px solid var(--ink); margin-bottom: 8px; }
.logro.no { background: transparent; border-style: dashed; border-color: rgba(29,35,64,.35); }
.logro .m { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font: 400 18px var(--display); }
.logro.no .m { background: #ece8dc !important; border-color: rgba(29,35,64,.4); color: rgba(29,35,64,.4); }
.logro .t { flex: 1; min-width: 0; }
.logro .t b { display: block; font-size: 14px; }
.logro .t span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.3; }
.prog { margin-top: 5px; height: 7px; border-radius: 99px; background: #e6e2d6; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); }
.logro .xp { flex: none; font-size: 12px; font-weight: 800; color: var(--muted); }

/* lista de juegos (ranking y todos) */
.juegos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.jg {
  display: flex; flex-direction: column; align-items: stretch; gap: 0; padding: 0; overflow: hidden; cursor: pointer; text-align: left;
  border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); background: #fff;
}
.jg canvas { width: 100%; height: 76px; display: block; border-bottom: 2.5px solid var(--ink); }
.jg span { padding: 7px 10px 2px; font: 400 18px/1.1 var(--display); }
.jg small { padding: 0 10px 8px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jg:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

/* ayuda de la primera vez */
.coach {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translateX(-50%); z-index: 5;
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; pointer-events: none;
  background: var(--ink); color: var(--paper); border-radius: 14px; font-weight: 800; font-size: 14px; white-space: nowrap;
}
.coach svg { width: 28px; height: 28px; animation: deslizar 1.4s ease-in-out infinite; }
@keyframes deslizar { 0%, 100% { transform: translateX(8px); } 50% { transform: translateX(-8px); } }

button:focus-visible, .me:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (max-height: 700px) { .info p { display: none; } .slide { gap: 8px; } }
@media (max-height: 600px) { .tab { height: 48px; } .tab span { display: none; } }
@media (max-width: 400px) { .brand { font-size: 18px; } .bar { width: 64px; } .install span { display: none; } .all span { display: none; } }
@media (max-width: 340px) { .brand { display: none; } }
@media (prefers-reduced-motion: reduce) { body { transition: none; } .badge, .coach svg, .card { animation: none; } }
</style>

      <span>Juegos</span></button>

      <span>Logros</span></button>
    <button class="tab" type="button" data-tab="ranking">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M9 20V8h6v12zM3 20v-7h6v7zM15 20v-9h6v9z"/><path d="m12 2.6.8 1.7 1.8.2-1.3 1.2.3 1.8-1.6-.9-1.6.9.3-1.8-1.3-1.2 1.8-.2z" fill="currentColor" stroke-width="1"/></svg>
      <span>Ranking</span></button>
  </nav>
</div>

<!-- logros -->

  <span id="coachTxt">Deslizá para ver los 11 juegos</span>
</div>

<script src="cubo-comun.js"></script>
<script>
(() => {
  'use strict';
  const CC = window.CuboComun;
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tactil = matchMedia('(hover: none)').matches;
  const INK = '#1d2340', PAPER = '#fffaf0';
  const guardado = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; };

  // ---------- dibujos de cada juego ----------
  function rr(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);

    c.lineCap = 'butt';
    CC.dibujarCubo(c, w * 0.15, mesa, s, { mirar: 1, t });
    CC.dibujarCubo(c, w * 0.85, mesa, s, { mirar: -1, t, skin: rival('menta'), efecto: false });
    const lado = Math.floor(t / 130) % 2;
    for (const [k, x] of [[0, w * 0.36], [1, w * 0.64]]) {
      c.fillStyle = k === lado ? '#ffcc29' : PAPER; c.strokeStyle = INK; c.lineWidth = 2.5;
      rr(c, x - s * 0.3, h * 0.08, s * 0.6, s * 0.48, s * 0.12); c.fill(); c.stroke();
      c.fillStyle = INK; c.beginPath(); const d = k ? 1 : -1, cx = x, cy = h * 0.08 + s * 0.24;
      c.moveTo(cx + d * s * 0.14, cy); c.lineTo(cx - d * s * 0.08, cy - s * 0.13); c.lineTo(cx - d * s * 0.08, cy + s * 0.13); c.closePath(); c.fill();
    }
  }

  const DIBUJOS = { escalador: ilEscalador, lluvia: ilLluvia, clasificador: ilClasificador, equilibrio: ilEquilibrio, ritmo: ilRitmo,
    voley: ilVoley, paseo: ilPaseo, serpiente: ilSerpiente, cohete: ilCohete, esqui: ilEsqui, pulseada: ilPulseada };
  const DESC = {
    escalador: 'Tocá el lado donde está el próximo escalón. Si errás, te mareás medio segundo. Sprint 100: ¿bajás de 11 segundos?',
    lluvia: 'Movete entre carriles y esquivá los bloques que caen cada vez más rápido.',
    clasificador: 'Mandá cada cubo a la caja de su color con ◀ o ▶. Mirá la fila para leer adelante.',
    equilibrio: 'Corregí la tabla con izquierda y derecha para que no te tire el viento.',
    ritmo: 'Tocá el lado de cada nota justo cuando llega a la línea, al ritmo de la música.',
    voley: 'Movete con ◀ ▶ y el cubo devuelve solo. Pegale con el borde para cruzarla. ¿Cuántos puntos le hacés al rival?',
    paseo: 'Alterná ◀ ▶ para caminar con tu mascota. Cuando tire para un lado, tirá vos para el otro.',
    serpiente: '◀ dobla a la izquierda y ▶ a la derecha, según hacia dónde vas. Comé y no te choques la cola.',
    cohete: 'Cada flecha prende un propulsor: ◀ y ▶ juntos para subir derecho. Esquivá los asteroides.',
    esqui: 'Mantené ◀ o ▶ para doblar y pasá entre las banderas. Cada vez más rápido.',
    pulseada: 'Alterná ◀ ▶ lo más rápido que puedas para ganarle la fuerza al rival. ¿Cuántos toques por segundo hacés?',
  };
  const JUEGOS = CC.JUEGOS.map(j => ({ ...j, dibujo: DIBUJOS[j.id], desc: DESC[j.id] }));

  // ---------- slides ----------
  const slides = $('slides');
  const ICO_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  const ICO_RANK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M9 20V8h6v12zM3 20v-7h6v7zM15 20v-9h6v9z"/></svg>';
  const ICO_PREV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg>';
  const ICO_NEXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg>';
  const ICO_ALL = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>';

  JUEGOS.forEach((g, i) => {
    const s = document.createElement('section');
    s.className = 'slide'; s.id = g.id; s.setAttribute('aria-label', `${g.nombre}, juego ${i + 1} de ${JUEGOS.length}`);
    s.innerHTML = `<div class="head"><h2>${g.nombre}${g.nuevo ? '<span class="nuevo">Nuevo</span>' : ''}</h2></div>
      <div class="pager">
        <button class="arrow" type="button" data-ir="-1" aria-label="Juego anterior">${ICO_PREV}</button>
        <div class="dots" aria-hidden="true"></div>
        <button class="arrow" type="button" data-ir="1" aria-label="Juego siguiente">${ICO_NEXT}</button>
      </div>
      <div class="stage"><canvas aria-hidden="true"></canvas></div>
      <div class="info"><p>${g.desc}</p><div class="row">
        <span class="rec">Tu récord<b data-rec>—</b><small data-logros></small></span>
        <button class="icon-btn" type="button" data-rank aria-label="Ranking de ${g.nombre}">${ICO_RANK}</button>
        <button class="play" type="button">${ICO_PLAY}Jugar</button></div></div>`;
    s.querySelector('.play').addEventListener('click', () => jugar(i));
    s.querySelector('canvas').addEventListener('click', () => jugar(i));
    s.querySelector('[data-rank]').addEventListener('click', () => CC.verRanking({ juego: g.id }));
    for (const b of s.querySelectorAll('[data-ir]')) b.addEventListener('click', () => ir(actual + +b.dataset.ir));
    const dots = s.querySelector('.dots');
    JUEGOS.forEach((_, k) => { const d = document.createElement('button'); d.type = 'button'; d.tabIndex = -1; if (k === i) d.setAttribute('aria-current', 'true'); d.addEventListener('click', () => ir(k)); dots.appendChild(d); });
    slides.appendChild(s);
    g.cv = s.querySelector('canvas');
  });
  // "Ver todos" al lado de los puntos, solo en el primer pager visible de cada slide
  for (const p of slides.querySelectorAll('.pager')) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'all'; b.innerHTML = `${ICO_ALL}<span>Todos</span>`; b.setAttribute('aria-label', 'Ver todos los juegos');
    b.addEventListener('click', () => abrirJuegos('todos'));
    p.insertBefore(b, p.lastElementChild);
  }

  const SLIDE_KEY = 'cubo-hub-slide';
  let actual = 0, listo = false;
  function marcar(i) {
    actual = i;
    document.documentElement.style.setProperty('--bg', JUEGOS[i].color);
    guardado(SLIDE_KEY, String(i));
  }
  function ir(i, suave = true) {
    i = (i + JUEGOS.length) % JUEGOS.length;
    slides.scrollTo({ left: i * slides.clientWidth, behavior: suave && !reduceMotion ? 'smooth' : 'auto' });
    marcar(i);
  }
  function jugar(i) { location.href = JUEGOS[i].archivo; }
  slides.addEventListener('scroll', () => {
    const i = Math.round(slides.scrollLeft / Math.max(1, slides.clientWidth));
    if (i !== actual && i >= 0 && i < JUEGOS.length) { marcar(i); if (listo) ocultarCoach(); }
  }, { passive: true });

  // ---------- ayuda de la primera vez ----------
  function ocultarCoach() { if (!$('coach').hidden) { $('coach').hidden = true; guardado('cubo-hub-coach', '1'); } }
  if (!guardado('cubo-hub-coach')) {
    $('coachTxt').textContent = tactil ? `Deslizá para ver los ${JUEGOS.length} juegos` : `Usá ← → para ver los ${JUEGOS.length} juegos`;
    $('coach').hidden = false;
    setTimeout(ocultarCoach, 7000);
  }

  // ---------- perfil ----------
  function mejorTexto(g, p) {
    if (p.records[g.id]) return p.records[g.id];
    let m = null, tb = null;
    for (const t of g.tablas) { const v = p.mejores[g.id + ':' + t.id]; if (v != null && (m == null || (t.orden === 'menor' ? v < m : v > m))) { m = v; tb = t; } }
    return m == null ? '—' : CC.formato(m, tb);
  }
  function pintarPerfil() {
    const p = CC.perfil();
    $('meLvl').textContent = 'Nivel ' + p.nivel;
    $('meBar').style.width = Math.round(100 * p.enNivel / p.paraSiguiente) + '%';
    const n = CC.nuevos().length;
    $('meBadge').hidden = !n; $('tabBadge').hidden = !n; $('tabBadge').textContent = n;
    JUEGOS.forEach((g, i) => {
      const s = slides.children[i];
      s.querySelector('[data-rec]').textContent = mejorTexto(g, p);
      const ls = CC.LOGROS.filter(l => l.juego === g.id);
      s.querySelector('[data-logros]').textContent = ls.length ? `${ls.filter(l => p.logros[l.id]).length} de ${ls.length} logros` : '';
    });
  }

  // ---------- hojas ----------
  let abierta = null, previo = null;
  function abrir(id) {
    cerrar(true);
    previo = document.activeElement;
    abierta = $(id); abierta.hidden = false;
    abierta.querySelector('[data-cerrar]').focus({ preventScroll: true });
  }
  function cerrar(sinFoco) {
    if (!abierta) return;
    abierta.hidden = true; abierta = null;
    marcarTab('juegos'); pintarPerfil();
    if (!sinFoco && previo && previo.focus) previo.focus({ preventScroll: true });
  }
  for (const sh of document.querySelectorAll('.sheet')) {
    sh.addEventListener('click', e => { if (e.target === sh || e.target.closest('[data-cerrar]')) cerrar(); });
  }
  function marcarTab(id) {
    for (const b of document.querySelectorAll('.tab')) { if (b.dataset.tab === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }
  }
  for (const b of document.querySelectorAll('.tab')) {
    b.addEventListener('click', () => {
      const t = b.dataset.tab;
      if (t === 'juegos') { cerrar(); return; }
      if (t === 'personaje') abrirPersonaje();
      if (t === 'logros') abrirLogros();
      if (t === 'ranking') abrirJuegos('ranking');
      marcarTab(t);
    });
  }

  // personaje
  let seg = 'skins';
  function requisito(it) {
    if (it.logro) { const l = CC.LOGROS.find(x => x.id === it.logro); return 'Logro: ' + (l ? l.nombre : it.logro); }
    return 'Nivel ' + it.nivel;
  }
  function pintarItems() {
    const p = CC.perfil(), box = $('items'), nuevos = CC.nuevos();
    box.innerHTML = '';
    for (const b of document.querySelectorAll('[data-seg]')) b.setAttribute('aria-pressed', String(b.dataset.seg === seg));
    const lista = seg === 'skins' ? CC.SKINS : CC.EFECTOS;
    for (const it of lista) {
      const libre = CC.libre(it), elegido = seg === 'skins' ? p.skin.id === it.id : p.efecto.id === it.id;
      const nuevo = nuevos.includes(seg === 'skins' ? it.id : 'fx:' + it.id);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'item' + (libre ? '' : ' lock');
      b.setAttribute('aria-pressed', String(elegido));
      if (!libre) b.setAttribute('aria-disabled', 'true');
      b.innerHTML = `<canvas width="120" height="128"></canvas><span>${it.nombre}</span>${libre ? '' : `<small>${requisito(it)}</small>`}${nuevo ? '<span class="badge">Nuevo</span>' : ''}`;
      it._cv = b.querySelector('canvas');
      b.addEventListener('click', () => {
        if (!libre) { CC.avisar(`<div><b>${it.nombre}</b><span>Se desbloquea con ${requisito(it).replace('Logro: ', 'el logro ')}.</span></div>`, 2400); return; }
        if (seg === 'skins' ? CC.elegirSkin(it.id) : CC.elegirEfecto(it.id)) { CC.vibrar(10); pintarPersonaje(); }
      });
      box.appendChild(b);
    }
  }
  function pintarPersonaje() {
    const p = CC.perfil();
    $('bigName').textContent = p.skin.nombre + (p.efecto.id !== 'ninguno' ? ' · ' + p.efecto.nombre : '');
    $('bigLvl').textContent = `Nivel ${p.nivel} · ${p.enNivel} / ${p.paraSiguiente} XP`;
    $('bigBar').style.width = Math.round(100 * p.enNivel / p.paraSiguiente) + '%';
    const todos = [...CC.SKINS, ...CC.EFECTOS].filter(i => !i.logro && i.nivel > p.nivel).sort((a, b) => a.nivel - b.nivel);
    $('bigNext').textContent = todos.length ? `En nivel ${todos[0].nivel} desbloqueás ${todos.filter(i => i.nivel === todos[0].nivel).map(i => i.nombre).join(' y ')}.` : 'Ya desbloqueaste todo lo que da el nivel.';
    $('apodoTxt').textContent = p.apodo || 'Todavía no tenés';
    pintarItems();
  }
  function abrirPersonaje() {
    pintarPersonaje();
    abrir('sheetPersonaje');
    setTimeout(() => { CC.marcarVistos(); pintarPerfil(); }, 600);
  }
  for (const b of document.querySelectorAll('[data-seg]')) b.addEventListener('click', () => { seg = b.dataset.seg; pintarItems(); });
  $('me').addEventListener('click', () => { abrirPersonaje(); marcarTab('personaje'); });
  $('apodoBtn').addEventListener('click', () => CC.verRanking({ juego: JUEGOS[actual].id, alCerrar: pintarPersonaje }));

  // logros
  function abrirLogros() {
    const p = CC.perfil(), box = $('logros');
    const total = CC.LOGROS.length, hechos = CC.LOGROS.filter(l => p.logros[l.id]);
    const cuenta = m => hechos.filter(l => l.medalla === m).length;
    box.innerHTML = `<div class="resumen"><b>${hechos.length} / ${total}</b><div class="medallas">${Object.entries(CC.MEDALLAS).map(([k, m]) =>
      `<span class="med"><i style="background:${m.color}"></i>${cuenta(k)}</span>`).join('')}</div></div>
      <p class="tip">Bronce sale jugando, plata con práctica, oro es para muy buenos y diamante, para muy pocos. Cada logro da XP y algunos desbloquean personajes y efectos.</p>`;
    const grupos = [['General', CC.LOGROS.filter(l => !l.juego)], ...JUEGOS.map(g => [g.nombre, CC.LOGROS.filter(l => l.juego === g.id)])];
    for (const [nombre, ls] of grupos) {
      if (!ls.length) continue;
      const g = document.createElement('div'); g.className = 'grupo';
      g.innerHTML = `<h4>${nombre}</h4>`;
      for (const l of ls) {
        const m = CC.MEDALLAS[l.medalla], ok = !!p.logros[l.id];
        const premio = [...CC.SKINS, ...CC.EFECTOS].filter(i => i.logro === l.id).map(i => i.nombre);
        let prog = '';
        if (!ok && l.progreso) { try { const [a, b] = l.progreso(p); prog = `<div class="prog"><i style="width:${Math.min(100, Math.round(100 * a / b))}%"></i></div>`; } catch (e) {} }
        const el = document.createElement('div');
        el.className = 'logro' + (ok ? '' : ' no');
        el.innerHTML = `<span class="m" style="background:${m.color}">${ok ? '★' : '?'}</span><span class="t"><b>${l.nombre}</b><span>${l.desc}${premio.length ? ' Premio: ' + premio.join(', ') + '.' : ''}</span>${prog}</span><span class="xp">+${m.xp}</span>`;
        g.appendChild(el);
      }
      box.appendChild(g);
    }
    abrir('sheetLogros');
  }

  // elegir juego (ranking / todos)
  let modoJuegos = 'ranking';
  function abrirJuegos(modo) {
    modoJuegos = modo;
    const p = CC.perfil();
    $('tJue').textContent = modo === 'ranking' ? 'Ranking' : 'Todos los juegos';
    $('jueTip').textContent = modo === 'ranking'
      ? (p.apodo ? `Jugás como ${p.apodo}. Elegí un juego para ver el ranking online.` : 'Elegí un juego para ver el ranking. Poné tu apodo para aparecer.')
      : 'Elegí un juego para ir directo.';
    const box = $('juegos'); box.innerHTML = '';
    JUEGOS.forEach((g, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'jg';
      b.innerHTML = `<canvas></canvas><span>${g.nombre}</span><small>${mejorTexto(g, p) === '—' ? (g.nuevo ? '¡Nuevo!' : 'Sin jugar') : 'Récord: ' + mejorTexto(g, p)}</small>`;
      b.addEventListener('click', () => {
        if (modoJuegos === 'ranking') CC.verRanking({ juego: g.id });
        else { cerrar(true); ir(i, false); }
      });
      box.appendChild(b);
      g.mini = b.querySelector('canvas');
    });
    abrir('sheetJuegos');
    requestAnimationFrame(() => JUEGOS.forEach(g => { const [c, w, h] = tam(g.mini); g.dibujo(c, w, h, 1400); }));
  }

  // ---------- teclado ----------
  const flash = el => { if (!el) return; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 110); };
  addEventListener('keydown', e => {
    if (document.getElementById('cc-rank')) return;
    if (abierta) { if (e.key === 'Escape') cerrar(); return; }
    const s = slides.children[actual];
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); flash(s.querySelector('[data-ir="-1"]')); ir(actual - 1); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); flash(s.querySelector('[data-ir="1"]')); ir(actual + 1); }
    else if ((e.key === 'Enter' || e.key === ' ') && (document.activeElement === document.body || document.activeElement?.classList.contains('arrow'))) { e.preventDefault(); jugar(actual); }
  });

  // ---------- instalar como app ----------
  let pedido = null;
  const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedido = e; $('install').hidden = false; });
  addEventListener('appinstalled', () => { $('install').hidden = true; CC.avisar('<div><b>¡Instalado!</b><span>Ya lo podés abrir sin internet.</span></div>'); });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios && !instalada) $('install').hidden = false;
  $('install').addEventListener('click', async () => {
    if (pedido) { pedido.prompt(); const r = await pedido.userChoice.catch(() => null); if (r && r.outcome === 'accepted') $('install').hidden = true; pedido = null; return; }
    CC.avisar('<div><b>Instalalo en tu iPhone</b><span>Tocá Compartir y después "Agregar a inicio". Funciona sin internet.</span></div>', 5000);
  });

  // ---------- dibujo ----------
  function tam(cv) {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    return [c, w, h];
  }
  function dibujar(i, t) { const g = JUEGOS[i]; const [c, w, h] = tam(g.cv); g.dibujo(c, w, h, t); }
  function todo() { JUEGOS.forEach((_, i) => dibujar(i, 1400)); }
  function avatar(t) {
    const a = $('avatar').getContext('2d');
    a.setTransform(2, 0, 0, 2, 0, 0); a.clearRect(0, 0, 40, 44);
    CC.dibujarCubo(a, 20, 40, 24, { t, efecto: false });
  }
  function frame(now) {
    if (!document.hidden) {
      if (!reduceMotion) { if (!abierta) dibujar(actual, now); avatar(now); }
      if (abierta && abierta.id === 'sheetPersonaje') {
        const c = $('big').getContext('2d'); c.setTransform(2, 0, 0, 2, 0, 0); c.clearRect(0, 0, 112, 120);
        CC.dibujarCubo(c, 56, 104 - bob(now) * (reduceMotion ? 0 : 8), 52, { t: now, mirar: Math.sin(now / 900) });
        for (const it of (seg === 'skins' ? CC.SKINS : CC.EFECTOS)) {
          if (!it._cv) continue;
          const k = it._cv.getContext('2d'); k.setTransform(2, 0, 0, 2, 0, 0); k.clearRect(0, 0, 60, 64);
          if (seg === 'skins') CC.dibujarCubo(k, 30, 58, 30, { skin: it, t: reduceMotion ? 0 : now, efecto: false });
          else CC.dibujarCubo(k, 30, 56, 26, { t: reduceMotion ? 900 : now, efecto: it.id });
        }
      }
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { todo(); slides.scrollLeft = actual * slides.clientWidth; });
  addEventListener('pageshow', pintarPerfil); // al volver de un juego con "atrás"

  // ---------- arranque ----------
  let inicio = +(guardado(SLIDE_KEY) || 0) || 0;
  const porHash = JUEGOS.findIndex(g => '#' + g.id === location.hash);
  if (porHash >= 0) inicio = porHash;
  pintarPerfil(); avatar(0);
  requestAnimationFrame(() => { todo(); ir(Math.min(Math.max(0, inicio), JUEGOS.length - 1), false); setTimeout(() => { listo = true; }, 400); });
  requestAnimationFrame(frame);
})();
</script>
