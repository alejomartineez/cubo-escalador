<title>Lluvia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: canvas a pantalla completa con 4 carriles centrados; HUD arriba, dos botones gigantes abajo, menús como cartel de juguete */
:root {
  --sky: #62c6ff;
  --ink: #1d2340;
  --paper: #fffaf0;
  --cube: #ffcc29;
  --accent: #ff5d7d;
  --good: #1fbf8a;
  --muted: #5b6382;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
  pointer-events: none;
}
.stat { display: flex; flex-direction: column; line-height: 1; }
.stat.mid { align-items: center; }
.big {
  font-family: var(--display); font-size: clamp(34px, 7vw, 52px);
  color: var(--paper); font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--ink);
}
.lbl {
  font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--paper);
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 0 var(--ink);
  margin-top: 6px;
}
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chip {
  font-weight: 800; font-size: 13px; padding: 5px 10px; border-radius: 999px;
  background: var(--paper); border: 2px solid var(--ink); font-variant-numeric: tabular-nums;
  transition: background .15s;
}
.chip.hot { background: var(--cube); }
.smallbtn {
  pointer-events: auto; font: 800 13px var(--body); color: var(--ink);
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; box-shadow: 0 3px 0 var(--ink); cursor: pointer;
}
.smallbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.pad {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  max-width: 560px; margin: 0 auto;
}
.pad.off { visibility: hidden; }
.pad button {
  height: clamp(76px, 13vh, 116px); border-radius: 22px;
  background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
  display: grid; place-items: center; cursor: pointer; touch-action: none;
  transition: transform .05s, box-shadow .05s;
}
.pad button svg { width: 44px; height: 44px; }
.pad button.on { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); background: var(--cube); }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(29, 35, 64, .28);
}
.card {
  width: min(400px, 100%); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
  padding: 22px; display: flex; flex-direction: column; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 48px; height: 48px; flex: none; border-radius: 10px; background: var(--cube);
  border: 3px solid var(--ink); position: relative; transform: rotate(-6deg);
}
.logo::before, .logo::after {
  content: ""; position: absolute; top: 13px; width: 8px; height: 11px; border-radius: 4px; background: var(--ink);
}
.logo::before { left: 11px; } .logo::after { right: 11px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: clamp(32px, 9vw, 42px); }
h2 { font-size: 34px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.intro b { color: var(--ink); }
.go { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: stretch; }
.best {
  display: flex; flex-direction: column; justify-content: center; padding: 6px 14px;
  border: 3px solid var(--ink); border-radius: 14px; background: #fff;
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.best b { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; line-height: 1.1; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
kbd { font: 800 12px var(--body); border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; color: var(--ink); background: #fff; }

.result { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.result .num { font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.result .sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.back { align-self: flex-start; }
.hbtns { display: flex; gap: 8px; }
.smallbtn.icon { font-size: 17px; line-height: 1; padding: 5px 12px; }
.diffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.diff {
  font: 800 15px var(--body); color: var(--ink); cursor: pointer; padding: 9px 4px 8px;
  background: #fff; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.diff small { font-size: 11px; font-weight: 600; color: var(--muted); }
.diff[aria-checked="true"] { background: var(--cube); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.diff[aria-checked="true"] small { color: var(--ink); }
.diff:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.xp {
  font-family: var(--display); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums;
  background: var(--cube); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 14px; margin-top: 4px;
}
.badge {
  font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  background: var(--good); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px;
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  font: 800 16px var(--body); color: var(--ink); padding: 14px 10px; cursor: pointer;
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
}
.btn.primary { background: var(--cube); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (max-width: 380px) { .card { padding: 18px; } }
</style>

<canvas id="cv"></canvas>

<div class="hud" id="hud" hidden>
  <div class="stat"><span class="big" id="hScore">0</span><span class="lbl">puntos</span></div>
  <div class="stat mid"><span class="big" id="hTime">0.0</span><span class="lbl">segundos</span></div>
  <div class="right">
    <div class="hbtns">
      <button class="smallbtn" id="btnQuit" type="button">Menú</button>
      <button class="smallbtn icon" id="btnRestart" type="button" aria-label="Reiniciar (R)" title="Reiniciar (R)">↻</button>
    </div>
    <span class="chip" id="hLevel">Normal · Nivel 1</span>
  </div>
</div>

<div class="pad off" id="pad">
  <button id="bL" type="button" aria-label="Izquierda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
  <button id="bR" type="button" aria-label="Derecha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <button class="smallbtn back" id="btnBack" type="button">← Juegos</button>
    <div class="brand"><div class="logo" aria-hidden="true"></div><h1>Lluvia</h1></div>
    <p class="intro">Llueven bloques. Cambiá de carril con las flechas y que no te toque ninguno. Cada bloque esquivado suma 1 y cada <b>moneda</b> suma 5.</p>
    <div class="diffs" role="radiogroup" aria-label="Dificultad">
      <button class="diff" id="dFacil" type="button" role="radio" data-d="facil" aria-checked="false">Fácil<small>XP ×1</small></button>
      <button class="diff" id="dNormal" type="button" role="radio" data-d="normal" aria-checked="true">Normal<small>XP ×1,5</small></button>
      <button class="diff" id="dDificil" type="button" role="radio" data-d="dificil" aria-checked="false">Difícil<small>XP ×2</small></button>
    </div>
    <div class="go">
      <span class="best">Récord<b id="mBest">—</b></span>
      <button class="btn primary" id="btnPlay" type="button">Jugar</button>
    </div>
    <div class="foot">
      <span>Teclado: <kbd>←</kbd> <kbd>→</kbd> o <kbd>A</kbd> <kbd>D</kbd> · <kbd>R</kbd> reinicia</span>
      <button class="smallbtn" id="btnMute" type="button">Sonido: sí</button>
    </div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <div class="result">
      <h2 id="eTitle">¡Plaf!</h2>
      <span class="num" id="eNum">0</span>
      <span class="sub" id="eSub"></span>
      <span class="sub" id="eSub2"></span>
      <span class="xp" id="eXP" hidden>+0 XP</span>
      <span class="badge" id="eBadge" hidden>Nuevo récord</span>
    </div>
    <div class="row">
      <button class="btn" id="btnHome" type="button">← Juegos</button>
      <button class="btn primary" id="btnAgain" type="button">Otra vez</button>
    </div>
  </div>
</div>

<script src="cubo-comun.js"></script>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CC = window.CuboComun; // perfil compartido (XP, personaje, récords); si no está, el juego anda solo

  const LANES = 4;
  const TWEEN = 70;        // ms del saltito visual (la lógica cambia de carril al instante)
  const LEVEL_EVERY = 15;  // segundos por nivel
  const COIN_PTS = 5;
  const COLORS = [
    ['#ff7a95', '#d94a6c'], ['#ffad4d', '#d9801c'], ['#3fdca8', '#16a676'],
    ['#5cb0ff', '#2f7fe0'], ['#c08bff', '#8f55e0'],
  ];
  const TITLES = ['¡Plaf!', '¡Te dio!', '¡Auch!', '¡Bonk!'];
  // la dificultad corre un "reloj efectivo" (t0 + t * rate) que decide velocidad y densidad:
  // Difícil arranca donde Normal llega al minuto; Fácil avanza más lento y con todo más tranquilo
  const DIFFS = {
    facil:   { name: 'Fácil',   t0: 0,  rate: 0.6, vMul: 0.82, ivMul: 1.15, xp: 1 },
    normal:  { name: 'Normal',  t0: 0,  rate: 1,   vMul: 1,    ivMul: 1,    xp: 1.5 },
    dificil: { name: 'Difícil', t0: 60, rate: 1,   vMul: 1,    ivMul: 1,    xp: 2 },
  };
  const DIFF_IDS = Object.keys(DIFFS);

  // ---------- récords ----------
  const REC_KEY = 'cubo-lluvia-records';
  let rec = {};
  try { rec = JSON.parse(localStorage.getItem(REC_KEY)) || {}; } catch (e) { rec = {}; }
  const saveRec = () => { try { localStorage.setItem(REC_KEY, JSON.stringify(rec)); } catch (e) {} };
  // el récord único de antes pasa a ser el de Normal
  if (!rec.byDiff || typeof rec.byDiff !== 'object') rec.byDiff = rec.best ? { normal: rec.best } : {};
  let diff = DIFFS[rec.diff] ? rec.diff : 'normal';
  const fmtN = n => n.toLocaleString('es-AR');
  function recText() { // el mejor de todas las dificultades; si empatan, gana la más difícil
    let id = null;
    for (const d of DIFF_IDS) if (rec.byDiff[d] && (!id || rec.byDiff[d] >= rec.byDiff[id])) id = d;
    return id ? `${fmtN(rec.byDiff[id])} pts (${DIFFS[id].name})` : '';
  }
  if (recText()) CC?.anotarRecord('lluvia', recText());

  // ---------- sonido ----------
  let actx = null, muted = !!rec.muted;
  function beep(freq, dur, type = 'triangle', vol = 0.07, slide = 0) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sfxMove = l => beep(440 * Math.pow(2, l * 3 / 12), 0.05, 'triangle', 0.07);
  const sfxWall = () => beep(170, 0.08, 'square', 0.035, 0.7);
  const sfxCoin = () => { beep(988, 0.07, 'square', 0.04); setTimeout(() => beep(1319, 0.12, 'square', 0.04), 60); };
  const sfxLevel = () => [659, 784, 988].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'triangle', 0.06), i * 80));
  const sfxBonk = () => { beep(150, 0.28, 'sawtooth', 0.06, 0.45); beep(95, 0.2, 'square', 0.04); };

  // ---------- canvas ----------
  // posiciones verticales en fracciones de FLOOR (0 = arriba, 1 = piso), así un resize no rompe la partida
  let W = 0, H = 0, LW = 80, FX = 0, FLOOR = 500;
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    FLOOR = Math.max(H * 0.45, $('pad').getBoundingClientRect().top - 22);
    LW = Math.max(50, Math.min((W - 32) / LANES, 118, FLOOR / 4.6));
    FX = W / 2 - LW * LANES / 2;
  }
  addEventListener('resize', resize); resize();
  const laneX = l => FX + LW * (l + 0.5);
  const cubeS = () => LW * 0.6;
  const blockS = () => LW * 0.76;

  // ---------- estado ----------
  let state = 'menu';       // menu | play | end
  let G = null, shake = 0, particles = [], floats = [], banner = null, rainT = 0;

  function newRun(demo, d = 'normal') {
    const lane = Math.random() < 0.5 ? 1 : 2;
    G = {
      demo, diff: d, t: 0, lane, rl: lane, fromL: lane, tw0: -1e9, arc: 0, face: 1, landT: -1e9,
      bonkT: -1e9, bonkDir: 0, ghosts: [], blocks: [], coins: [], rows: 0, safe: lane,
      nextSpawn: 0.8, score: 0, dodged: 0, coinsN: 0, level: 1, done: false, deadT: 0, botNext: 0,
    };
    particles = []; floats = []; banner = null;
  }

  const speedAt = t => Math.min(1.6, 0.5 + 0.013 * t);        // en pisos por segundo
  const intervalAt = t => Math.max(0.34, 0.95 - 0.011 * t);    // segundos entre filas
  const effT = () => DIFFS[G.diff].t0 + G.t * DIFFS[G.diff].rate;
  const speedNow = () => speedAt(effT()) * DIFFS[G.diff].vMul;
  const intervalNow = () => intervalAt(effT()) * DIFFS[G.diff].ivMul;

  function spawnRow() {
    const t = effT();
    const p3 = Math.max(0, Math.min(0.3, (t - 35) * 0.005));
    const p2 = Math.min(0.55, 0.12 + t * 0.007);
    const r = Math.random(), n = r < p3 ? 3 : r < p3 + p2 ? 2 : 1;
    // carril libre garantizado, a no más de 2 del anterior para que siempre se pueda llegar
    const safe = Math.max(0, Math.min(LANES - 1, G.safe + Math.floor(Math.random() * 5) - 2));
    G.safe = safe;
    const others = [0, 1, 2, 3].filter(l => l !== safe).sort(() => Math.random() - 0.5);
    const blocked = others.slice(0, n);
    const bf = blockS() / FLOOR, y0 = -bf - 0.03, c = COLORS[G.rows++ % COLORS.length];
    for (const l of blocked) G.blocks.push({ lane: l, y: y0, c });
    if (Math.random() < 0.24) {
      const free = [0, 1, 2, 3].filter(l => !blocked.includes(l));
      G.coins.push({ lane: free[Math.floor(Math.random() * free.length)], y: y0 + bf / 2, spin: Math.random() * 6 });
    }
  }

  function press(d, now) {
    if (!G || G.done) return;
    G.face = d;
    const nl = G.lane + d;
    if (nl < 0 || nl >= LANES) {
      G.bonkT = now; G.bonkDir = d;
      if (!G.demo) sfxWall();
      return;
    }
    G.ghosts.push({ l: G.rl, t: now });
    G.fromL = G.rl; G.tw0 = now; G.lane = nl; G.landT = now + TWEEN;
    if (!G.demo) sfxMove(nl);
  }

  // récord y XP de la partida en curso, al chocar o al cortarla con R
  function settle() {
    const D = DIFFS[G.diff], isRec = G.score > (rec.byDiff[G.diff] || 0);
    if (isRec) { rec.byDiff[G.diff] = G.score; saveRec(); CC?.anotarRecord('lluvia', recText()); }
    // 1 XP por segundo sobrevivido + 1 por moneda, por el multiplicador de la dificultad; el cartel de nivel lo muestra la librería
    const xp = CC ? CC.sumarXP((Math.round(G.t) + G.coinsN) * D.xp).ganada : 0;
    return { isRec, xp };
  }

  function die(now, b) {
    G.done = true; G.deadT = now;
    burst(laneX(G.lane), FLOOR - cubeS() / 2, '#ffcc29', 14, 1);
    burst(laneX(b.lane), (b.y * FLOOR) + blockS() / 2, b.c[0], 10, 1);
    if (G.demo) return;
    shake = reduceMotion ? 0 : 10; sfxBonk();
    const D = DIFFS[G.diff], { isRec, xp } = settle();
    $('eXP').textContent = `+${xp} XP` + (D.xp > 1 ? ` (×${String(D.xp).replace('.', ',')})` : '');
    $('eXP').hidden = !CC;
    $('eTitle').textContent = TITLES[Math.floor(Math.random() * TITLES.length)];
    $('eNum').textContent = fmtN(G.score);
    $('eSub').textContent = `puntos · ${G.t.toFixed(1)} s · nivel ${G.level} · ${D.name}`;
    $('eSub2').textContent = `${G.dodged} ${G.dodged === 1 ? 'bloque esquivado' : 'bloques esquivados'} · ${G.coinsN} ${G.coinsN === 1 ? 'moneda' : 'monedas'} · récord en ${D.name} ${fmtN(rec.byDiff[G.diff] || 0)}`;
    $('eBadge').hidden = !isRec;
    setTimeout(() => { if (G && G.done && state === 'play') showEnd(); }, 700);
  }

  // ---------- pantallas ----------
  function renderMenu() {
    const best = rec.byDiff[diff];
    $('mBest').textContent = best ? fmtN(best) : '—';
    for (const b of document.querySelectorAll('.diff')) b.setAttribute('aria-checked', String(b.dataset.d === diff));
    $('btnMute').textContent = 'Sonido: ' + (muted ? 'no' : 'sí');
  }
  function pickDiff(d) {
    diff = d; rec.diff = d; saveRec(); renderMenu();
  }
  // R o ↻: partida nueva al instante; si cortás una en curso, se lleva la XP de lo jugado
  function restart() {
    let xp = 0;
    if (state === 'play' && !G.demo && !G.done && G.t > 0.5) xp = settle().xp;
    start();
    if (xp > 0) banner = { text: `+${xp} XP`, t: performance.now() };
  }
  function start() {
    newRun(false, diff);
    state = 'play';
    $('menu').hidden = true; $('end').hidden = true; $('hud').hidden = false; $('pad').classList.remove('off');
    banner = { text: '¡Esquivá!', t: performance.now() };
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function showMenu() {
    state = 'menu';
    newRun(true);
    renderMenu();
    $('menu').hidden = false; $('end').hidden = true; $('hud').hidden = true; $('pad').classList.add('off');
  }
  function showEnd() {
    state = 'end';
    $('end').hidden = false; $('pad').classList.add('off');
    setTimeout(() => $('btnAgain').focus({ preventScroll: true }), 50);
  }

  // ---------- entrada ----------
  const flash = d => { const b = d < 0 ? $('bL') : $('bR'); b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 90); };
  function input(d) {
    if (state !== 'play') return;
    flash(d); press(d, performance.now());
  }
  addEventListener('keydown', e => {
    const k = e.key;
    const left = k === 'ArrowLeft' || k === 'a' || k === 'A', right = k === 'ArrowRight' || k === 'd' || k === 'D';
    if ((k === 'r' || k === 'R') && (state === 'play' || state === 'end')) { e.preventDefault(); if (!e.repeat) restart(); return; }
    if (state === 'play') {
      if (left) { e.preventDefault(); if (!e.repeat) input(-1); }
      else if (right) { e.preventDefault(); if (!e.repeat) input(1); }
      else if (k === 'Escape') showMenu();
    } else if (state === 'menu') {
      const a = document.activeElement;
      if (k === 'Escape' && CC) CC.volver();
      else if (left || right) {
        e.preventDefault();
        const i = Math.max(0, Math.min(DIFF_IDS.length - 1, DIFF_IDS.indexOf(diff) + (left ? -1 : 1)));
        pickDiff(DIFF_IDS[i]);
        if (a && a.classList && a.classList.contains('diff')) document.querySelector(`.diff[data-d="${diff}"]`).focus();
      }
      else if (k === 'Enter' && a !== $('btnBack') && a !== $('btnMute')) { e.preventDefault(); start(); }
      else if (k === ' ' && a === document.body) { e.preventDefault(); start(); }
    } else if (state === 'end') {
      if (k === 'Escape') showMenu();
      else if ((k === 'Enter' || k === ' ') && document.activeElement === document.body) { e.preventDefault(); start(); }
    }
  });
  const bindPad = (el, d) => el.addEventListener('pointerdown', e => { e.preventDefault(); input(d); });
  bindPad($('bL'), -1); bindPad($('bR'), 1);
  cv.addEventListener('pointerdown', e => { if (state === 'play') { e.preventDefault(); input(e.clientX < W / 2 ? -1 : 1); } });
  $('btnPlay').addEventListener('click', start);
  $('btnQuit').addEventListener('click', showMenu);
  $('btnRestart').addEventListener('pointerdown', e => { e.preventDefault(); restart(); });
  $('btnRestart').addEventListener('click', e => { if (e.detail === 0) restart(); }); // Enter/espacio con foco
  for (const b of document.querySelectorAll('.diff')) b.addEventListener('click', () => pickDiff(b.dataset.d));
  // sin la librería no hay pantalla de juegos: "← Juegos" se esconde en el inicio y vuelve al inicio en el fin
  $('btnBack').hidden = !CC;
  if (!CC) $('btnHome').textContent = 'Inicio';
  $('btnBack').addEventListener('click', () => CC?.volver());
  $('btnHome').addEventListener('click', () => CC ? CC.volver() : showMenu());
  $('btnAgain').addEventListener('click', start);
  $('btnMute').addEventListener('click', () => {
    muted = !muted; rec.muted = muted; saveRec(); renderMenu();
    if (!muted) beep(660, 0.08);
  });

  // ---------- efectos ----------
  function burst(x, y, color, n, power) {
    if (reduceMotion) return;
    for (let k = 0; k < n; k++) {
      const a = -Math.PI * Math.random();
      const sp = (90 + Math.random() * 200) * power;
      particles.push({ x: x + (Math.random() - 0.5) * LW * 0.4, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
        life: 0.35 + Math.random() * 0.25, age: 0, s: LW * (0.06 + Math.random() * 0.06), c: color });
    }
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp01 = t => Math.max(0, Math.min(1, t));
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function starPath(cx, cy, r) {
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? r * 0.45 : r;
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath();
  }

  // ---------- bucle ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(now, dt); draw(now);
    requestAnimationFrame(frame);
  }

  // el robot del menú: si viene algo por su carril, se corre a uno libre
  function danger(l, ahead) {
    const top = 1 - cubeS() / FLOOR, bf = blockS() / FLOOR;
    return G.blocks.some(b => b.lane === l && b.y + bf > top - ahead && b.y < 1);
  }
  function bot(now) {
    if (now < G.botNext) return;
    G.botNext = now + 90 + Math.random() * 80;
    const ahead = speedNow() * 0.38;
    if (!danger(G.lane, ahead) || Math.random() < 0.03) return;
    const opts = [-1, 1].filter(d => G.lane + d >= 0 && G.lane + d < LANES && !danger(G.lane + d, ahead * 1.1));
    if (opts.length) { press(opts[Math.floor(Math.random() * opts.length)], now); return; }
    const far = [-2, 2].find(d => G.lane + d >= 0 && G.lane + d < LANES && !danger(G.lane + d, ahead));
    if (far) press(Math.sign(far), now);
  }

  let hudCache = '';
  function update(now, dt) {
    const v = speedNow();
    rainT += dt * (G.done ? 0.3 : v);
    if (!G.done) {
      G.t += dt;
      if (G.demo) bot(now);
      G.nextSpawn -= dt;
      if (G.nextSpawn <= 0) {
        spawnRow();
        const minGap = (blockS() + cubeS() * 1.7) / FLOOR / v;
        G.nextSpawn += Math.max(intervalNow(), minGap);
      }
      const bf = blockS() / FLOOR, sf = cubeS() / FLOOR, top = 1 - sf * 0.86;
      for (const b of G.blocks) b.y += v * dt;
      for (const c of G.coins) { c.y += v * dt; c.spin += dt * 5; }
      for (const b of G.blocks) {
        if (b.lane === G.lane && b.y + bf * 0.92 > top && b.y < 1) { die(now, b); break; }
      }
      if (!G.done) {
        G.blocks = G.blocks.filter(b => {
          if (b.y + bf < 1) return true;
          G.dodged++; G.score++;
          burst(laneX(b.lane), FLOOR, b.c[0], 6, 0.6);
          return false;
        });
        const cr = LW * 0.2 / FLOOR;
        G.coins = G.coins.filter(c => {
          if (c.lane === G.lane && c.y + cr > top && c.y - cr < 1) {
            G.coinsN++; G.score += COIN_PTS;
            burst(laneX(c.lane), c.y * FLOOR, '#ffd84d', 8, 0.7);
            if (!G.demo) { sfxCoin(); floats.push({ text: '+' + COIN_PTS, x: laneX(c.lane), y: c.y * FLOOR, t: now }); }
            return false;
          }
          return c.y - cr < 1;
        });
        const lvl = 1 + Math.floor(G.t / LEVEL_EVERY);
        if (lvl > G.level) {
          G.level = lvl;
          if (!G.demo) { sfxLevel(); banner = { text: '¡Nivel ' + lvl + '!', t: now }; }
        }
      }
    } else if (G.demo && now - G.deadT > 900) newRun(true);

    // salto visual entre carriles
    const t = clamp01((now - G.tw0) / TWEEN), e = 1 - (1 - t) * (1 - t);
    G.rl = lerp(G.fromL, G.lane, e);
    G.arc = t < 1 ? Math.sin(Math.PI * t) : 0;
    shake *= Math.exp(-dt * 16);
    for (const p of particles) { p.age += dt; p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.age < p.life);
    floats = floats.filter(f => now - f.t < 700);
    G.ghosts = G.ghosts.filter(g => now - g.t < 140);
    if (banner && now - banner.t > 1100) banner = null;

    if (state === 'play' || state === 'end') {
      const sig = G.score + '|' + G.t.toFixed(1) + '|' + G.level + '|' + G.diff;
      if (sig !== hudCache) {
        hudCache = sig;
        $('hScore').textContent = fmtN(G.score); $('hTime').textContent = G.t.toFixed(1);
        $('hLevel').textContent = DIFFS[G.diff].name + ' · Nivel ' + G.level;
        $('hLevel').classList.toggle('hot', G.level >= 5);
      }
    }
  }

  function draw(now) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#62c6ff'); g.addColorStop(1, '#c9f1ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // llovizna de fondo
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = 0; k < 46; k++) {
      const len = 10 + hash(k + 9) * 18, sp = 0.6 + hash(k + 21) * 0.6;
      const y = ((hash(k + 3) * (H + 60) + rainT * FLOOR * sp) % (H + 60)) - 30;
      const x = hash(k + 1) * W + y * 0.08;
      ctx.moveTo(x, y); ctx.lineTo(x - len * 0.08, y - len);
    }
    ctx.stroke();

    const sx = reduceMotion ? 0 : (Math.random() - 0.5) * shake, sy = reduceMotion ? 0 : (Math.random() - 0.5) * shake;
    ctx.save(); ctx.translate(sx, sy);

    // carriles
    const FW = LW * LANES;
    ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(FX, 0, FW, FLOOR);
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(FX + LW, 0, LW, FLOOR); ctx.fillRect(FX + LW * 3, 0, LW, FLOOR);
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.setLineDash([LW * 0.18, LW * 0.32]); ctx.lineDashOffset = -(rainT * FLOOR) % (LW * 0.5);
    ctx.beginPath();
    for (let l = 1; l < LANES; l++) { ctx.moveTo(FX + LW * l, 0); ctx.lineTo(FX + LW * l, FLOOR); }
    ctx.stroke(); ctx.setLineDash([]);

    // nubes de donde cae todo
    ctx.fillStyle = '#fff';
    for (let k = 0; k < 9; k++) {
      const x = (k / 8) * (W + 80) - 40 + Math.sin(now / 2200 + k) * 10, r = 34 + hash(k + 40) * 30;
      ctx.beginPath(); ctx.ellipse(x, -r * 0.25, r * 1.2, r, 0, 0, Math.PI * 2); ctx.fill();
    }

    // monedas
    const cr = LW * 0.2;
    for (const c of G.coins) {
      const x = laneX(c.lane), y = c.y * FLOOR, sxc = Math.max(0.15, Math.abs(Math.cos(c.spin)));
      ctx.save(); ctx.translate(x, y); ctx.scale(sxc, 1);
      ctx.fillStyle = '#ffd84d'; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(2.5, LW * 0.04);
      ctx.beginPath(); ctx.arc(0, 0, cr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff1b8'; starPath(0, 0, cr * 0.55); ctx.fill();
      ctx.restore();
    }

    // bloques
    const bs = blockS(), brad = bs * 0.16;
    for (const b of G.blocks) {
      const x = laneX(b.lane) - bs / 2, y = b.y * FLOOR;
      ctx.fillStyle = 'rgba(29,35,64,.18)'; rr(x + LW * 0.05, y + LW * 0.07, bs, bs, brad); ctx.fill();
      ctx.fillStyle = b.c[1]; rr(x, y, bs, bs, brad); ctx.fill();
      ctx.fillStyle = b.c[0]; rr(x, y, bs, bs * 0.7, brad); ctx.fill();
      ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(2.5, LW * 0.045); rr(x, y, bs, bs, brad); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.4)'; rr(x + bs * 0.14, y + bs * 0.1, bs * 0.72, bs * 0.08, bs * 0.04); ctx.fill();
      // cara de pocos amigos
      const cx = x + bs / 2, ey = y + bs * 0.5;
      ctx.fillStyle = '#1d2340';
      for (const side of [-1, 1]) { rr(cx + side * bs * 0.18 - bs * 0.05, ey - bs * 0.06, bs * 0.1, bs * 0.15, bs * 0.05); ctx.fill(); }
      ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(2, LW * 0.035);
      ctx.beginPath();
      for (const side of [-1, 1]) { ctx.moveTo(cx + side * bs * 0.28, ey - bs * 0.16); ctx.lineTo(cx + side * bs * 0.08, ey - bs * 0.1); }
      ctx.moveTo(cx - bs * 0.09, ey + bs * 0.22); ctx.lineTo(cx + bs * 0.09, ey + bs * 0.22);
      ctx.stroke();
    }

    // piso
    const fh = LW * 0.3, fx = FX - LW * 0.12, fw = FW + LW * 0.24;
    ctx.fillStyle = 'rgba(29,35,64,.18)'; rr(fx + LW * 0.05, FLOOR + LW * 0.08, fw, fh, LW * 0.08); ctx.fill();
    ctx.fillStyle = '#16a676'; rr(fx, FLOOR, fw, fh, LW * 0.08); ctx.fill();
    ctx.fillStyle = '#3fdca8'; rr(fx, FLOOR, fw, fh * 0.62, LW * 0.08); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(fx + LW * 0.1, FLOOR + LW * 0.05, fw - LW * 0.2, LW * 0.04);

    // estela del salto
    const s0 = cubeS();
    for (const gh of G.ghosts) {
      const a = (now - gh.t) / 140;
      ctx.globalAlpha = 0.35 * (1 - a); ctx.fillStyle = '#ffcc29';
      rr(laneX(gh.l) - s0 / 2, FLOOR - s0, s0, s0, s0 * 0.2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawCube(now);

    for (const p of particles) {
      ctx.globalAlpha = 1 - p.age / p.life; ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1d2340'; ctx.fillStyle = '#fffaf0';
    for (const f of floats) {
      const a = (now - f.t) / 700;
      ctx.globalAlpha = 1 - a;
      ctx.font = `${Math.round(LW * 0.38)}px "Lilita One", "Trebuchet MS", sans-serif`;
      ctx.lineWidth = 5;
      const fy = f.y - LW * 0.3 - a * LW * 0.6;
      ctx.strokeText(f.text, f.x, fy); ctx.fillText(f.text, f.x, fy);
    }
    ctx.globalAlpha = 1;
    if (banner && state === 'play') {
      const a = (now - banner.t) / 1100, pop = a < 0.15 ? 0.6 + a / 0.15 * 0.4 : 1;
      ctx.globalAlpha = a > 0.75 ? (1 - a) / 0.25 : 1;
      ctx.font = `${Math.round(LW * 0.62 * pop)}px "Lilita One", "Trebuchet MS", sans-serif`;
      ctx.lineWidth = 7;
      const by = FLOOR * 0.42;
      ctx.strokeText(banner.text, W / 2, by); ctx.fillText(banner.text, W / 2, by);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawCube(now) {
    const dead = G.done;
    const s = cubeS();
    const bt = clamp01((now - G.bonkT) / 160);
    const bonk = bt < 1 ? Math.sin(Math.PI * bt) * LW * 0.14 * G.bonkDir : 0;
    const cx = laneX(G.rl) + bonk;
    const foot = FLOOR - G.arc * s * 0.28;
    const stretch = G.arc > 0 ? 1 + G.arc * 0.12 : 1;
    const lt = (now - G.landT) / 140;
    const squash = dead ? 0.25 : lt >= 0 && lt < 1 ? Math.sin(Math.PI * lt) * 0.2 : 0;
    const wob = dead && !reduceMotion ? Math.sin(now / 35) * 0.06 : G.face * G.arc * 0.22;

    if (CC) {
      // personaje elegido; las estrellitas de mareado las dibuja la librería, así que muerto va sin aplastar
      if (dead) { CC.dibujarCubo(ctx, cx, foot, s, { mirar: G.face, mareado: true, t: now }); return; }
      ctx.save();
      ctx.translate(cx, foot); ctx.rotate(wob);
      ctx.scale((1 + squash) / stretch, stretch * (1 - squash));
      CC.dibujarCubo(ctx, 0, 0, s, { mirar: G.face, mareado: false, t: now });
      ctx.restore();
      return;
    }

    ctx.save();
    ctx.translate(cx, foot);
    ctx.rotate(wob);
    ctx.scale((1 + squash) / stretch, stretch * (1 - squash));
    ctx.fillStyle = 'rgba(29,35,64,.2)'; rr(-s / 2 + 3, -s + 4, s, s, s * 0.2); ctx.fill();
    ctx.fillStyle = dead ? '#c9d3e3' : '#ffcc29';
    ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(2.5, LW * 0.05);
    rr(-s / 2, -s, s, s, s * 0.2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; rr(-s * 0.36, -s * 0.9, s * 0.72, s * 0.12, s * 0.06); ctx.fill();

    const ex = s * 0.2, ey = -s * 0.56, look = G.face * s * 0.06;
    ctx.fillStyle = '#1d2340'; ctx.strokeStyle = '#1d2340';
    if (dead) {
      ctx.lineWidth = Math.max(2, LW * 0.04); ctx.lineCap = 'round';
      for (const side of [-1, 1]) {
        const x0 = side * ex, d = s * 0.08;
        ctx.beginPath(); ctx.moveTo(x0 - d, ey - d); ctx.lineTo(x0 + d, ey + d);
        ctx.moveTo(x0 + d, ey - d); ctx.lineTo(x0 - d, ey + d); ctx.stroke();
      }
      ctx.beginPath(); ctx.ellipse(0, -s * 0.26, s * 0.08, s * 0.06, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      // mira para arriba cuando hay un bloque cerca en su carril
      const up = danger(G.lane, 0.25) ? -s * 0.05 : 0;
      for (const side of [-1, 1]) { rr(side * ex + look - s * 0.06, ey - s * 0.1 + up, s * 0.12, s * 0.2, s * 0.06); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,93,125,.55)';
      for (const side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(side * s * 0.3 + look, -s * 0.3, s * 0.08, s * 0.05, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(2, LW * 0.035); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(look, -s * 0.34, s * 0.1, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    }
    ctx.restore();

    if (dead) {
      for (let k = 0; k < 3; k++) {
        const a = now / 110 + k * (Math.PI * 2 / 3);
        const x = cx + Math.cos(a) * s * 0.55, y = foot - s * 1.18 + Math.sin(a) * s * 0.16;
        ctx.fillStyle = '#ffe14d'; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 2;
        starPath(x, y, s * 0.14); ctx.fill(); ctx.stroke();
      }
    }
  }

  showMenu();
  requestAnimationFrame(frame);
})();
</script>
