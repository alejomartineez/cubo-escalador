<style>
/* Layout: la mesa vertical en el medio, tu paleta abajo y el rival arriba; HUD arriba, dos botones gigantes abajo.
   En 2 jugadores el de arriba tiene sus propios botones, dados vuelta. */
:root {
  --sky: #2ec27e;
  --ink: #1d2340;
  --paper: #fffaf0;
  --cube: #ffcc29;
  --accent: #ff5d7d;
  --good: #1fbf8a;
  --muted: #5b6382;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
  pointer-events: none; zoom: var(--ui, 1);
}
.stat { display: flex; flex-direction: column; line-height: 1; }
.stat.mid { align-items: center; }
.big {
  font-family: var(--display); font-size: clamp(34px, 7vw, 52px); color: var(--paper); font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink);
}
.lbl {
  font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--paper); margin-top: 6px;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 0 var(--ink);
}
.vidas { font-size: clamp(22px, 5vw, 30px); letter-spacing: 2px; line-height: 1; filter: drop-shadow(0 2px 0 var(--ink)); }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font-weight: 800; font-size: 13px; padding: 5px 10px; border-radius: 999px;
  background: var(--paper); border: 2px solid var(--ink); font-variant-numeric: tabular-nums;
}
.chip svg { flex: none; color: var(--ink); }
.hbtns { display: flex; gap: 8px; }
.smallbtn {
  pointer-events: auto; font: 800 13px var(--body); color: var(--ink); white-space: nowrap;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; box-shadow: 0 3px 0 var(--ink); cursor: pointer; min-height: 40px; min-width: 44px;
}
.smallbtn.icon { font-size: 17px; line-height: 1; }
.smallbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.pad {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 560px; margin: 0 auto;
  zoom: var(--ui, 1);
}
.pad.off { visibility: hidden; }
.pad[hidden] { display: none; }
/* el de arriba (2 jugadores): los mismos botones, dados vuelta para que los use quien está enfrente */
.pad.arriba { bottom: auto; top: 0; transform: rotate(180deg); }
.pad button {
  height: clamp(70px, 12vh, 110px); border-radius: 22px; background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; touch-action: none;
  font: 400 clamp(19px, 5.4vw, 26px) var(--display); transition: transform .05s, box-shadow .05s;
}
.pad.arriba button { background: #dff1ff; }
.pad button svg { width: 36px; height: 36px; flex: none; }
.pad button.on { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); background: var(--cube); }
/* en 2 jugadores, los botones de menú van al costado, a mitad de la mesa */
.lado {
  position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px; zoom: var(--ui, 1);
}
.lado[hidden] { display: none; }

.overlay {
  position: fixed; inset: 0; display: flex; overflow-y: auto; touch-action: pan-y;
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(29, 35, 64, .28);
}
.card {
  width: min(420px, 100%); margin: auto; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
  padding: 20px; display: flex; flex-direction: column; gap: 14px; zoom: var(--ui, 1);
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 48px; height: 48px; flex: none; border-radius: 10px; background: var(--cube);
  border: 3px solid var(--ink); position: relative; transform: rotate(-6deg);
}
.logo::before, .logo::after { content: ""; position: absolute; top: 13px; width: 8px; height: 11px; border-radius: 4px; background: var(--ink); }
.logo::before { left: 11px; } .logo::after { right: 11px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: clamp(32px, 9vw, 42px); }
h2 { font-size: 34px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.intro b { color: var(--ink); }
.back { align-self: flex-start; }
/* modo: contra la máquina o 2 jugadores */
.modos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modo {
  font: 800 14px/1.2 var(--body); color: var(--ink); cursor: pointer; padding: 10px 8px; text-align: center;
  background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.modo span { font-size: 22px; line-height: 1; }
.modo small { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.modo[aria-checked="true"] { background: var(--cube); transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.modo[aria-checked="true"] small { color: var(--ink); }
.go { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: stretch; }
.go.solo { grid-template-columns: 1fr; }
.best[hidden] { display: none; }
.best {
  display: flex; flex-direction: column; justify-content: center; padding: 6px 14px;
  border: 3px solid var(--ink); border-radius: 14px; background: #fff;
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.best b { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; line-height: 1.1; }
kbd { font: 800 12px var(--body); border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; color: var(--ink); background: #fff; }

.result { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.result .num { font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.result .sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lbl-dif { margin: 0 0 -6px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.xp {
  font-family: var(--display); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums;
  background: var(--cube); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 14px; margin-top: 4px;
}
.badge {
  font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  background: var(--good); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px;
}
.logros { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 2px; }
.logro { font-weight: 800; font-size: 13px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 10px; }
.logro::before { content: "★ "; color: #e0a000; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.btn {
  font: 800 16px var(--body); color: var(--ink); padding: 14px 10px; cursor: pointer;
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.small { padding: 10px; font-size: 15px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.big { font: 400 26px var(--display); padding: 12px 10px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (max-width: 380px) { .card { padding: 16px; gap: 12px; } }
@media (pointer: coarse) { .kbd-only { display: none; } }
@media (pointer: fine) { .card { gap: 12px; } }
@media (prefers-reduced-motion: reduce) { .pad button, .btn { transition: none; } }
/* jerarquía de botones: un solo protagonista por pantalla (igual que los otros juegos) */
.card .btn.primary { background: var(--cube); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .01em; }
.card .btn.primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.card .btn:not(.primary) { background: #fff; border-width: 2px; box-shadow: 0 2px 0 var(--ink); font-family: var(--body); font-weight: 800; font-size: 15px; }
.card .btn:not(.primary):active { transform: translateY(2px); box-shadow: none; }
.card .ter { background: transparent !important; border: 2px solid var(--ink) !important; box-shadow: 0 2px 0 var(--ink) !important; color: var(--ink);
  font: 800 14px var(--body) !important; padding: 8px 14px !important; min-height: 44px; }
.card .ter:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink) !important; }
</style>

  const ctx = cv.getContext('2d');

  if (CC && CC.textos) CC.textos({

    'puntos': 'points',

    'Reiniciar (R)': 'Restart (R)',

    'Derecha': 'Right',
    'Izquierda del jugador de arriba': 'Top player\'s left',

    // menú

    'Mové tu paleta con <b>◀ ▶</b> y devolvé la pelota. Si le pegás con la punta, sale cruzada. ¿Cuántos puntos le hacés?':

    'Modo': 'Mode',
    'Contra la máquina': 'Vs. computer',
    'Rivales cada vez mejores': 'Rivals keep getting better',
    '2 jugadores': '2 players',
    'En el mismo celu o compu': 'On the same phone or computer',
    'Récord': 'Best',
    'Jugar': 'Play',
    'Ranking': 'Leaderboard',
    'Sonido: sí': 'Sound: on',
    'Sonido: no': 'Sound: off',
    'Dificultad': 'Difficulty',
    'mover la paleta': 'move the paddle',

    'Paleta ancha, pelota lenta y 5 vidas.': 'Wide paddle, slow ball and 5 lives.',
    '3 vidas. Cada 3 puntos viene un rival mejor.': '3 lives. Every 3 points a better rival shows up.',
    'Pelota más rápida y paleta más chica.': 'Faster ball and smaller paddle.',
    'Rapidísima, paleta corta y 2 vidas. XP ×3.': 'Super fast, short paddle and 2 lives. XP ×3.',
    'Una sola vida y la pelota vuela. XP ×4.': 'Just one life and the ball flies. XP ×4.',
    'El Profe': 'The Prof',
    // en el juego (canvas)
    '¡Rival nuevo: {n}!': 'New rival: {n}!',
    '¡Última vida!': 'Last life!',
    '¡Te quedan {n}!': '{n} left!',
    '¡Justo!': 'Just in time!',
    // fin de partida
    '¡Partido!': 'Match!',
    '¡Ganó el de abajo!': 'Bottom player wins!',
    '¡Ganó el de arriba!': 'Top player wins!',
    'abajo – arriba · a {n} puntos · {d}': 'bottom – top · first to {n} · {d}',
    'Rally más largo: {n} golpe': 'Longest rally: {n} hit',
    'Rally más largo: {n} golpes': 'Longest rally: {n} hits',
    '¡Partidazo!': 'What a match!',
    '¡Buena paleta!': 'Nice paddling!',
    '¡Se terminó!': 'Game over!',
    'punto · {d} · llegaste al rival {n}': 'point · {d} · you reached rival {n}',
    'puntos · {d} · llegaste al rival {n}': 'points · {d} · you reached rival {n}',
    'récord: {r}': 'best: {r}',
    'Primer récord': 'First best score',
    'Nuevo récord': 'New best',
    'Otra vez': 'Again',
  });
  const T = (s, v) => (CC && CC.T ? CC.T(s, v) : v ? s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)) : s);
  // Duelo 1v1 online contra un amigo (cubo-duelo.js): cada uno maneja su paleta, en vivo, a META_DOS puntos.
  // Manda el anfitrión (el que retó): simula la pelota, los saques y los puntos y transmite el estado; el invitado mueve
  // su paleta al instante, se la pasa al anfitrión y dibuja la pelota adelantándola con su velocidad. Cada uno se ve abajo.
  const CD = window.CuboDuelo, DUELO = CD ? CD.partida() : null;
  let sala = null;
  // desafío del día (?diario=1): contra la máquina en Normal, 3 intentos y los rivales juegan con la semilla del día
  const DIA = !DUELO && CC && CC.diarioDe ? CC.diarioDe('paleta') : null;
  let azar = Math.random;

  // ---------- reglas ----------
  // La mesa mide FW × FH (en "unidades"); vos abajo, el rival arriba. Cada 3 puntos que hacés llega un rival mejor.
  const FW = 10, FH = 16, R_BOLA = 0.32, PALETA_Y = 1.15, VEL_PALETA = 13;
  const PUNTOS_RIVAL = 3, META_DOS = 7;
  // base y tope: velocidad de la pelota (unidades/s) · hw: media paleta · ia: velocidad del rival · err: cuánto le erra al principio
  const DIFS = {
    facil:   { name: T('Fácil'),   base: 6.5,  tope: 15, crece: 1.03,  hw: 1.5,  ia: 5,    err: 2.1, vidas: 5 },
    normal:  { name: T('Normal'),  base: 8,    tope: 18, crece: 1.04,  hw: 1.25, ia: 6.5,  err: 1.8, vidas: 3 },
    dificil: { name: T('Difícil'), base: 9.5,  tope: 21, crece: 1.045, hw: 1.1,  ia: 8,    err: 1.5, vidas: 3 },
    extremo: { name: T('Extremo'), base: 11,   tope: 24, crece: 1.05,  hw: 0.95, ia: 9.5,  err: 1.3, vidas: 2 },
    maestro: { name: T('Maestro'), base: 12.5, tope: 27, crece: 1.055, hw: 0.85, ia: 11,   err: 1.1, vidas: 1 },
  };
  const NOTAS = {
    facil: T('Paleta ancha, pelota lenta y 5 vidas.'),
    normal: T('3 vidas. Cada 3 puntos viene un rival mejor.'),
    dificil: T('Pelota más rápida y paleta más chica.'),
    extremo: T('Rapidísima, paleta corta y 2 vidas. XP ×3.'),
    maestro: T('Una sola vida y la pelota vuela. XP ×4.'),
  };
  const RIVALES = [
    { n: 'Tito', c: '#ff7a59' }, { n: 'Lola', c: '#8f6bff' }, { n: 'Rulo', c: '#3fc1c9' }, { n: 'Mora', c: '#ff6fae' },
    { n: 'Coco', c: '#5b8cff' }, { n: 'Juana', c: '#f5b84a' }, { n: 'Tano', c: '#1fbf8a' }, { n: T('El Profe'), c: '#2b3470' },
  ];
  const rivalDe = k => { const r = RIVALES[k % RIVALES.length], v = Math.floor(k / RIVALES.length); return { ...r, n: r.n + (v ? ' ' + ['II', 'III', 'IV', 'V'][Math.min(3, v - 1)] : '') }; };
  const XP_MALO = 2, XP_EXPERTO = 24;

  // ---------- récords y sonido ----------
  const REC_KEY = 'cubo-paleta-records';
  let rec = {};
  try { rec = JSON.parse(localStorage.getItem(REC_KEY)) || {}; } catch (e) { rec = {}; }
  const saveRec = () => { try { localStorage.setItem(REC_KEY, JSON.stringify(rec)); } catch (e) {} };
  let actx = null, muted = !!rec.muted;
  function beep(freq, dur, type = 'triangle', vol = 0.07, slide = 0) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sfxPaleta = n => beep(440 * Math.pow(2, Math.min(n, 14) / 12), 0.07, 'square', 0.05, 1.15);
  const sfxPared = () => beep(300, 0.04, 'triangle', 0.04);
  const sfxPunto = () => [659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.045), i * 70));
  const sfxPierdo = () => { beep(160, 0.3, 'sawtooth', 0.06, 0.45); beep(95, 0.22, 'square', 0.04); };
  const sfxTic = () => beep(880, 0.05, 'triangle', 0.05);
  const sfxJusto = () => { beep(1175, 0.06, 'triangle', 0.045); setTimeout(() => beep(1568, 0.1, 'triangle', 0.045), 60); };

  // ---------- canvas y mesa ----------
  let W = 0, H = 0, S = 30, OX = 0, OY = 0;
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // la mesa va entre lo de arriba (HUD o botones del de arriba) y los botones de abajo
    const dos = G && G.modo === 'dos' && !G.demo;
    const enJuego = state === 'play';
    const pad = $('pad').getBoundingClientRect();
    let arriba = 16, abajo = H - 16;
    if (enJuego) {
      abajo = pad.top - 12;
      arriba = dos ? $('pad2').getBoundingClientRect().bottom + 12 : $('hud').getBoundingClientRect().bottom + 10;
    }
    const alto = Math.max(160, abajo - arriba), ancho = W - 24;
    S = Math.max(8, Math.min(ancho / FW, alto / FH));
    OX = (W - FW * S) / 2; OY = arriba + (alto - FH * S) / 2;
  }
  addEventListener('resize', resize);
  const sx = x => OX + x * S, sy = y => OY + y * S;

  // ---------- estado ----------
  let state = 'menu';   // menu | play | end
  let G = null, shake = 0, particles = [], floats = [], banner = null;
  let modo = rec.modo === 'dos' ? 'dos' : 'cpu';
  // ?dos=1 (desde el botón 1v1 del inicio): arranca elegido el modo de a dos
  try { if (new URLSearchParams(location.search).has('dos')) modo = 'dos'; } catch (e) {}
  const teclas = { p1: 0, p2: 0, l1: false, r1: false, l2: false, r2: false };

  function paleta(y, hw) { return { x: FW / 2, y, hw, v: 0, golpe: -9, objetivo: FW / 2, err: 0 }; }
  function newRun(demo, d = 'normal', m = 'cpu') {
    const D = DIFS[d];
    G = {
      demo, diff: d, D, modo: demo ? 'cpu' : m, t: 0,
      abajo: paleta(FH - PALETA_Y, D.hw), arriba: paleta(PALETA_Y, D.hw),
      bola: { x: FW / 2, y: FH / 2, vx: 0, vy: 0, vel: D.base, estela: [] },
      fase: 'cuenta', faseT: demo ? 0.5 : 1.6, saca: 'abajo',
      score: 0, contra: 0, vidas: D.vidas, nivel: 0, rival: rivalDe(0), rally: 0, mejorRally: 0, golpes: 0,
      done: false, settled: false, r: null,
      justoT: { abajo: -9, arriba: -9 },
      // pista de las primeras partidas: dónde va a cruzar la pelota tu línea, hasta que le pegás por primera vez
      pista: { abajo: false, arriba: false },
    };
    if (!demo && CC && (CC.perfil().partidas.paleta || 0) < 3) G.pista = { abajo: true, arriba: G.modo === 'dos' };
    particles = []; floats = []; banner = null;
  }
  // nivel del rival: cada PUNTOS_RIVAL puntos tuyos llega uno mejor (más rápido y erra menos)
  const iaVel = (G_, pad) => G_.demo ? G_.D.ia * 0.9 : G_.D.ia * (1 + 0.07 * Math.min(12, G_.nivel));
  const iaErr = G_ => G_.D.err * Math.max(0.3, 1 - 0.08 * G_.nivel);

  function sacar() {
    const b = G.bola, hacia = G.saca === 'abajo' ? 1 : -1;
    b.x = FW / 2; b.y = FH / 2; b.estela = [];
    b.vel = G.D.base * (1 + (G.modo === 'cpu' ? 0.03 * Math.min(10, G.nivel) : 0)) * 0.85;
    const ang = (azar() * 2 - 1) * 0.42;
    b.vx = b.vel * Math.sin(ang); b.vy = hacia * b.vel * Math.cos(ang);
    G.fase = 'juego'; G.rally = 0;
    pensarIA();
  }
  // dónde va a cruzar la pelota la altura y (rebotando en las bandas)
  function cruce(b, y) {
    if (!b.vy) return b.x;
    const t = (y - b.y) / b.vy;
    if (t < 0) return b.x;
    const ancho = FW - 2 * R_BOLA;
    let x = b.x - R_BOLA + b.vx * t;
    x = ((x % (2 * ancho)) + 2 * ancho) % (2 * ancho);
    if (x > ancho) x = 2 * ancho - x;
    return x + R_BOLA;
  }
  // la máquina elige a dónde ir cada vez que la pelota sale para su lado (y con qué error)
  function pensarIA() {
    const lados = G.demo ? ['abajo', 'arriba'] : G.modo === 'cpu' ? ['arriba'] : [];
    for (const lado of lados) {
      const p = G[lado], vaHacia = lado === 'arriba' ? G.bola.vy < 0 : G.bola.vy > 0;
      if (!vaHacia) { p.objetivo = FW / 2 + (G.bola.x - FW / 2) * 0.3; continue; }
      const e = G.demo ? 0.9 : iaErr(G);
      p.err = (azar() + azar() - 1) * e * 1.4;
      // los mejores apuntan: le pegan con la punta para mandarla cruzada
      const apunta = G.demo ? 0 : Math.min(0.7, 0.12 * G.nivel) * (azar() < 0.5 ? -1 : 1);
      p.objetivo = cruce(G.bola, p.y) + p.err - apunta * p.hw;
    }
  }

  function golpe(lado, p) {
    const b = G.bola, dir = lado === 'abajo' ? -1 : 1;
    const off = Math.max(-1, Math.min(1, (b.x - p.x) / (p.hw + R_BOLA)));
    let ang = off * 1.0 + Math.max(-0.25, Math.min(0.25, p.v * 0.012));
    ang = Math.max(-1.1, Math.min(1.1, ang));
    b.vel = Math.min(G.D.tope, b.vel * G.D.crece);
    b.vx = b.vel * Math.sin(ang); b.vy = dir * b.vel * Math.cos(ang);
    b.y = p.y + dir * (R_BOLA + 0.02);
    p.golpe = G.t; G.rally++; G.golpes++;
    G.mejorRally = Math.max(G.mejorRally, G.rally);
    const punta = Math.abs(off) > 0.7;
    chispas(b.x, p.y, punta ? '#ffcc29' : '#ffffff', punta ? 12 : 7, punta ? 1.3 : 0.9);
    const humano = !G.demo && (lado === 'abajo' || G.modo === 'dos');
    if (humano) G.pista[lado] = false;
    if (!G.demo) sfxPaleta(G.rally);
    if (humano && !justo(lado, p, off)) CC?.vibrar(8);
    pensarIA();
  }
  // «¡Justo!»: la agarraste con la puntita (la pelota casi pasa de largo). Solo sensación: no cambia el tiro ni los puntos.
  const JUSTO_OFF = 0.86, JUSTO_CADA = 1.5;   // qué tan en la punta (1 = el borde) · mínimo de segundos entre uno y otro
  function justo(lado, p, off) {
    if (Math.abs(off) < JUSTO_OFF || G.t - G.justoT[lado] < JUSTO_CADA) return false;
    G.justoT[lado] = G.t;
    const arriba = lado === 'arriba', x = p.x + Math.sign(off) * p.hw;
    chispas(x, p.y, '#ffd84d', reduceMotion ? 6 : 14, reduceMotion ? 0.35 : 1.6);
    if (!reduceMotion) chispas(x, p.y, '#fffaf0', 6, 1.1);
    floats.push({ text: T('¡Justo!'), px: Math.max(1.6, Math.min(FW - 1.6, x)), y: p.y + (arriba ? 1.5 : -1.5), girar: arriba && G.modo === 'dos',
      c: '#ffd84d', t: performance.now(), pop: true });
    sfxJusto(); CC?.vibrar([8, 40, 8]);
    return true;
  }

  function punto(ganoAbajo) {
    G.fase = 'punto'; G.faseT = 1.0;
    const b = G.bola;
    chispas(b.x, ganoAbajo ? 0 : FH, ganoAbajo ? '#ffcc29' : '#ff5d7d', 16, 1.4);
    if (G.demo) { G.saca = ganoAbajo ? 'arriba' : 'abajo'; return; }
    // hitstop: la imagen se queda quieta un instante cuando alguien pierde el punto (vos contra la máquina, cualquiera de a dos)
    if (!ganoAbajo || G.modo === 'dos') CC?.frenar(120);
    if (ganoAbajo) {
      G.score++; sfxPunto();
      if (G.modo === 'cpu') {
        floats.push({ text: '+1', x: b.x, y: 1.6, t: performance.now() });
        if (G.score % PUNTOS_RIVAL === 0) {

      }
    } else {
      sfxPierdo(); shake = reduceMotion ? 0 : 10; CC?.vibrar(40);

        G.vidas--;

  }

  // ---------- actualizar ----------
  function moverPaleta(p, dir, dt) {
    const obj = dir * VEL_PALETA;
    p.v += (obj - p.v) * Math.min(1, dt * 18);
    p.x = Math.max(p.hw, Math.min(FW - p.hw, p.x + p.v * dt));
  }
  function moverIA(p, dt) {
    const d = p.objetivo - p.x, max = iaVel(G, p);
    const quiere = Math.abs(d) < 0.08 ? 0 : Math.sign(d) * Math.min(max, Math.abs(d) * 8);
    p.v += (quiere - p.v) * Math.min(1, dt * 14);
    p.x = Math.max(p.hw, Math.min(FW - p.hw, p.x + p.v * dt));
  }
  function update(now, dt) {
    if (!G) return;
    G.t += dt;
    if (state === 'play' || G.demo) {
      // paletas
      const dirAbajo = G.demo ? null : (teclas.r1 ? 1 : 0) - (teclas.l1 ? 1 : 0);
      if (G.demo) moverIA(G.abajo, dt); else moverPaleta(G.abajo, dirAbajo, dt);
      if (G.red) seguirRival(G.arriba, dt);
      else if (G.demo || G.modo === 'cpu') moverIA(G.arriba, dt);
      else moverPaleta(G.arriba, (teclas.r2 ? 1 : 0) - (teclas.l2 ? 1 : 0), dt);

      if (G.red) redTick(now, dt);
      if (G.red && !G.red.host) invitado(dt);   // el invitado no decide nada: dibuja lo que manda el anfitrión
      else if (G.fase === 'cuenta' || G.fase === 'punto') {
        const antes = Math.ceil(G.faseT / 0.5);
        G.faseT -= dt;
        if (G.fase === 'cuenta' && !G.demo && Math.ceil(G.faseT / 0.5) !== antes && G.faseT > 0) sfxTic();
        if (G.faseT <= 0) sacar();

    }
    for (const p of particles) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 14 * dt; }
    particles = particles.filter(p => p.age < p.life);
    floats = floats.filter(f => now - f.t < 900);
    shake = Math.max(0, shake - dt * 40);
  }
  function moverBola(dt) {
    const b = G.bola;
    const pasos = Math.max(1, Math.ceil(b.vel * dt / 0.12));
    const h = dt / pasos;
    for (let k = 0; k < pasos; k++) {
      const y0 = b.y;
      b.x += b.vx * h; b.y += b.vy * h;

      else if (b.x > FW - R_BOLA) { b.x = FW - R_BOLA; b.vx = -Math.abs(b.vx); if (!G.demo) sfxPared(); }
      const A = G.abajo, B = G.arriba;
      if (b.vy > 0 && y0 + R_BOLA <= A.y + 0.05 && b.y + R_BOLA >= A.y && Math.abs(b.x - A.x) <= A.hw + R_BOLA) golpe('abajo', A);
      else if (b.vy < 0 && y0 - R_BOLA >= B.y - 0.05 && b.y - R_BOLA <= B.y && Math.abs(b.x - B.x) <= B.hw + R_BOLA) golpe('arriba', B);

      if (b.y < -0.8) { punto(true); return; }

  function chispas(x, y, color, n, power) {

      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.3 + Math.random() * 0.3, age: 0, s: 0.08 + Math.random() * 0.1, c: color });
    }
  }

  // ---------- fin de partida ----------
  function settle() {

    const v = G.score;
    if (v > (rec[G.diff] || 0)) { rec[G.diff] = v; saveRec(); }
    if (!CC) return null;
    G.r = CC.partida({ juego: 'paleta', tabla: G.diff, valor: v, texto: `${v} pts (${G.D.name})`,
      xp: CC.xpEscala(v, XP_MALO, XP_EXPERTO), marcas: G.mejorRally >= 30 ? ['paleta-rally'] : [], diario: DIA || undefined });
    return G.r;
  }
  function terminar() {
    if (!G || state !== 'play') return;

    if (G.red) return finRed();
    const dos = G.modo === 'dos';
    if (dos) {
      const ganoAbajo = G.score > G.contra;
      $('eTitle').textContent = ganoAbajo ? T('¡Ganó el de abajo!') : T('¡Ganó el de arriba!');
      $('eNum').textContent = `${G.score} – ${G.contra}`;
      $('eSub').textContent = T('abajo – arriba · a {n} puntos · {d}', { n: META_DOS, d: G.D.name });
      $('eSub2').textContent = T(G.mejorRally === 1 ? 'Rally más largo: {n} golpe' : 'Rally más largo: {n} golpes', { n: G.mejorRally });
      $('eBadge').hidden = true; $('eXP').hidden = true; $('eLogros').hidden = true;
      if (CC) CC.sumarXP(10);   // un poco de XP por jugar con alguien
    } else {
      CC?.morir();
      const r = settle();
      $('eTitle').textContent = T(G.score >= 15 ? '¡Partidazo!' : G.score >= 6 ? '¡Buena paleta!' : '¡Se terminó!');
      $('eNum').textContent = G.score;
      $('eSub').textContent = T(G.score === 1 ? 'punto · {d} · llegaste al rival {n}' : 'puntos · {d} · llegaste al rival {n}', { d: G.D.name, n: G.nivel + 1 });
      $('eSub2').textContent = T(G.mejorRally === 1 ? 'Rally más largo: {n} golpe' : 'Rally más largo: {n} golpes', { n: G.mejorRally }) +
        (r && !r.record && r.textoAnterior ? ' · ' + T('récord: {r}', { r: r.textoAnterior }) : '');
      $('eBadge').hidden = !(r && r.record);
      if (r) $('eBadge').textContent = r.primera ? T('Primer récord') : T('Nuevo récord');
      $('eXP').hidden = !r; if (r) $('eXP').textContent = `+${r.xp} XP`;
      const lg = (r && r.logros) || [];
      $('eLogros').hidden = !lg.length;
      $('eLogros').replaceChildren(...lg.map(n => Object.assign(document.createElement('span'), { className: 'logro', textContent: n })));

    }

  // la paleta del otro: va hacia donde dijo que estaba, adelantada con su velocidad lo que tardó el mensaje

    } else {

      const A = G.abajo, cambio = Math.abs(A.x - R.ex) > 0.005 || Math.abs(A.v - R.ev) > 0.05;
      if (now - R.tx < (cambio ? 40 : 250)) return;

  // Invitado: la pelota se mueve sola entre mensaje y mensaje (bandas y paletas, igual que en moverBola) y cada mensaje

  function rebote(b, p, dir, sonar) {

      else if (b.x > FW - R_BOLA) { b.x = FW - R_BOLA; b.vx = -Math.abs(b.vx); if (sonar) sfxPared(); }
      if (b.vy > 0 && y0 + R_BOLA <= A.y + 0.05 && b.y + R_BOLA >= A.y && Math.abs(b.x - A.x) <= A.hw + R_BOLA) rebote(b, A, -1, sonar);
      else if (b.vy < 0 && y0 - R_BOLA >= B.y - 0.05 && b.y - R_BOLA <= B.y && Math.abs(b.x - B.x) <= B.hw + R_BOLA) rebote(b, B, 1, sonar);
    }
  }
  function invitado(dt) {
    const R = G.red, b = G.bola;
    if (G.fase === 'cuenta' || G.fase === 'punto') {
      const antes = Math.ceil(G.faseT / 0.5);
      G.faseT = Math.max(0, G.faseT - dt);
      if (G.fase === 'cuenta' && Math.ceil(G.faseT / 0.5) !== antes && G.faseT > 0) sfxTic();
    } else if (G.fase === 'juego' && R.bola) {
      // si dejan de llegar mensajes, la pelota espera en vez de seguir de largo
      if (performance.now() - R.rx < 300) avanzar(R.bola, dt, true);
      const k = Math.exp(-dt * 12);
      R.ox *= k; R.oy *= k;
      b.x = R.bola.x + R.ox; b.y = R.bola.y + R.oy; b.vx = R.bola.vx; b.vy = R.bola.vy; b.vel = R.bola.vel;
      b.estela.push({ x: b.x, y: b.y });
      if (b.estela.length > 10) b.estela.shift();
    }
  }
  function recibirEstado(d) {
    const R = G.red;
    if (d.k !== R.k || !(d.q > R.ultimo) || !Array.isArray(d.b) || !Array.isArray(d.h) || !Array.isArray(d.m)) return;
    R.ultimo = d.q; R.rx = performance.now();
    const lat = latencia(), b = G.bola, antes = G.fase;
    const [bx, by, bvx, bvy, vel] = d.b.map(Number);
    R.gx = FW - (+d.h[0] || 0); R.gv = -(+d.h[1] || 0);
    // marcador: los míos son los que él tiene "en contra"
    const mio = +d.m[1] || 0, suyo = +d.m[0] || 0;
    if (mio !== G.score || suyo !== G.contra) {
      const gane = mio > G.score;
      G.score = mio; G.contra = suyo; hudCache = '';
      chispas(FW - bx, gane ? 0 : FH, gane ? '#ffcc29' : '#ff5d7d', 16, 1.4);
      if (gane) sfxPunto(); else { sfxPierdo(); shake = reduceMotion ? 0 : 10; CC?.vibrar(40); }
    }
    // un golpe nuevo: si ya lo vi venir (y sonó), no suena dos veces
    if (+d.n > R.n) {
      R.n = +d.n; G.golpes = R.n; G.rally = +d.r || 0; G.mejorRally = Math.max(G.mejorRally, G.rally);
      const mia = -bvy < 0, p = mia ? G.abajo : G.arriba;
      if (G.t - R.sono > 0.35) {
        p.golpe = G.t;
        chispas(FW - bx, p.y, '#ffffff', 7, 0.9);
        sfxPaleta(G.rally); if (mia) CC?.vibrar(8);
      }
    }
    G.fase = d.f;
    G.faseT = antes === d.f ? Math.min(G.faseT, Math.max(0, d.t - lat)) : Math.max(0, d.t - lat);
    if (d.f === 'juego') {
      // donde estaba la pelota cuando él mandó el mensaje, adelantada lo que tardó en llegar
      const T = { x: FW - bx, y: FH - by, vx: -bvx, vy: -bvy, vel };
      avanzar(T, lat, false);
      const ox = b.x - T.x, oy = b.y - T.y;
      // lo que venía dibujando y lo de verdad: si es poco, se corrige de a poco; si es mucho (un saque), salta
      if (antes === 'juego' && R.bola && Math.hypot(ox, oy) < 1.5) { R.ox = ox; R.oy = oy; }
      else { R.ox = R.oy = 0; b.estela = []; b.x = T.x; b.y = T.y; }
      R.bola = T;
    } else {
      R.bola = null;
      if (d.f !== 'cuenta') { b.x = FW - bx; b.y = FH - by; }
      b.vel = vel;
    }
    if (d.f === 'fin' && !G.done) { G.done = true; setTimeout(terminar, 650); }
  }
  function finRed() {
    const R = G.red;
    if (R.cerrado) return;
    R.cerrado = true; G.done = true;
    state = 'duelo'; soltarTeclas();
    $('hud').hidden = true; $('pad').classList.add('off');
    if (R.host) sala.enviar('fin', { k: R.k, m: [G.score, G.contra] });
    const gane = G.score > G.contra;
    if (CC) CC.sumarXP(gane ? 15 : 10);
    CD.resultado(sala, { gane,
      texto: `Vos <b>${G.score}</b> · ${esc(DUELO.rival.apodo)} <b>${G.contra}</b>`,
      nota: `Rally más largo: ${G.mejorRally} ${G.mejorRally === 1 ? 'golpe' : 'golpes'}` });
  }
  function salirDuelo() { if (sala && confirm('¿Salir del duelo? Lo perdés.')) sala.salir(); }
  function conectarDuelo() {
    state = 'duelo';
    $('menu').hidden = true;
    sala = CD.sala(DUELO, {
      alConectar: () => sala.listo(),
      alEmpezar: d => empezarRed(d),
      alMensaje(ev, d) {
        if (!G || !G.red || G.red.cerrado) return;
        const R = G.red;
        if (ev === 'y' && R.host) { R.gx = FW - (+d.x || 0); R.gv = -(+d.v || 0); R.rx = performance.now(); }
        else if (ev === 's' && !R.host) recibirEstado(d);
        else if (ev === 'fin' && !R.host && d.k === R.k && Array.isArray(d.m)) {
          // por si se perdió el último estado: el resultado final lo dice el anfitrión
          G.score = +d.m[1] || 0; G.contra = +d.m[0] || 0;
          if (state === 'play') terminar();
        }
      },
      alIrse() {
        const jugando = G && G.red && !G.red.cerrado && state === 'play';
        if (G && G.red) { G.red.cerrado = true; G.done = true; }
        state = 'duelo'; soltarTeclas();
        $('hud').hidden = true; $('pad').classList.add('off');
        const quien = esc(DUELO.rival.apodo);
        CD.resultado(sala, jugando ? { gane: true, sinRevancha: true, texto: `${quien} se fue del duelo.` }
          : { titulo: 'Se fue', sinRevancha: true, texto: `${quien} salió del duelo.` });
      },
    });
    CD.esperandoRival(sala);
  }

  // ---------- arranque ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    // frenado (hitstop): se dibuja sin avanzar nada; `last` ya quedó al día, así que el tiempo frenado no se acumula
    if (!(CC && CC.frenado(now))) update(now, dt);
    draw(now);
    requestAnimationFrame(frame);
  }
  showMenu();
  if (DUELO) conectarDuelo();
  requestAnimationFrame(frame);
  if (CC && CC.pedirApodo && !DUELO) setTimeout(() => CC.pedirApodo(), 600);
})();
</script>

e.classList.add('fuera');setTimeout(function(){e.remove()},400)}

if(l)esperas.push(new Promise(function(r){if(l.sheet)r();l.addEventListener('load',r);l.addEventListener('error',r)}).then(function(){return document.fonts&&document.fonts.ready}));
