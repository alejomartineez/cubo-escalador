<html lang="es">
<head>
<meta charset="utf-8">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Equilibrio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: canvas a pantalla completa; HUD arriba, dos botones gigantes abajo, menús como cartel de juguete centrado */
:root {
  --sky: #62c6ff;
  --ink: #1d2340;
  --paper: #fffaf0;
  --cube: #ffcc29;
  --accent: #ff5d7d;
  --good: #1fbf8a;
  --muted: #5b6382;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
  pointer-events: none;
}
.stat { display: flex; flex-direction: column; line-height: 1; }
.stat.mid { align-items: center; }
.big {
  font-family: var(--display); font-size: clamp(34px, 7vw, 52px);
  color: var(--paper); font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--ink);
}
.lbl {
  font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--paper);
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 0 var(--ink);
  margin-top: 6px;
}
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chip {
  font-weight: 800; font-size: 13px; padding: 5px 10px; border-radius: 999px;
  background: var(--paper); border: 2px solid var(--ink); font-variant-numeric: tabular-nums;
  transition: background .15s; white-space: nowrap;
}
.chip.hot { background: var(--cube); }
.diffchip[data-d="facil"] { background: var(--good); }
.diffchip[data-d="dificil"] { background: var(--accent); }
.hbtns { display: flex; gap: 8px; }
#btnRestart { touch-action: none; min-width: 34px; }
.diffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.diff {
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  font: inherit; color: var(--ink); background: #fff; padding: 8px 4px;
  border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
}
.diff:hover { background: #fff4cc; }
.diff:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.diff[aria-pressed="true"] { background: var(--cube); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.dname { font-family: var(--display); font-size: 19px; line-height: 1; }
.dxp { font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--muted); }
.diff[aria-pressed="true"] .dxp { color: var(--ink); }
.smallbtn {
  pointer-events: auto; font: 800 13px var(--body); color: var(--ink);
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; box-shadow: 0 3px 0 var(--ink); cursor: pointer;
}
.smallbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.pad {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  max-width: 560px; margin: 0 auto;
}
.pad button {
  height: clamp(76px, 13vh, 116px); border-radius: 22px;
  background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
  display: grid; place-items: center; cursor: pointer; touch-action: none;
  transition: transform .05s, box-shadow .05s;
}
.pad button svg { width: 44px; height: 44px; }
.pad button.on { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); background: var(--cube); }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(29, 35, 64, .28);
}
.card {
  width: min(420px, 100%); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
  padding: 22px; display: flex; flex-direction: column; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 48px; height: 48px; flex: none; border-radius: 10px; background: var(--cube);
  border: 3px solid var(--ink); position: relative; transform: rotate(-12deg);
}
.logo::before, .logo::after {
  content: ""; position: absolute; top: 13px; width: 8px; height: 11px; border-radius: 4px; background: var(--ink);
}
.logo::before { left: 11px; } .logo::after { right: 11px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: clamp(32px, 9vw, 42px); }
h2 { font-size: 34px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.mode {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  text-align: left; font: inherit; color: var(--ink);
  background: #fff; border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 4px 0 var(--ink); padding: 12px 14px; cursor: pointer;
}
.mode:hover { background: #fff4cc; }
.mode:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.key {
  font: 800 12px var(--body); width: 24px; height: 24px; border-radius: 6px;
  display: grid; place-items: center; border: 2px solid var(--ink); background: var(--cube);
}
.mname { font-family: var(--display); font-size: 21px; display: block; }
.mdesc { font-size: 13px; color: var(--muted); display: block; margin-top: 2px; }
.mrec { text-align: right; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mrec b { display: block; font-family: var(--display); font-weight: 400; font-size: 19px; letter-spacing: 0; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
kbd { font: 800 12px var(--body); border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; color: var(--ink); background: #fff; }

.result { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.result .num { font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.result .sub { font-size: 14px; color: var(--muted); }
.badge {
  font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  background: var(--good); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px;
}
.tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.badge.xp { background: var(--cube); }
.back { margin-left: auto; flex: none; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row.three { grid-template-columns: 1fr 1fr 1.25fr; }
.row.three .btn { padding-inline: 6px; }
.btn {
  font: 800 16px var(--body); color: var(--ink); padding: 14px 10px; cursor: pointer;
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
}
.btn.primary { background: var(--cube); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.zone {
  position: fixed; left: 0; right: 0; top: 24%;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  text-align: center; pointer-events: none; opacity: 0;
}
.zone strong {
  font-family: var(--display); font-weight: 400; font-size: clamp(32px, 8vw, 50px); line-height: 1.05;
  color: var(--paper); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--ink);
}
.zone.show { animation: zoneIn 2s ease forwards; }
@keyframes zoneIn {
  0% { opacity: 0; transform: translateY(12px) scale(.9); }
  12% { opacity: 1; transform: none; }
  80% { opacity: 1; transform: none; }
  100% { opacity: 0; transform: translateY(-10px); }
}
@keyframes zoneFade { 0%, 100% { opacity: 0; } 12%, 80% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .zone.show { animation-name: zoneFade; } }
@media (max-width: 380px) { .card { padding: 18px; } .mdesc { display: none; } }
</style>

<canvas id="cv"></canvas>

<div class="zone" id="zone"><strong id="zoneT"></strong><span class="lbl" id="zoneS"></span></div>

<div class="hud" id="hud" hidden>
  <div class="stat"><span class="big" id="hDist">0</span><span class="lbl">metros</span></div>
  <div class="stat mid"><span class="big" id="hTime">0.0</span><span class="lbl">segundos</span></div>
  <div class="right">
    <div class="hbtns">
      <button class="smallbtn" id="btnRestart" type="button" aria-label="Reiniciar (R)" title="Reiniciar (R)">↻</button>
      <button class="smallbtn" id="btnQuit" type="button">Menú</button>
    </div>
    <span class="chip diffchip" id="hDiff" data-d="normal">Normal</span>
    <span class="chip" id="hLvl">Nivel 1</span>
  </div>
</div>

<div class="pad" id="pad" hidden>
  <button id="bL" type="button" aria-label="Empujar a la izquierda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
  <button id="bR" type="button" aria-label="Empujar a la derecha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <div class="brand"><div class="logo" aria-hidden="true"></div><h1>Equilibrio</h1><button class="smallbtn back" id="btnGames" type="button" hidden>← Juegos</button></div>
    <p class="intro">El cubo cruza la cuerda floja y se tambalea solo. Si se va para un lado, tocá la flecha del otro para enderezarlo. Ojo con las ráfagas de viento: avisan antes de llegar.</p>
    <div class="diffs" role="group" aria-label="Dificultad">
      <button class="diff" data-d="facil" type="button" aria-pressed="false"><span class="dname">Fácil</span><span class="dxp">×1 XP</span></button>
      <button class="diff" data-d="normal" type="button" aria-pressed="true"><span class="dname">Normal</span><span class="dxp">×1,5 XP</span></button>
      <button class="diff" data-d="dificil" type="button" aria-pressed="false"><span class="dname">Difícil</span><span class="dxp">×2 XP</span></button>
    </div>
    <button class="mode" id="btnPlay" type="button">
      <span class="key">↵</span>
      <span><span class="mname">Cuerda floja</span><span class="mdesc" id="mDesc">Caminá todo lo que puedas sin caerte.</span></span>
      <span class="mrec">Récord<b id="mRec">—</b></span>
    </button>
    <div class="foot">
      <span>Teclado: <kbd>←</kbd> <kbd>→</kbd> o <kbd>A</kbd> <kbd>D</kbd> · <kbd>R</kbd> reinicia</span>
      <button class="smallbtn" id="btnMute" type="button">Sonido: sí</button>
    </div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <div class="result">
      <h2 id="eTitle">¡Plaf!</h2>
      <span class="num" id="eNum">0 m</span>
      <span class="sub" id="eSub"></span>
      <span class="tags"><span class="badge" id="eBadge" hidden>Nuevo récord</span><span class="badge xp" id="eXP" hidden>+0 XP</span></span>
    </div>
    <div class="row" id="eRow">
      <button class="btn" id="btnGames2" type="button" hidden>← Juegos</button>
      <button class="btn" id="btnMenu" type="button">Menú</button>
      <button class="btn primary" id="btnAgain" type="button">Otra vez</button>
    </div>
  </div>
</div>

<script src="cubo-comun.js"></script>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CC = window.CuboComun || null; // perfil y personaje compartidos; sin esto el juego anda igual

  const LIMIT = 0.8;       // rad: pasado esto, el cubo se cae
  const IMP = 0.7;         // rad/s que suma cada toque
  const HOLD = 2.6;        // rad/s² mientras mantenés apretado
  const DAMP = 1.0;        // rozamiento del giro
  const WARN = 0.9;        // s de aviso antes de cada ráfaga
  const LEVEL_EVERY = 20;  // s por nivel

  const SKY = [ // metros, color arriba, color abajo
    [0,   [98, 198, 255],  [201, 241, 255]],
    [150, [79, 180, 255],  [255, 233, 176]],
    [280, [255, 138, 92],  [255, 213, 158]],
    [400, [92, 58, 138],   [255, 138, 138]],
    [520, [14, 26, 74],    [59, 91, 176]],
    [700, [8, 10, 32],     [24, 30, 70]],
  ];
  const LEAVES = ['#1fbf8a', '#ffcc29', '#ff5d7d', '#ffad4d'];
  const TITLES = ['¡Plaf!', '¡A la red!', '¡Boing!', '¡Uy, uy, uy!', '¡Se fue!'];
  // t0: segundos de dificultad con los que arranca; ramp: qué tan rápido sube; k/wind: escala de inestabilidad y viento
  const DIFFS = {
    facil:   { name: 'Fácil',   desc: 'Cuerda más firme y viento suave.',    t0: 0,  ramp: 0.7, k: 0.8, wind: 0.6, gap: 1.2, xp: 1,   xpTxt: '×1' },
    normal:  { name: 'Normal',  desc: 'Se va poniendo difícil con el tiempo.', t0: 0,  ramp: 1,   k: 1,   wind: 1,   gap: 0,   xp: 1.5, xpTxt: '×1,5' },
    dificil: { name: 'Difícil', desc: 'Arranca como el Normal al minuto.',   t0: 60, ramp: 0.7,   k: 1,   wind: 1,   gap: 0,   xp: 2,   xpTxt: '×2' },
  };
  const DIFF_IDS = Object.keys(DIFFS);

  // ---------- récords ----------
  const REC_KEY = 'cubo-equilibrio-records';
  let rec = {};
  try { rec = JSON.parse(localStorage.getItem(REC_KEY)) || {}; } catch (e) { rec = {}; }
  if (!rec.bestBy || typeof rec.bestBy !== 'object') rec.bestBy = {};
  if (rec.best) { rec.bestBy.normal = Math.max(rec.bestBy.normal || 0, rec.best); delete rec.best; } // récord de antes de las dificultades
  let diffId = DIFFS[rec.diff] ? rec.diff : 'normal';
  const saveRec = () => { try { localStorage.setItem(REC_KEY, JSON.stringify(rec)); } catch (e) {} };
  // a la pantalla de juegos va el mejor de todas las dificultades (si empatan, el de la más difícil)
  const shareRec = () => {
    if (!CC) return;
    let best = 0, id = null;
    for (const d of DIFF_IDS) if ((rec.bestBy[d] || 0) > 0 && rec.bestBy[d] >= best) { best = rec.bestBy[d]; id = d; }
    if (id) CC.anotarRecord('equilibrio', `${best} m (${DIFFS[id].name})`);
  };
  shareRec();

  // ---------- sonido ----------
  let actx = null, muted = !!rec.muted, noiseBuf = null;
  function audio() {
    if (muted) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function beep(freq, dur, type = 'triangle', vol = 0.07, slide = 0) {
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function whoosh(dur, f0, f1, vol) {
    const a = audio(); if (!a) return;
    try {
      if (!noiseBuf) {
        noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const t = a.currentTime, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      src.buffer = noiseBuf; src.loop = true;
      f.type = 'bandpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.2, dur / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t + dur + 0.05);
    } catch (e) {}
  }
  const sfxTap = (d, th) => beep((d < 0 ? 470 : 560) + Math.abs(th) * 320, 0.05, 'triangle', 0.07);
  const sfxWarn = () => { beep(880, 0.07, 'square', 0.035); setTimeout(() => beep(880, 0.07, 'square', 0.035), 120); };
  const sfxDanger = () => beep(196, 0.08, 'square', 0.03);
  const sfxMile = () => [659, 988].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.04), i * 80));
  const sfxLevel = () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.14, 'square', 0.045), i * 80));
  const sfxFall = () => beep(900, 0.75, 'sine', 0.09, 0.22);
  const sfxBoing = v => beep(150, 0.35, 'sine', 0.06 + 0.06 * v, 2.4);

  // ---------- canvas ----------
  let W = 0, H = 0, U = 60, ropeY = 0, netY = 0, S = 48;
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    U = Math.max(34, Math.min(W / 7, H / 11, 80));
    S = U * 0.8;
    ropeY = H * 0.47;
    netY = ropeY + Math.min(H * 0.27, U * 3.4);
  }
  addEventListener('resize', resize); resize();
  const PXM = () => U * 1.6; // píxeles por metro

  // ---------- estado ----------
  let state = 'menu';      // menu | play | end
  let G = null;
  let particles = [], floats = [], streaks = [], leaves = [];
  let shake = 0;

  function newRun(demo, D = 0) {
    G = {
      demo, started: demo, t: 0, th: demo ? 0.05 : 0, om: 0, D, face: 1,
      gust: null, nextGust: demo ? 2.5 : 4, level: 1, nextMile: 50, nextDanger: 0,
      fall: null, done: false, botT: 0, pushT: -1e9, pushDir: 0,
      dipA: 0, dipV: 0, dipX: 0,
      ph1: Math.random() * 6, ph2: Math.random() * 6,
      diff: demo ? 'normal' : diffId,
    };
    G.cfg = DIFFS[G.diff];
    particles = []; floats = []; leaves = [];
  }
  const diff = () => G.demo ? 14 : G.cfg.t0 + G.t * G.cfg.ramp;
  const instab = () => Math.min(5.5, 1.5 + diff() * 0.04) * G.cfg.k;
  const walkSpeed = () => Math.min(3, 1.3 + diff() * 0.015);

  function windAt(t) {
    const g = G.gust;
    if (!g || t < g.start || t > g.end) return 0;
    const env = Math.max(0, Math.min(1, (t - g.start) / 0.15, (g.end - t) / 0.2));
    return g.dir * g.str * env;
  }

  function tap(d, now) {
    if (!G || G.fall) return;
    G.face = d; G.pushT = now; G.pushDir = d;
    if (!G.started) { G.started = true; G.th = (Math.random() < 0.5 ? -1 : 1) * 0.04; }
    else G.om += d * IMP;
    // nubecita del lado que empuja
    if (!reduceMotion) {
      const c = Math.cos(G.th), s = Math.sin(G.th), lx = -d * S * 0.62, ly = -S * 0.5;
      const px = W / 2 + lx * c - ly * s, py = ropeY + ly * c + lx * s;
      for (let k = 0; k < 5; k++) particles.push({ x: px, y: py, vx: d * (60 + Math.random() * 120), vy: (Math.random() - 0.5) * 90,
        life: 0.25 + Math.random() * 0.15, age: 0, s: U * (0.07 + Math.random() * 0.05), c: '#fffaf0', g: 0 });
    }
    if (!G.demo) sfxTap(d, G.th);
  }

  function startFall(now) {
    const sg = Math.sign(G.th) || 1;
    G.fall = {
      t0: now, x: Math.sin(G.th) * S / 2, y: -Math.cos(G.th) * S / 2,
      vx: sg * U * 2.2, vy: -U * 1.5, rot: G.th, vr: G.om + sg * 4, bounces: 0, rest: false,
      pole: { x: 0, y: -S * 0.55, vx: -sg * U * 1.8, vy: -U * 4, rot: G.th, vr: -sg * 7, rest: false },
      shown: false,
    };
    G.gust = null;
    if (!G.demo) {
      sfxFall(); shake = reduceMotion ? 0 : 6;
      floats.push({ text: '¡Aaah!', x: W / 2 + G.fall.x, y: ropeY - S * 1.4, t: now });
    }
  }

  // cierra la partida (por caída o porque la cortaste con R): récord y XP
  function settle() {
    if (!G || G.demo || G.done || !G.started) return null;
    G.done = true;
    const m = Math.floor(G.D);
    const isRec = m > (rec.bestBy[G.diff] || 0);
    if (isRec) { rec.bestBy[G.diff] = m; shareRec(); }
    saveRec();
    // 1 XP por segundo aguantado, por el multiplicador de la dificultad
    const xp = CC ? CC.sumarXP(Math.round(G.t * G.cfg.xp)) : null;
    return { m, isRec, xp };
  }

  function finish() {
    const r = settle();
    if (!r) return;
    const { m, isRec, xp } = r;
    $('eXP').hidden = !xp;
    if (xp) $('eXP').textContent = `+${xp.ganada} XP` + (G.cfg.xp !== 1 ? ` (${G.cfg.xpTxt})` : '');
    $('eTitle').textContent = TITLES[Math.floor(Math.random() * TITLES.length)];
    $('eNum').textContent = m + ' m';
    $('eSub').textContent = `${G.t.toFixed(1)} s en la cuerda · nivel ${G.level} · récord en ${G.cfg.name}: ${rec.bestBy[G.diff] || 0} m`;
    $('eBadge').hidden = !isRec;
    if (isRec) sfxLevel();
    showEnd();
  }

  // ---------- pantallas ----------
  function banner(t, s) {
    const z = $('zone');
    $('zoneT').textContent = t; $('zoneS').textContent = s;
    z.classList.remove('show'); void z.offsetWidth; z.classList.add('show');
  }
  function renderMenu() {
    const best = rec.bestBy[diffId];
    $('mRec').textContent = best ? best + ' m' : '—';
    $('mDesc').textContent = DIFFS[diffId].desc;
    for (const b of document.querySelectorAll('.diff')) b.setAttribute('aria-pressed', String(b.dataset.d === diffId));
    $('btnMute').textContent = 'Sonido: ' + (muted ? 'no' : 'sí');
  }
  function setDiff(id) {
    if (!DIFFS[id] || id === diffId) return;
    diffId = id; rec.diff = id; saveRec(); renderMenu();
    beep(520 + DIFF_IDS.indexOf(id) * 140, 0.06);
  }
  function start() {
    newRun(false);
    state = 'play'; hudCache = '';
    $('hDiff').textContent = G.cfg.name; $('hDiff').dataset.d = G.diff;
    $('menu').hidden = true; $('end').hidden = true; $('hud').hidden = false; $('pad').hidden = false;
    $('zone').classList.remove('show');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  // R / ↻: partida nueva al toque con la misma dificultad; si cortás una en curso, se lleva su XP
  function restart() {
    if (state === 'play') settle();
    start();
  }
  function showMenu() {
    if (state === 'play') settle();
    state = 'menu';
    newRun(true, G ? G.D % 120 : 0);
    renderMenu();
    $('menu').hidden = false; $('end').hidden = true; $('hud').hidden = true; $('pad').hidden = true;
    $('zone').classList.remove('show');
  }
  function showEnd() {
    state = 'end';
    $('end').hidden = false; $('pad').hidden = true;
    setTimeout(() => $('btnAgain').focus({ preventScroll: true }), 50);
  }

  // ---------- entrada ----------
  const keys = { L: false, R: false };
  const ptrs = new Map(); // pointerId -> dir
  const holdDir = () => {
    let l = keys.L, r = keys.R;
    for (const d of ptrs.values()) { if (d < 0) l = true; else r = true; }
    return (r ? 1 : 0) - (l ? 1 : 0);
  };
  const flashT = { '-1': 0, '1': 0 };
  function input(d) {
    if (state !== 'play') return;
    flashT[d] = performance.now();
    tap(d, performance.now());
  }
  addEventListener('keydown', e => {
    const k = e.key;
    const dir = (k === 'ArrowLeft' || k === 'a' || k === 'A') ? -1 : (k === 'ArrowRight' || k === 'd' || k === 'D') ? 1 : 0;
    if ((k === 'r' || k === 'R') && (state === 'play' || state === 'end')) {
      e.preventDefault(); if (!e.repeat) restart();
    } else if (state === 'play') {
      if (dir) { e.preventDefault(); keys[dir < 0 ? 'L' : 'R'] = true; if (!e.repeat) input(dir); }
      else if (k === 'Escape') showMenu();
    } else if (state === 'menu') {
      const ae = document.activeElement, onDiff = ae && ae.classList && ae.classList.contains('diff');
      if (dir) {
        e.preventDefault();
        const i = Math.max(0, Math.min(DIFF_IDS.length - 1, DIFF_IDS.indexOf(diffId) + dir));
        setDiff(DIFF_IDS[i]);
        if (onDiff) document.querySelector(`.diff[data-d="${diffId}"]`).focus({ preventScroll: true });
      }
      else if ((k === 'Enter' && (ae === document.body || onDiff)) || (k === ' ' && ae === document.body)) { e.preventDefault(); start(); }
      else if (k === 'Escape' && CC) CC.volver();
    } else if (state === 'end') {
      if (k === 'Escape') showMenu();
      else if ((k === 'Enter' || k === ' ') && document.activeElement === document.body) { e.preventDefault(); start(); }
    }
  });
  addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.L = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.R = false;
  });
  addEventListener('blur', () => { keys.L = keys.R = false; ptrs.clear(); });
  const press = (e, d) => {
    if (state !== 'play') return;
    e.preventDefault(); ptrs.set(e.pointerId, d); input(d);
  };
  $('bL').addEventListener('pointerdown', e => press(e, -1));
  $('bR').addEventListener('pointerdown', e => press(e, 1));
  cv.addEventListener('pointerdown', e => press(e, e.clientX < W / 2 ? -1 : 1));
  for (const ev of ['pointerup', 'pointercancel']) addEventListener(ev, e => ptrs.delete(e.pointerId));
  $('btnPlay').addEventListener('click', start);
  $('btnQuit').addEventListener('click', showMenu);
  $('btnMenu').addEventListener('click', showMenu);
  $('btnAgain').addEventListener('click', start);
  $('btnRestart').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (state === 'play') restart(); });
  for (const b of document.querySelectorAll('.diff')) b.addEventListener('click', () => setDiff(b.dataset.d));
  if (CC) {
    $('btnGames').hidden = false; $('btnGames2').hidden = false; $('eRow').classList.add('three');
    for (const id of ['btnGames', 'btnGames2']) $(id).addEventListener('click', () => CC.volver());
  }
  $('btnMute').addEventListener('click', () => {
    muted = !muted; rec.muted = muted; saveRec(); renderMenu();
    if (!muted) beep(660, 0.08);
  });

  // ---------- utilidades ----------
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp01 = t => Math.max(0, Math.min(1, t));
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  function skyAt(m) {
    let a = SKY[0], b = SKY[SKY.length - 1];
    for (let k = 0; k < SKY.length - 1; k++) if (m >= SKY[k][0] && m < SKY[k + 1][0]) { a = SKY[k]; b = SKY[k + 1]; break; }
    if (m >= SKY[SKY.length - 1][0]) a = b;
    const t = a === b ? 0 : clamp01((m - a[0]) / (b[0] - a[0]));
    const mix = (c1, c2) => `rgb(${c1.map((v, j) => Math.round(lerp(v, c2[j], t))).join(',')})`;
    return [mix(a[1], b[1]), mix(a[2], b[2])];
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function starPath(cx, cy, r) {
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? r * 0.45 : r;
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath();
  }
  const STARS = Array.from({ length: 120 }, (_, k) => [hash(k + 1), hash(k + 501) * 0.7, 0.6 + hash(k + 901) * 1.5]);

  // ---------- bucle ----------
  let last = performance.now(), hudCache = '';
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(now, dt); draw(now);
    requestAnimationFrame(frame);
  }

  function update(now, dt) {
    // bot del menú
    if (G.demo && !G.fall && now >= G.botT) {
      const u = 2.6 * G.th + 0.9 * G.om + windAt(G.t) * 0.25;
      if (u > 0.22) tap(-1, now); else if (u < -0.22) tap(1, now);
      G.botT = now + 90;
    }

    if (G.started && !G.fall) {
      G.t += dt;
      const d = diff();
      // ráfagas
      if (!G.gust && G.t >= G.nextGust - WARN) {
        const str = Math.min(4.2, 1.4 + d * 0.03) * (0.75 + Math.random() * 0.45) * G.cfg.wind;
        const dur = 0.6 + Math.random() * 0.6 + Math.min(0.6, d * 0.006);
        G.gust = { dir: Math.random() < 0.5 ? -1 : 1, str, warn: G.t, start: G.nextGust, end: G.nextGust + dur, blown: false };
        if (!G.demo) sfxWarn();
      }
      if (G.gust && !G.gust.blown && G.t >= G.gust.start) {
        G.gust.blown = true;
        if (!G.demo) whoosh(G.gust.end - G.gust.start + 0.3, G.gust.dir > 0 ? 500 : 900, G.gust.dir > 0 ? 1400 : 380, 0.12);
      }
      if (G.gust && G.t > G.gust.end) {
        G.nextGust = G.t + Math.max(1.5, 5 - d * 0.035) + G.cfg.gap + Math.random() * 1.2;
        G.gust = null;
      }
      // péndulo invertido
      const K = instab(), hold = G.demo ? 0 : holdDir();
      const na = Math.min(1.2, 0.35 + d * 0.01) * G.cfg.k;
      const n = 4, h = dt / n;
      for (let i = 0; i < n; i++) {
        const tt = G.t - dt + h * (i + 1);
        const noise = na * (Math.sin(tt * 1.3 + G.ph1) + 0.6 * Math.sin(tt * 2.9 + G.ph2));
        const acc = K * Math.sin(G.th) - DAMP * G.om + windAt(tt) + hold * HOLD + noise;
        G.om = Math.max(-4, Math.min(4, G.om + acc * h));
        G.th += G.om * h;
      }
      G.D += walkSpeed() * dt;

      if (!G.demo) {
        if (G.D >= G.nextMile) {
          floats.push({ text: G.nextMile + ' m', x: W / 2, y: ropeY - S * 1.6, t: now, big: true });
          G.nextMile += 50; sfxMile();
        }
        const lv = 1 + Math.floor(G.t / LEVEL_EVERY);
        if (lv > G.level) { G.level = lv; banner('Nivel ' + lv, lv % 2 ? 'Más inestable' : 'Más viento'); sfxLevel(); }
        if (Math.abs(G.th) > 0.55 && now >= G.nextDanger) { sfxDanger(); G.nextDanger = now + 320; }
      }
      if (Math.abs(G.th) > LIMIT) startFall(now);
    }

    if (G.fall) updateFall(now, dt);

    // red elástica
    const restT = G.fall && G.fall.rest ? U * 0.14 : 0;
    G.dipV += (-(G.dipA - restT) * 120 - G.dipV * 9) * dt;
    G.dipA += G.dipV * dt;

    // viento: rayas y hojas
    const g = G.gust;
    if (!reduceMotion) {
      let rate = 1.5, dir = Math.random() < 0.5 ? -1 : 1, fast = false;
      if (g) { dir = g.dir; if (G.t >= g.start) { rate = 55; fast = true; } else rate = 10; }
      if (Math.random() < rate * dt) {
        const len = U * (fast ? 1.2 + Math.random() * 1.4 : 0.6 + Math.random() * 0.6);
        streaks.push({ x: dir > 0 ? -len : W + len, y: H * (0.12 + Math.random() * 0.66), vx: dir * (fast ? 900 + Math.random() * 500 : 260 + Math.random() * 200), len, w: fast ? 2.5 : 1.8 });
      }
      if (g && G.t >= g.start && Math.random() < 6 * dt) {
        leaves.push({ x: g.dir > 0 ? -20 : W + 20, y: H * (0.15 + Math.random() * 0.55), vx: g.dir * (380 + Math.random() * 260),
          rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, ph: Math.random() * 6, c: LEAVES[Math.floor(Math.random() * LEAVES.length)] });
      }
    }
    for (const s of streaks) s.x += s.vx * dt;
    streaks = streaks.filter(s => s.x > -s.len * 2 && s.x < W + s.len * 2);
    for (const l of leaves) { l.x += l.vx * dt; l.rot += l.vr * dt; l.y += Math.sin(now / 160 + l.ph) * 60 * dt; }
    leaves = leaves.filter(l => l.x > -40 && l.x < W + 40);
    for (const p of particles) { p.age += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-dt * 4); }
    particles = particles.filter(p => p.age < p.life);
    floats = floats.filter(f => now - f.t < 900);
    shake *= Math.exp(-dt * 14);

    if (state === 'play' || state === 'end') {
      let chip = 'Nivel ' + G.level, hot = false;
      if (g) { chip = g.dir > 0 ? '¡Viento! →' : '← ¡Viento!'; hot = true; }
      const sig = Math.floor(G.D) + '|' + G.t.toFixed(1) + '|' + chip;
      if (sig !== hudCache) {
        hudCache = sig;
        $('hDist').textContent = Math.floor(G.D); $('hTime').textContent = G.t.toFixed(1);
        $('hLvl').textContent = chip; $('hLvl').classList.toggle('hot', hot);
      }
    }
    for (const d of [-1, 1]) {
      const held = state === 'play' && (holdDir() === d || now - flashT[d] < 90);
      const b = d < 0 ? $('bL') : $('bR');
      if (b.classList.contains('on') !== held) b.classList.toggle('on', held);
    }
  }

  function updateFall(now, dt) {
    const F = G.fall, grav = U * 26;
    const netAt = x => netY - ropeY + G.dipA * Math.exp(-(((x - G.dipX) / (U * 1.8)) ** 2));
    if (!F.rest) {
      F.vy += grav * dt; F.x += F.vx * dt; F.y += F.vy * dt; F.rot += F.vr * dt;
      const floor = netAt(W / 2 + F.x) - S / 2;
      if (F.y > floor && F.vy > 0) {
        F.y = floor; G.dipX = W / 2 + F.x;
        G.dipV += F.vy * 0.35;
        const v = clamp01(F.vy / (U * 14));
        if (F.vy < U * 3 || F.bounces >= 2) { F.rest = true; F.vy = 0; }
        else { F.vy = -F.vy * 0.5; F.vx *= 0.55; F.vr *= 0.5; }
        F.bounces++;
        if (!G.demo) {
          sfxBoing(v);
          if (F.bounces === 1) floats.push({ text: '¡Boing!', x: W / 2 + F.x, y: ropeY + F.y - S, t: now });
          shake = reduceMotion ? 0 : 4 * v;
        }
      }
    } else {
      F.vx *= Math.exp(-dt * 6); F.x += F.vx * dt;
      F.y = netAt(W / 2 + F.x) - S / 2;
      const snap = Math.round(F.rot / (Math.PI / 2)) * (Math.PI / 2);
      F.rot += (snap - F.rot) * (1 - Math.exp(-dt * 10));
    }
    const P = F.pole;
    if (!P.rest) {
      P.vy += grav * dt; P.x += P.vx * dt; P.y += P.vy * dt; P.rot += P.vr * dt;
      const floor = netAt(W / 2 + P.x) - U * 0.08;
      if (P.y > floor && P.vy > 0) {
        P.y = floor;
        if (P.vy < U * 4) { P.rest = true; } else { P.vy = -P.vy * 0.4; P.vx *= 0.5; P.vr *= 0.4; }
      }
    } else {
      P.y = netAt(W / 2 + P.x) - U * 0.08;
      P.rot += (Math.round(P.rot / Math.PI) * Math.PI - P.rot) * (1 - Math.exp(-dt * 8));
    }
    const age = now - F.t0;
    if (G.demo) { if (age > 1800) newRun(true, G.D); return; }
    if (!F.shown && age > 1500) { F.shown = true; if (state === 'play') finish(); }
  }

  // ---------- dibujo ----------
  function draw(now) {
    const m = G.D, pxm = PXM(), camX = m * pxm;
    const [top, bot] = skyAt(m);
    const gr = ctx.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, top); gr.addColorStop(1, bot);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    const night = clamp01((m - 380) / 120);

    // estrellas
    if (night > 0) {
      for (const [sx, sy, r] of STARS) {
        ctx.globalAlpha = night * (0.55 + 0.45 * Math.sin(now / 400 + sx * 40));
        ctx.fillStyle = '#fff';
        ctx.fillRect(((sx * W - camX * 0.02) % W + W) % W, sy * H, r, r);
      }
      ctx.globalAlpha = 1;
    }
    // sol que baja y luna que sube
    const sunA = 1 - clamp01((m - 380) / 60);
    if (sunA > 0) {
      const sy = lerp(H * 0.2, H * 0.78, clamp01(m / 440)), sr = U * 0.9;
      ctx.globalAlpha = sunA;
      ctx.fillStyle = 'rgba(255,240,170,.35)'; ctx.beginPath(); ctx.arc(W * 0.8, sy, sr * 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = m > 220 ? '#ffb347' : '#ffe36b'; ctx.beginPath(); ctx.arc(W * 0.8, sy, sr, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (night > 0) {
      const my = lerp(H * 0.8, H * 0.2, clamp01((m - 430) / 220)), mr = U * 0.75;
      ctx.globalAlpha = night;
      ctx.fillStyle = '#eeedf5'; ctx.beginPath(); ctx.arc(W * 0.22, my, mr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(70,70,100,.2)';
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(W * 0.22 + (hash(k + 3) - 0.5) * mr, my + (hash(k + 9) - 0.5) * mr, mr * (0.12 + hash(k + 5) * 0.12), 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
    }

    // nubes
    const cloudA = 0.85 * (1 - night * 0.7);
    ctx.fillStyle = '#fff';
    {
      const P = 0.12, GAP = U * 4, off = camX * P + now * 0.008;
      const kLo = Math.floor((off - W) / GAP) - 1, kHi = Math.ceil((off + W) / GAP) + 1;
      for (let k = kLo; k <= kHi; k++) {
        if (hash(k) < 0.45) continue;
        const x = W / 2 + k * GAP - off, y = H * (0.1 + hash(k + 13) * 0.25), s = U * (0.4 + hash(k + 21) * 0.5);
        ctx.globalAlpha = cloudA;
        ctx.beginPath();
        ctx.ellipse(x, y, s * 1.6, s * 0.6, 0, 0, Math.PI * 2);
        ctx.ellipse(x - s * 0.6, y - s * 0.3, s * 0.75, s * 0.6, 0, 0, Math.PI * 2);
        ctx.ellipse(x + s * 0.5, y - s * 0.45, s * 0.85, s * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ciudad con parallax
    skyline(camX * 0.15, U * 1.3, H * 0.3, H * 0.62, 'rgba(29,35,64,.13)', 0, 0);
    skyline(camX * 0.35, U * 1.7, H * 0.2, H * 0.48, 'rgba(29,35,64,.24)', 100, night);

    const sxs = (Math.random() - 0.5) * shake, sys = (Math.random() - 0.5) * shake;
    ctx.save(); ctx.translate(sxs, sys);

    // postes cada 10 m
    const postGap = 10 * pxm;
    const k0 = Math.floor((camX - W) / postGap), k1 = Math.ceil((camX + W) / postGap);
    for (let k = Math.max(0, k0); k <= k1; k++) {
      const x = W / 2 + k * postGap - camX;
      if (x < -U || x > W + U) continue;
      const pw = U * 0.22;
      ctx.fillStyle = '#b5713a'; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 2.5;
      rr(x - pw / 2, ropeY - U * 0.5, pw, H - ropeY + U, pw * 0.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff5d7d'; ctx.beginPath(); ctx.arc(x, ropeY - U * 0.55, U * 0.16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (k > 0) {
        const sw = U * 1.1, sh = U * 0.48, sy = ropeY + U * 0.45;
        ctx.fillStyle = '#fffaf0'; rr(x - sw / 2, sy, sw, sh, U * 0.1); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#1d2340'; ctx.font = `${Math.round(U * 0.3)}px "Lilita One", "Trebuchet MS", sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(k * 10 + ' m', x, sy + sh / 2 + 1);
      }
    }

    // red de seguridad
    drawNet();

    // cuerda (se hunde un poco bajo el cubo)
    const dip = G.fall ? 0 : U * 0.1;
    const ropeAt = x => ropeY + dip * Math.exp(-(((x - W / 2) / (U * 2.6)) ** 2));
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const [c, w] of [['#1d2340', Math.max(5, U * 0.1)], ['#e8c58a', Math.max(2, U * 0.04)]]) {
      ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath();
      for (let x = -10; x <= W + 10; x += 10) ctx.lineTo(x, ropeAt(x));
      ctx.stroke();
    }

    // rayas de viento
    ctx.lineCap = 'round';
    for (const s of streaks) {
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = s.w;
      const tail = -Math.sign(s.vx) * s.len;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + tail, s.y); ctx.stroke();
    }
    for (const l of leaves) {
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot);
      ctx.fillStyle = l.c; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, 0, U * 0.16, U * 0.08, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    // cubo
    if (!G.fall) {
      const bob = G.started ? Math.abs(Math.sin(m * Math.PI * 1.6)) * U * 0.05 : 0;
      const fx = W / 2, fy = ropeAt(fx) - bob;
      ctx.save(); ctx.translate(fx, fy); ctx.rotate(G.th);
      const pt = (now - G.pushT) / 160, kick = pt >= 0 && pt < 1 ? Math.sin(Math.PI * pt) * G.pushDir * U * 0.06 : 0;
      drawPole(0, -S * 0.42, 0, G.om);
      const worried = Math.abs(G.th) > 0.45, look = Math.max(-1, Math.min(1, G.th * 2));
      if (CC) {
        CC.dibujarCubo(ctx, kick, 0, S, { mirar: look, t: now });
        ctx.translate(kick, -S / 2);
        if (worried) drawSweat(look);
      } else {
        ctx.translate(kick, -S / 2);
        drawCubeBody(worried ? 'worried' : 'ok', look);
      }
      drawHands();
      ctx.restore();
      drawGauge(now);
    } else {
      const F = G.fall, P = F.pole;
      ctx.save(); ctx.translate(W / 2 + P.x, ropeY + P.y); ctx.rotate(P.rot); drawPole(0, 0, 0, 0); ctx.restore();
      if (CC) {
        // ya en la red se dibuja derecho, para que las estrellitas del mareo queden arriba
        const rot = F.rest ? F.rot - Math.round(F.rot / (Math.PI / 2)) * (Math.PI / 2) : F.rot;
        ctx.save(); ctx.translate(W / 2 + F.x, ropeY + F.y); ctx.rotate(rot);
        CC.dibujarCubo(ctx, 0, S / 2, S, { mareado: true, t: now });
        ctx.restore();
      } else {
        ctx.save(); ctx.translate(W / 2 + F.x, ropeY + F.y); ctx.rotate(F.rot);
        drawCubeBody('fall', 0);
        ctx.restore();
      }
      if (F.rest && !CC) {
        const cx = W / 2 + F.x, cy = ropeY + F.y - S * 0.8;
        for (let k = 0; k < 3; k++) {
          const ang = now / 110 + k * (Math.PI * 2 / 3);
          ctx.fillStyle = '#ffe14d'; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 2;
          starPath(cx + Math.cos(ang) * S * 0.55, cy + Math.sin(ang) * S * 0.16, S * 0.14); ctx.fill(); ctx.stroke();
        }
      }
    }

    // partículas
    for (const p of particles) {
      ctx.globalAlpha = 1 - p.age / p.life; ctx.fillStyle = p.c; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const f of floats) {
      const a = (now - f.t) / 900;
      ctx.globalAlpha = 1 - a * a;
      ctx.font = `${Math.round(U * (f.big ? 0.55 : 0.42))}px "Lilita One", "Trebuchet MS", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d2340'; ctx.fillStyle = f.big ? '#ffcc29' : '#fffaf0';
      const fy = f.y - a * U * 0.7;
      ctx.strokeText(f.text, f.x, fy); ctx.fillText(f.text, f.x, fy);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // aviso de ráfaga
    const g = G.gust;
    if (g && !G.fall && (state !== 'menu' || G.t >= g.start)) drawWindSign(now, g);

    // borde rojo cuando estás por caerte
    const danger = G.fall ? 0 : clamp01((Math.abs(G.th) - 0.45) / 0.3);
    if (danger > 0 && !G.demo) {
      const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
      vg.addColorStop(0, 'rgba(255,93,125,0)'); vg.addColorStop(1, `rgba(255,93,125,${0.5 * danger})`);
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }

    // pista de arranque
    if (state === 'play' && !G.started) {
      ctx.globalAlpha = 0.75 + 0.25 * Math.sin(now / 180);
      ctx.font = `${Math.round(Math.min(U * 0.48, W / 14))}px "Lilita One", "Trebuchet MS", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d2340'; ctx.fillStyle = '#fffaf0';
      const ty = ropeY - U * 3.3;
      ctx.strokeText('Tocá ← o → para arrancar', W / 2, ty); ctx.fillText('Tocá ← o → para arrancar', W / 2, ty);
      ctx.globalAlpha = 1;
    }
  }

  function skyline(off, step, hMin, hMax, color, seed, lit) {
    const kLo = Math.floor((off - W) / step) - 1, kHi = Math.ceil((off + W) / step) + 1;
    for (let k = kLo; k <= kHi; k++) {
      const x = W / 2 + k * step - off, w = step * (0.72 + hash(k + seed) * 0.28);
      const h = hMin + hash(k + seed + 50) * (hMax - hMin), y = H - h;
      ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
      if (hash(k + seed + 70) > 0.6) ctx.fillRect(x + w * 0.4, y - U * 0.4, w * 0.12, U * 0.4);
      if (lit > 0) {
        ctx.fillStyle = `rgba(255,214,102,${0.75 * lit})`;
        const cw = U * 0.16, ch = U * 0.22;
        for (let yy = y + U * 0.3; yy < H - ch; yy += U * 0.5)
          for (let xx = x + U * 0.18; xx < x + w - cw - U * 0.1; xx += U * 0.38)
            if (hash(xx * 0.37 + yy * 1.91 + k) > 0.55) ctx.fillRect(xx, yy, cw, ch);
      }
    }
  }

  function drawNet() {
    const band = U * 0.45, step = U * 0.32;
    const yAt = x => netY + G.dipA * Math.exp(-(((x - G.dipX) / (U * 1.8)) ** 2));
    ctx.strokeStyle = 'rgba(29,35,64,.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = -step * 2; x <= W + step * 2; x += step) {
      const ox = x - ((G.D * PXM()) % step);
      ctx.moveTo(ox, yAt(ox)); ctx.lineTo(ox + step, yAt(ox + step) + band);
      ctx.moveTo(ox + step, yAt(ox + step)); ctx.lineTo(ox, yAt(ox) + band);
    }
    ctx.stroke();
    ctx.lineCap = 'round';
    for (const [dy, w] of [[0, Math.max(4, U * 0.08)], [band, Math.max(3, U * 0.06)]]) {
      ctx.strokeStyle = '#1d2340'; ctx.lineWidth = w; ctx.beginPath();
      for (let x = -10; x <= W + 10; x += 10) ctx.lineTo(x, yAt(x) + dy);
      ctx.stroke();
    }
    ctx.strokeStyle = '#ff5d7d'; ctx.lineWidth = Math.max(2, U * 0.035); ctx.beginPath();
    for (let x = -10; x <= W + 10; x += 10) ctx.lineTo(x, yAt(x));
    ctx.stroke();
  }

  // pértiga de equilibrista, en coordenadas locales del cubo
  function drawPole(x, y, rot, om) {
    const L = U * 1.55, droop = U * 0.14 + Math.max(-1, Math.min(1, om * 0.15)) * U * 0.05;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(5, U * 0.1);
    ctx.beginPath(); ctx.moveTo(-L, droop); ctx.quadraticCurveTo(0, -U * 0.06, L, droop); ctx.stroke();
    ctx.strokeStyle = '#ff5d7d'; ctx.lineWidth = Math.max(2.5, U * 0.05);
    ctx.beginPath(); ctx.moveTo(-L, droop); ctx.quadraticCurveTo(0, -U * 0.06, L, droop); ctx.stroke();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#1d2340';
    for (const [sx, c] of [[-1, '#1fbf8a'], [1, '#5cb0ff']]) {
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(sx * L, droop, U * 0.14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
  // gota de sudor al costado (centro del cubo en el origen)
  function drawSweat(look) {
    const s = S, dx = -Math.sign(look || 1) * s * 0.36;
    ctx.fillStyle = '#7fd3ff'; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(dx, -s * 0.34); ctx.quadraticCurveTo(dx + s * 0.08, -s * 0.2, dx, -s * 0.16);
    ctx.quadraticCurveTo(dx - s * 0.08, -s * 0.2, dx, -s * 0.34); ctx.fill(); ctx.stroke();
  }
  function drawHands() {
    ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 2.5;
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * S * 0.52, S * 0.08, S * 0.12, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
  }

  // cuerpo del cubo centrado en el origen
  function drawCubeBody(mood, look) {
    const s = S;
    ctx.fillStyle = 'rgba(29,35,64,.2)'; rr(-s / 2 + 3, -s / 2 + 4, s, s, s * 0.2); ctx.fill();
    ctx.fillStyle = mood === 'fall' ? '#ffd966' : '#ffcc29';
    ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(2.5, U * 0.05);
    rr(-s / 2, -s / 2, s, s, s * 0.2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; rr(-s * 0.36, -s * 0.4, s * 0.72, s * 0.12, s * 0.06); ctx.fill();

    const ex = s * 0.2, ey = -s * 0.06, lk = look * s * 0.07;
    ctx.fillStyle = '#1d2340'; ctx.strokeStyle = '#1d2340'; ctx.lineCap = 'round';
    if (mood === 'fall') {
      ctx.lineWidth = Math.max(2, U * 0.04);
      for (const side of [-1, 1]) {
        const x0 = side * ex, d = s * 0.08;
        ctx.beginPath(); ctx.moveTo(x0 - d, ey - d); ctx.lineTo(x0 + d, ey + d);
        ctx.moveTo(x0 + d, ey - d); ctx.lineTo(x0 - d, ey + d); ctx.stroke();
      }
      ctx.beginPath(); ctx.ellipse(0, s * 0.22, s * 0.1, s * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    } else if (mood === 'worried') {
      for (const side of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(side * ex + lk, ey, s * 0.08, s * 0.12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = Math.max(2, U * 0.035);
        ctx.beginPath(); ctx.moveTo(side * ex - s * 0.09, ey - s * 0.2 + side * s * 0.04); ctx.lineTo(side * ex + s * 0.09, ey - s * 0.2 - side * s * 0.04); ctx.stroke();
      }
      ctx.beginPath(); ctx.ellipse(lk, s * 0.22, s * 0.06, s * 0.07, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7fd3ff'; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 1.5;
      const dx = -Math.sign(look || 1) * s * 0.36;
      ctx.beginPath(); ctx.moveTo(dx, -s * 0.34); ctx.quadraticCurveTo(dx + s * 0.08, -s * 0.2, dx, -s * 0.16);
      ctx.quadraticCurveTo(dx - s * 0.08, -s * 0.2, dx, -s * 0.34); ctx.fill(); ctx.stroke();
    } else {
      for (const side of [-1, 1]) { rr(side * ex + lk - s * 0.06, ey - s * 0.1, s * 0.12, s * 0.2, s * 0.06); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,93,125,.55)';
      for (const side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(side * s * 0.3 + lk, s * 0.2, s * 0.08, s * 0.05, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(2, U * 0.035);
      ctx.beginPath(); ctx.arc(lk, s * 0.16, s * 0.1, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    }
  }

  // medidor de inclinación encima del cubo
  function drawGauge(now) {
    if (G.demo) return;
    const cx = W / 2, cy = ropeY - U * 2.0, r = U * 0.62, base = -Math.PI / 2;
    const segs = [[-LIMIT, -0.55, '#ff5d7d'], [-0.55, -0.3, '#ffcc29'], [-0.3, 0.3, '#1fbf8a'], [0.3, 0.55, '#ffcc29'], [0.55, LIMIT, '#ff5d7d']];
    ctx.lineCap = 'butt';
    ctx.strokeStyle = '#1d2340'; ctx.lineWidth = U * 0.2;
    ctx.beginPath(); ctx.arc(cx, cy, r, base - LIMIT - 0.04, base + LIMIT + 0.04); ctx.stroke();
    ctx.lineWidth = U * 0.12;
    for (const [a, b, c] of segs) { ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(cx, cy, r, base + a, base + b); ctx.stroke(); }
    const a = base + Math.max(-LIMIT, Math.min(LIMIT, G.th));
    ctx.lineCap = 'round'; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(3, U * 0.06);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r * 1.12, cy + Math.sin(a) * r * 1.12); ctx.stroke();
    ctx.fillStyle = '#fffaf0'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, U * 0.1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  function drawWindSign(now, g) {
    const blowing = G.t >= g.start;
    const x = g.dir > 0 ? Math.max(16, U * 0.3) + U * 0.8 : W - Math.max(16, U * 0.3) - U * 0.8;
    const y = ropeY - U * 1.5;
    const pulse = blowing ? 1 : 0.85 + 0.15 * Math.sin(now / 70);
    const nudge = reduceMotion ? 0 : Math.sin(now / 90) * U * 0.08 * g.dir;
    ctx.save(); ctx.translate(x + nudge, y); ctx.scale(g.dir * pulse, pulse);
    ctx.globalAlpha = blowing ? 0.65 : 1;
    ctx.fillStyle = blowing ? '#fffaf0' : '#ffcc29'; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    const a = U * 0.75;
    ctx.beginPath();
    ctx.moveTo(-a, -a * 0.22); ctx.lineTo(a * 0.1, -a * 0.22); ctx.lineTo(a * 0.1, -a * 0.55);
    ctx.lineTo(a, 0); ctx.lineTo(a * 0.1, a * 0.55); ctx.lineTo(a * 0.1, a * 0.22); ctx.lineTo(-a, a * 0.22);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    if (!blowing) {
      ctx.globalAlpha = 1;
      ctx.font = `${Math.round(U * 0.36)}px "Lilita One", "Trebuchet MS", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d2340'; ctx.fillStyle = '#fffaf0';
      ctx.strokeText('¡Viento!', x, y - U * 0.6); ctx.fillText('¡Viento!', x, y - U * 0.6);
    }
    ctx.globalAlpha = 1;
  }

  showMenu();
  requestAnimationFrame(frame);
})();
</script>

</body>
