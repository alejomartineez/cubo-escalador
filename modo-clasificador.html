<title>Clasificador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: canvas a pantalla completa; cola de cubos en el centro, una caja a cada lado sobre el piso, HUD arriba y dos botones gigantes abajo */
:root {
  --sky: #62c6ff;
  --ink: #1d2340;
  --paper: #fffaf0;
  --cube: #ffcc29;
  --blue: #5cb0ff;
  --accent: #ff5d7d;
  --good: #1fbf8a;
  --muted: #5b6382;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
  pointer-events: none;
  zoom: var(--ui, 1);
}
.stat { display: flex; flex-direction: column; line-height: 1; }
.stat.mid { align-items: center; }
.big {
  font-family: var(--display); font-size: clamp(34px, 7vw, 52px);
  color: var(--paper); font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--ink);
  transition: color .15s;
}
.big.hurry { color: var(--accent); }
.big.plus { color: var(--good); }
.lbl {
  font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--paper);
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 0 var(--ink);
  margin-top: 6px;
}
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chip {
  font-weight: 800; font-size: 13px; padding: 5px 10px; border-radius: 999px;
  background: var(--paper); border: 2px solid var(--ink); font-variant-numeric: tabular-nums;
  transition: background .15s;
}
.chip.hot { background: var(--cube); }
.stat .chip { align-self: flex-start; margin-top: 8px; font-size: 12px; padding: 3px 9px 3px 6px; display: flex; align-items: center; gap: 4px; }
.chip .cc-ico { flex: none; }
.chip.d-facil { background: var(--good); } .chip.d-dificil { background: var(--accent); } .chip.d-extremo { background: #ff3b3b; } .chip.d-maestro { background: #b49bff; }
.vidas { color: #e0324f; letter-spacing: 1px; }
.hbtns { display: flex; gap: 8px; }
#btnRestart { font-size: 16px; line-height: 1; padding: 4px 11px; touch-action: none; }
.smallbtn {
  pointer-events: auto; font: 800 13px var(--body); color: var(--ink);
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; box-shadow: 0 3px 0 var(--ink); cursor: pointer;
}
.smallbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.pad {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  max-width: 560px; margin: 0 auto;
  zoom: var(--ui, 1);
}
.pad.off { visibility: hidden; }
.pad.sincajas .pbox { display: none; }
.pad button {
  height: clamp(76px, 13vh, 116px); border-radius: 22px;
  background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  cursor: pointer; touch-action: none; font: inherit;
  transition: transform .05s, box-shadow .05s;
}
.pad .prow { display: flex; align-items: center; gap: 8px; }
.pad .prow > svg { width: 34px; height: 34px; }
.pad .pbox { width: 34px; height: 34px; display: block; }
.pad .pbox svg { width: 100%; height: 100%; stroke: var(--ink); stroke-linejoin: round; }
.pad .ptx { font-family: var(--display); font-size: 18px; line-height: 1; }
.pad button.on { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); background: var(--cube); }
.f-y { fill: var(--cube); } .f-b { fill: var(--blue); } .f-p { fill: var(--paper); }

/* ayuda de la primera partida: cartel arriba (donde va el cartel del canvas) y los dos botones titilan */
.tip {
  position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 122px * var(--ui, 1));
  display: flex; justify-content: center; padding: 0 16px; pointer-events: none;
}
.tip[hidden] { display: none; }
.tip > div {
  zoom: var(--ui, 1); width: 340px; max-width: 100%;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink);
  padding: 10px 14px; font-size: 15px; font-weight: 600; line-height: 1.35; text-align: center;
}
.tip b { font-family: var(--display); font-weight: 400; font-size: 20px; display: block; margin-bottom: 2px; }
.pad.hint button { animation: hint .9s ease-in-out infinite; }
@keyframes hint { 50% { background: #ffe58a; transform: translateY(-3px); box-shadow: 0 10px 0 var(--ink); } }
@media (prefers-reduced-motion: reduce) { .pad.hint button { animation: none; background: #ffe58a; } }

.overlay {
  position: fixed; inset: 0; display: flex; overflow-y: auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(29, 35, 64, .28);
}
.card {
  margin: auto;
  width: min(420px, 100%); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
  padding: 22px; display: flex; flex-direction: column; gap: 16px;
  zoom: var(--ui, 1);
}
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
/* teclas de la demo: copia en chico de los botones de abajo del juego (flecha + la caja de ese lado) */
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.key {
  display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px;
  font: 400 clamp(15px, 4.6vw, 18px) var(--display); background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; white-space: nowrap;
  box-shadow: 0 5px 0 var(--ink); transition: transform .08s, box-shadow .08s, background .08s;
}
.key > svg { width: 22px; height: 22px; flex: none; }
.key .pbox { width: 26px; height: 26px; display: block; }
.key .pbox svg { width: 100%; height: 100%; stroke: var(--ink); stroke-linejoin: round; display: block; }
.key.on { background: var(--cube); transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.lbl-dif { margin: 0 0 -8px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.btn.again { font-family: var(--display); font-weight: 400; font-size: 26px; padding: 12px 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.again kbd { font-size: 13px; }
.cc-teclas.avisa .g.menu { animation: avisa .9s ease-out; border-radius: 8px; }
@keyframes avisa { 0%, 60% { background: #ffe58a; box-shadow: 0 0 0 5px #ffe58a; } 100% { background: transparent; box-shadow: 0 0 0 5px transparent; } }
@media (pointer: coarse) { .kbd-only { display: none; } }
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 48px; height: 48px; flex: none; border-radius: 10px; background: var(--cube);
  border: 3px solid var(--ink); position: relative; transform: rotate(-6deg);
}
.logo::before, .logo::after {
  content: ""; position: absolute; top: 13px; width: 8px; height: 11px; border-radius: 4px; background: var(--ink);
}
.logo::before { left: 11px; } .logo::after { right: 11px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: clamp(32px, 9vw, 42px); }
h2 { font-size: 34px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.intro b { color: var(--ink); }

/* mini demo del menú: muestra qué hace cada flecha */
.demo { margin: 0; display: flex; flex-direction: column; gap: 6px; }
#demo { width: 100%; height: 108px; display: block; background: #e3f6ff; border: 2px solid var(--ink); border-radius: 14px; }
.demo figcaption { min-height: 20px; text-align: center; font-size: 14px; font-weight: 800; }

.fallback-difs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.fallback-difs .btn { padding: 10px 4px; font-size: 14px; }
.fallback-difs .btn[aria-checked="true"] { background: var(--cube); }
.go { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; align-items: stretch; }
.go .btn.primary { font-family: var(--display); font-weight: 400; font-size: 24px; padding: 12px 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.go .btn.primary kbd { font-size: 13px; }
.go .btn { white-space: nowrap; }
.mrec { margin: -4px 0 0; text-align: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mrec b { color: var(--ink); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
kbd { font: 800 12px var(--body); border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; color: var(--ink); background: #fff; }

.result { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.result .num { font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.result .sub { font-size: 14px; color: var(--muted); }
.badge {
  font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  background: var(--good); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px;
}
.badge.xp { background: var(--cube); }
.badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.logros { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.logros li { font-weight: 800; font-size: 14px; background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 4px 12px; }
.logros li::before { content: "★ "; color: #e0a020; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row .btn.primary { font-size: 18px; }
.go > [hidden] + .btn, .row > [hidden] + .btn { grid-column: 1 / -1; }
.back { align-self: flex-start; }
.links { display: flex; justify-content: space-between; gap: 10px; }
.btn {
  font: 800 16px var(--body); color: var(--ink); padding: 14px 10px; cursor: pointer;
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
}
.btn.primary { background: var(--cube); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (max-width: 380px) { .card { padding: 18px; gap: 14px; } }
@media (max-height: 640px) { #demo { height: 88px; } }
/* en la compu la tarjeta se agranda con --ui: un poco más compacta para que entre entera */
@media (pointer: fine) { .card { gap: 11px; padding: 20px; } #demo { height: 88px; } .mrec { margin-top: -2px; } }
@media (prefers-reduced-motion: reduce) { .key, .pad button { transition: none; } .cc-teclas.avisa .g.menu { animation: none; background: #ffe58a; } }
</style>

  <div class="stat"><span class="big" id="hScore">0</span><span class="lbl">clasificados</span><span class="chip d-normal" id="hDiff">Normal</span></div>

  <button id="bL" type="button"><span class="prow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg><span class="pbox" id="pbL" aria-hidden="true"></span></span><span class="ptx">Izquierda</span></button>

        <span class="key" id="kR">Derecha<span class="pbox" id="kbR"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></span>

</div>

<div class="overlay" id="end" hidden>

    <div id="leyenda2"></div>

<script src="cubo-comun.js"></script>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  let ctx = cv.getContext('2d'); // la mini demo del menú lo cambia un momento para dibujar en su canvas
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CC = window.CuboComun; // perfil compartido y personaje; sin él el juego anda igual

  const FLY = 150;        // ms del vuelo a la caja (la lógica avanza al instante)
  const SHIFT = 90;        // ms que tarda la fila en correrse un lugar
  const SWAP_ANIM = 380;   // ms del salto de las cajas al cambiar de lado
  const TIME_LIMIT = 30000;
  const QN = 5;           // cubos visibles en la fila además del actual
  const INK = '#1d2340', PAPER = '#fffaf0';
  const TYPES = [
    { c1: '#ffcc29', c2: '#d9a514', shape: 'circle' },
    { c1: '#5cb0ff', c2: '#2f7fe0', shape: 'tri' },
  ];
  const BONUS_EVERY = 10, BONUS_MS = 1000, BONUS_MAX = 10000; // cada racha de 10 suma 1 s (hasta 10 s por partida)
  // trapFrom/trapP: desde cuándo y con qué chance salen rayados (sube hasta trapMax); swaps: primer cambio de lado y cada cuánto (ms, con azar);
  // warn: ms de aviso antes del cambio; stun: ms de mareo al errar; penalty: cubos que resta cada error;
  // vidas: errores que aguantás (0 = sin límite); bonus: las rachas suman tiempo; ver: cubos de la fila que se ven; cajasBoton: los botones muestran su caja
  const DIFFS = {
    facil:   { name: 'Fácil',   note: 'Errar casi no marea. Al rato aparecen rayados y las cajas se cambian, con mucho aviso.',
               stun: 350, penalty: 0, warn: 1100, vidas: 0, bonus: true, ver: QN, cajasBoton: true,
               trapFrom: 12000, trapP: 0.1, trapMax: 0.2, swaps: { first: 8000, every: 7000, jitter: 1500, until: 3000 } },
    normal:  { name: 'Normal',  note: 'Rayados y cajas que se cambian desde el arranque. Las rachas suman tiempo.',
               stun: 500, penalty: 0, warn: 800, vidas: 0, bonus: true, ver: QN, cajasBoton: true,
               trapFrom: 2500, trapP: 0.16, trapMax: 0.32, swaps: { first: 5000, every: 4500, jitter: 1500, until: 2000 } },
    dificil: { name: 'Difícil', note: 'Rayados y cambios de lado desde el primer segundo. Errar marea más.',
               stun: 700, penalty: 0, warn: 650, vidas: 0, bonus: true, ver: QN, cajasBoton: true,
               trapFrom: 0, trapP: 0.27, trapMax: 0.38, swaps: { first: 2500, every: 3000, jitter: 1100, until: 1500 } },
    extremo: { name: 'Extremo', note: 'Casi la mitad rayados, cajas que no paran de cambiarse y cada error te resta un cubo. XP ×3.',
               stun: 900, penalty: 1, warn: 550, vidas: 0, bonus: true, ver: QN, cajasBoton: true,
               trapFrom: 0, trapP: 0.38, trapMax: 0.48, swaps: { first: 2000, every: 2100, jitter: 900, until: 1100 } },
    maestro: { name: 'Maestro', note: 'Ves solo 2 cubos de la fila, las cajas saltan sin parar y al tercer error se termina. XP ×4.',
               stun: 1000, penalty: 2, warn: 380, vidas: 3, bonus: false, ver: 2, cajasBoton: false,
               trapFrom: 0, trapP: 0.45, trapMax: 0.55, swaps: { first: 1500, every: 1500, jitter: 700, until: 800 } },
  };
  const DIFF_IDS = Object.keys(DIFFS);
  // XP base según el puntaje (partida() multiplica por dificultad): 20 cubos es una partida floja, 85 una de experto (en Normal)
  const XP_MALO = 20, XP_EXPERTO = 85;
  const plural = n => `${n} ${n === 1 ? 'cubo' : 'cubos'}`;

  // ---------- récords ----------
  // con cubo-comun los récords oficiales están en el perfil; acá queda una copia local por si no está o por récords de antes
  const REC_KEY = 'cubo-clasificador-records';
  let rec = {};
  try { rec = JSON.parse(localStorage.getItem(REC_KEY)) || {}; } catch (e) { rec = {}; }
  if (!rec.bests || typeof rec.bests !== 'object') rec.bests = rec.best ? { normal: rec.best } : {}; // el récord viejo era el del Normal
  delete rec.best;
  const saveRec = () => { try { localStorage.setItem(REC_KEY, JSON.stringify(rec)); } catch (e) {} };
  function bestOf(id) {
    let b = rec.bests[id] || 0;
    if (CC) { try { b = Math.max(b, CC.perfil().mejores['clasificador:' + id] || 0); } catch (e) {} }
    return b;
  }

  // ---------- sonido ----------
  let actx = null, muted = !!rec.muted;
  function beep(freq, dur, type = 'triangle', vol = 0.07, slide = 0) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sfxGood = (c, trap) => { beep(392 * Math.pow(2, (c % 12) / 12), 0.06, 'triangle', 0.08); if (trap) beep(988, 0.08, 'square', 0.035, 1.3); };
  const sfxBonk = () => { beep(150, 0.28, 'sawtooth', 0.06, 0.45); beep(95, 0.2, 'square', 0.04); };

    const T = TYPES[c.type], r = s * 0.2, lw = Math.max(2, s * 0.06);

    return { x: cx + side * dist, y: floorY - bh / 2 - lift, a, dir: Math.sign(G.sides[t] - G.from[t]) };
  }
  // la caja se dibuja en dos pasadas: atrás (cuerpo y boca) y adelante (frente con la forma), así el cubo cae adentro
  function boxXform(t, now) {
    const p = boxPos(t, now);
    const bt = (now - G.bump[t]) / 180, bump = bt >= 0 && bt < 1 ? Math.sin(Math.PI * bt) * 0.12 : 0;
    const nt = (now - G.nope[t]) / 320, nope = nt >= 0 && nt < 1 && !reduceMotion ? Math.sin(nt * Math.PI * 4) * (1 - nt) * U * 0.12 : 0;
    const warn = now - G.warnT < G.D.warn && !reduceMotion ? Math.sin(now / 45) * 0.07 : 0;
    const tilt = p.a < 1 ? Math.sin(Math.PI * p.a) * 0.25 * p.dir : 0;
    ctx.save();
    ctx.translate(p.x + nope, p.y + bh / 2);
    ctx.rotate(warn + tilt);
    ctx.scale(1 + bump, 1 - bump);
  }
  function drawBoxBack(t, now) {
    const T = TYPES[t], r = U * 0.18, lw = 3;
    boxXform(t, now);
    ctx.fillStyle = INK; rr(-bw / 2, -bh + 6, bw, bh, r); ctx.fill();
    ctx.fillStyle = T.c2; rr(-bw / 2, -bh, bw, bh, r); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
    ctx.fillStyle = 'rgba(29,35,64,.6)'; rr(-bw / 2 + 7, -bh + bh * 0.08, bw - 14, bh * 0.24, r * 0.5); ctx.fill();
    ctx.restore();
  }
  function drawBoxFront(t, now) {
    const T = TYPES[t], r = U * 0.18, lw = 3, top = -bh * 0.68;
    boxXform(t, now);
    ctx.fillStyle = T.c1; rr(-bw / 2, top, bw, bh * 0.68, r); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(-bw / 2 + r, top + bh * 0.07, bw - 2 * r, bh * 0.05);
    symbol(T.shape, 0, top + bh * 0.36, bh * 0.15, Math.max(2, U * 0.05));
    ctx.restore();
  }

  function confetti(x, y, color) {
    if (reduceMotion) return;
    for (let k = 0; k < 8; k++) {
      particles.push({ x: x + (Math.random() - 0.5) * bw * 0.5, y, vx: (Math.random() - 0.5) * 320, vy: -180 - Math.random() * 220,
        life: 0.35 + Math.random() * 0.2, age: 0, s: U * (0.07 + Math.random() * 0.05), c: k % 3 ? color : PAPER });
    }
  }

  // ---------- mini demo del menú: qué flecha manda cada cubo a qué caja ----------
  // Cada paso es un cubo (aparece, se aprieta la flecha, vuela a su caja) o un cambio de lado de las cajas.
  const dcv = $('demo'), dctx = dcv.getContext('2d');
  const DSTEP = 1150, DSWAP = 1300, CAP_NAME = ['Círculo', 'Triángulo'];
  let DW = 0, DH = 0, demo = null;
  function sizeDemo() {
    const r = dcv.getBoundingClientRect();
    if (!r.width) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    // la tarjeta tiene zoom en la compu: se dibuja en px de CSS y el lienzo se agranda para que quede nítido
    const z = dcv.offsetWidth ? r.width / dcv.offsetWidth : 1;
    DW = r.width / z; DH = r.height / z;
    dcv.width = Math.round(DW * z * dpr); dcv.height = Math.round(DH * z * dpr);
    dctx.setTransform(dpr * z, 0, 0, dpr * z, 0, 0);
  }
  addEventListener('resize', () => { if (state === 'menu') sizeDemo(); });
  function demoReset() {
    const seq = !DIFFS[diff].swaps
      ? [{ type: 0 }, { type: 1 }, { type: 1 }, { type: 0 }]
      : [{ type: 0 }, { type: 1 }, { type: 0, trap: true }, { swap: true }, { type: 0 }, { type: 1, trap: true }, { swap: true }];
    demo = { seq, i: 0, t0: performance.now(), sides: [-1, 1], from: [-1, 1], cap: '', on: null, kb: '' };
  }
  function demoBox(t, x, base, w, h, rot, bump, front) {
    const T = TYPES[t], r = w * 0.14;
    ctx.save(); ctx.translate(x, base); ctx.rotate(rot); ctx.scale(1 + bump, 1 - bump);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    if (!front) {
      ctx.fillStyle = T.c2; rr(-w / 2, -h, w, h, r); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(29,35,64,.6)'; rr(-w / 2 + 5, -h + h * 0.08, w - 10, h * 0.24, r * 0.5); ctx.fill();
    } else {
      const top = -h * 0.68;
      ctx.fillStyle = T.c1; rr(-w / 2, top, w, h * 0.68, r); ctx.fill(); ctx.stroke();
      symbol(T.shape, 0, top + h * 0.36, h * 0.14, 2);
    }
    ctx.restore();
  }
  function drawDemo(now) {
    if (!DW || !demo) return;
    if (now - demo.t0 > 5000) demo.t0 = now; // volvió de estar oculto
    let st = demo.seq[demo.i], dur = st.swap ? DSWAP : DSTEP;
    while (now - demo.t0 >= dur) {
      demo.t0 += dur; demo.i = (demo.i + 1) % demo.seq.length;
      st = demo.seq[demo.i]; dur = st.swap ? DSWAP : DSTEP;
      demo.from = demo.sides.slice();
      if (st.swap) demo.sides = [-demo.sides[0], -demo.sides[1]];
    }
    const el = now - demo.t0, d = st.swap ? 0 : demo.sides[st.type] * (st.trap ? -1 : 1);
    const cap = st.swap ? '¡Ojo! Las cajas se cambian de lado'
      : (d < 0 ? '◀ ' : '') + (st.trap ? 'Rayado: a la otra caja' : CAP_NAME[st.type] + ' a su caja') + (d > 0 ? ' ▶' : '');
    if (cap !== demo.cap) { demo.cap = cap; $('demoCap').textContent = cap; }

    const main = ctx; ctx = dctx;
    try {
      ctx.clearRect(0, 0, DW, DH);
      const floor = DH - 8, bW = Math.min(DW * 0.27, 96), bH = Math.min(DH * 0.5, bW * 0.72), bx = DW * 0.31;
      ctx.fillStyle = '#3fdca8'; ctx.fillRect(0, floor, DW, DH - floor);
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, floor); ctx.lineTo(DW, floor); ctx.stroke();
      const sa = st.swap ? clamp01((el - 350) / 500) : 1;
      const boxX = t => DW / 2 + lerp(demo.from[t], demo.sides[t], easeInOut(sa)) * bx;
      const lift = t => st.swap && t === 0 && !reduceMotion ? Math.sin(Math.PI * sa) * DH * 0.32 : 0;
      const wig = st.swap && el < 350 && !reduceMotion ? Math.sin(now / 45) * 0.08 : 0;
      const target = d ? demo.sides.indexOf(d) : -1;
      const bt = (el - 800) / 160, bump = bt >= 0 && bt < 1 ? Math.sin(Math.PI * bt) * 0.12 : 0;
      const pressed = !st.swap && el >= 470 && el < 680 ? d : 0;
      if (pressed !== demo.on) { demo.on = pressed; $('kL').classList.toggle('on', pressed < 0); $('kR').classList.toggle('on', pressed > 0); }
      // cada tecla muestra la caja que tiene de su lado (como los botones del juego); cambia a mitad del salto
      const lado = sa < 0.5 ? demo.from : demo.sides, sig = lado.join();
      if (sig !== demo.kb) { demo.kb = sig; $('kbL').innerHTML = BOX_SVG[lado.indexOf(-1)]; $('kbR').innerHTML = BOX_SVG[lado.indexOf(1)]; }
      for (let t = 0; t < 2; t++) demoBox(t, boxX(t), floor - lift(t), bW, bH, wig, t === target ? bump : 0, false);
      if (!st.swap) {
        const cs = Math.min(42, DH * 0.32), cy = DH * 0.3, ft = clamp01((el - 500) / 300);
        if (ft < 1) {
          const tx = boxX(target), ty = floor - bH * 0.75;
          const x = lerp(DW / 2, tx, ft), y = lerp(cy, ty, ft) - (reduceMotion ? 0 : Math.sin(Math.PI * ft) * DH * 0.22);
          drawCube(x, y, cs * lerp(1, 0.55, ft) * easeOut(clamp01(el / 160)), st, { rot: reduceMotion ? 0 : d * ft * Math.PI * 0.6 });
        }
      }
      for (let t = 0; t < 2; t++) demoBox(t, boxX(t), floor - lift(t), bW, bH, wig, t === target ? bump : 0, true);
    } finally { ctx = main; }
  }

  // ---------- bucle ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(now, dt); draw(now);
    if (state === 'menu') drawDemo(now);
    requestAnimationFrame(frame);
  }

  let hudCache = '';
  function update(now, dt) {
    if (G.demo && now >= G.botNext && now >= G.stunUntil) {
      const ok = sideFor(G.queue[0]);
      press(Math.random() < 0.92 ? ok : -ok, now);
      G.botNext = now + 230 + Math.random() * 170;
    }
    const el = G.done ? G.endT - G.t0 : G.started ? now - G.t0 : 0;

    // cambios de lado de las cajas
    if (G.started && !G.done && G.swapI < G.swaps.length) {
      const at = G.swaps[G.swapI];
      if (el >= at - G.D.warn && G.warned !== G.swapI) { G.warned = G.swapI; G.warnT = now; if (!G.demo) sfxWarn(); }
      if (el >= at) { doSwap(now); if (G.demo) G.swaps.push(at + 4200); }
    }
    // cubos que ya cayeron en su caja
    for (const f of G.flights) {
      if (now - f.t < FLY) continue;
      f.landed = true; G.bump[f.box] = now;
      const p = boxPos(f.box, now);
      confetti(p.x, p.y - bh * 0.4, TYPES[f.c.type].c1);
    }
    G.flights = G.flights.filter(f => !f.landed);
    shake *= Math.exp(-dt * 18);
    for (const p of particles) { p.age += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.age < p.life);
    floats = floats.filter(f => now - f.t < 700);

    if (G.demo) return;
    if (state === 'play' && !G.done && G.started && now - G.t0 >= limit()) finish(G.t0 + limit());
    const left = Math.max(0, limit() - el), secs = Math.ceil(left / 1000);
    if (G.started && !G.done && secs <= 5 && secs >= 1 && secs !== G.tick) { G.tick = secs; sfxTick(); }

    const time = (left / 1000).toFixed(1), hurry = G.started && left <= 5000, plus = now - G.bonusT < 600;
    const sig = G.score + '|' + time + '|' + G.combo + '|' + hurry + '|' + G.vidas + '|' + plus;
    if (sig !== hudCache) {
      hudCache = sig;
      $('hScore').textContent = G.score; $('hTime').textContent = time;
      $('hTime').classList.toggle('hurry', hurry);
      $('hTime').classList.toggle('plus', plus);
      $('hCombo').innerHTML = (G.D.vidas ? `<span class="vidas" aria-label="${G.vidas} vidas">${'♥'.repeat(Math.max(0, G.vidas))}${'♡'.repeat(G.D.vidas - Math.max(0, G.vidas))}</span> · ` : '') + 'racha ' + G.combo;
      $('hCombo').classList.toggle('hot', G.combo >= 10);
    }
  }

  function draw(now) {
    // cielo y nubes
    const g = ctx.createLinearGradient(0, 0, 0, floorY);
    g.addColorStop(0, '#62c6ff'); g.addColorStop(1, '#c9f1ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.85;
    for (let k = 0; k < 6; k++) {
      const span = W + 360, sp = 0.008 + hash(k + 9) * 0.012;
      const x = ((hash(k + 1) * span + now * sp) % span) - 180;
      const y = hudBottom * 0.6 + hash(k + 5) * Math.max(40, cubeY - hudBottom * 0.6 - U * 2), s = 22 + hash(k + 3) * 32;
      ctx.beginPath();
      ctx.ellipse(x, y, s * 1.6, s * 0.6, 0, 0, Math.PI * 2);
      ctx.ellipse(x - s * 0.6, y - s * 0.3, s * 0.75, s * 0.6, 0, 0, Math.PI * 2);
      ctx.ellipse(x + s * 0.5, y - s * 0.45, s * 0.85, s * 0.75, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const sx = reduceMotion ? 0 : (Math.random() - 0.5) * shake, sy = reduceMotion ? 0 : (Math.random() - 0.5) * shake;
    ctx.save(); ctx.translate(sx, sy);

    // piso
    ctx.fillStyle = '#16a676'; ctx.fillRect(-20, floorY, W + 40, H - floorY + 20);
    ctx.fillStyle = '#3fdca8'; ctx.fillRect(-20, floorY, W + 40, U * 0.22);
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-20, floorY); ctx.lineTo(W + 20, floorY); ctx.stroke();

    // tubo de la fila y pedestal
    const qTop = slots[QN].y - slots[QN].s / 2 - U * 0.22, tw = S0 * 1.18;
    ctx.fillStyle = 'rgba(255,250,240,.35)'; rr(cx - tw / 2, qTop, tw, cubeY - qTop, tw * 0.3); ctx.fill();
    ctx.strokeStyle = 'rgba(29,35,64,.22)'; ctx.lineWidth = 2; ctx.stroke();
    if (!CC) {
      const pTop = cubeY + S0 / 2, pw = S0 * 1.4;
      ctx.fillStyle = INK; rr(cx - pw / 2, pTop + 5, pw, floorY - pTop, U * 0.12); ctx.fill();
      ctx.fillStyle = PAPER; rr(cx - pw / 2, pTop, pw, floorY - pTop, U * 0.12); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    }

    // fila: se corre un lugar con cada cubo clasificado
    const e = easeOut(clamp01((now - G.shiftT) / SHIFT));
    const ver = G.D.ver || QN;
    for (let k = Math.min(QN, ver); k >= 1; k--) {
      const a = slots[k + 1], b = slots[k];
      drawCube(cx, lerp(a.y, b.y, e), lerp(a.s, b.s, e), G.queue[k], { alpha: k === ver ? e : 1 });
    }

    for (let t = 0; t < 2; t++) drawBoxBack(t, now);

    // cubo actual
    const c0 = G.queue[0], stunned = now < G.stunUntil;
    const bt = clamp01((now - G.bonkT) / 160), bonk = bt < 1 ? Math.sin(Math.PI * bt) * U * 0.3 * G.bonkDir : 0;
    const y0 = lerp(slots[1].y, slots[0].y, e), s0 = lerp(slots[1].s, slots[0].s, e);
    drawCube(cx + bonk, y0, s0, c0, { rot: stunned && !reduceMotion ? Math.sin(now / 35) * 0.1 : 0, gray: stunned });
    if (CC) {
      // personaje: sostiene el cubo actual, mira hacia donde lo mandaste, salta al tirar y se marea al errar
      const ht = (now - G.shiftT) / 140, hop = ht >= 0 && ht < 1 && !reduceMotion ? Math.sin(Math.PI * ht) : 0;
      const mirar = now - G.faceT < 450 ? G.face : 0;
      ctx.save(); ctx.translate(cx, floorY - hop * U * 0.1);
      if (hop) ctx.rotate(G.face * hop * 0.14);
      try { CC.dibujarCubo(ctx, 0, 0, CS, { mirar, mareado: stunned, t: now }); } catch (e) {}
      ctx.restore();
    } else if (stunned) {
      for (let k = 0; k < 3; k++) {
        const a = now / 110 + k * (Math.PI * 2 / 3);
        const x = cx + bonk + Math.cos(a) * S0 * 0.55, y = y0 - S0 * 0.72 + Math.sin(a) * S0 * 0.16;
        ctx.fillStyle = '#ffe14d'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
        starPath(x, y, S0 * 0.13); ctx.fill(); ctx.stroke();
      }
    }

    // vuelos a la caja
    for (const f of G.flights) {
      const t = clamp01((now - f.t) / FLY), p = boxPos(f.box, now);
      const x1 = p.x, y1 = p.y - bh / 2 + bh * 0.22;
      const x = lerp(cx, x1, t), y = lerp(cubeY, y1, t) - Math.sin(Math.PI * t) * U * 1.1;
      drawCube(x, y, S0 * lerp(1, 0.55, t), f.c, { rot: f.d * t * Math.PI * 0.6 });
    }

    for (let t = 0; t < 2; t++) drawBoxFront(t, now);

    // flecha de ayuda: primeros cubos y el primer rayado
    const firstTrap = c0.trap && G.traps === 0;
    if (!G.demo && state === 'play' && !G.done && (G.score < 3 || firstTrap)) {
      const d = sideFor(c0), ax = cx + d * (S0 / 2 + U * 0.55), ay = cubeY;
      ctx.globalAlpha = 0.6 + 0.35 * Math.sin(now / 150);
      ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(ax + d * U * 0.22, ay); ctx.lineTo(ax - d * U * 0.12, ay - U * 0.2);
      ctx.lineTo(ax - d * U * 0.12, ay + U * 0.2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    for (const p of particles) {
      ctx.globalAlpha = 1 - p.age / p.life; ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
    for (const f of floats) {
      const a = (now - f.t) / 700;
      ctx.globalAlpha = 1 - a;
      ctx.font = `${Math.round(U * 0.4)}px "Lilita One", "Trebuchet MS", sans-serif`;
      ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.fillStyle = PAPER;
      const fy = f.y - a * U * 0.5;
      ctx.strokeText(f.text, f.x, fy); ctx.fillText(f.text, f.x, fy);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // cartel
    let banner = '', pulse = false;
    if (now - G.warnT < G.D.warn + 250 && !G.demo) { banner = '¡Se cambian las cajas!'; pulse = true; }
    else if (!G.demo && state === 'play' && firstTrap) banner = 'Rayado: va a la otra caja';
    else if (!G.demo && state === 'play' && !G.started && !tipOn) banner = 'Mandá cada cubo a su caja';
    if (banner) {
      let fs = Math.min(U * 0.55, 34);
      ctx.font = `${Math.round(fs)}px "Lilita One", "Trebuchet MS", sans-serif`;
      const w = ctx.measureText(banner).width;
      if (w > W - 40) { fs *= (W - 40) / w; ctx.font = `${Math.round(fs)}px "Lilita One", "Trebuchet MS", sans-serif`; }
      const sc = pulse && !reduceMotion ? 1 + Math.sin(now / 60) * 0.04 : 1;
      ctx.save(); ctx.translate(W / 2, bannerY); ctx.scale(sc, sc);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(4, fs * 0.2); ctx.strokeStyle = INK; ctx.fillStyle = pulse ? '#ffcc29' : PAPER;
      ctx.strokeText(banner, 0, fs * 0.08); ctx.strokeText(banner, 0, 0); ctx.fillText(banner, 0, 0);
      ctx.restore();
    }
  }

  showMenu();
  requestAnimationFrame(frame);
})();
</script>
