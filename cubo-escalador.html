<title>Escalador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: canvas a pantalla completa; HUD arriba, dos botones gigantes abajo, menús como cartel de juguete centrado */
:root {
  --sky: #62c6ff;
  --ink: #1d2340;
  --paper: #fffaf0;
  --cube: #ffcc29;
  --accent: #ff5d7d;
  --good: #1fbf8a;
  --muted: #5b6382;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
  pointer-events: none;
}
.stat { display: flex; flex-direction: column; line-height: 1; }
.stat.mid { align-items: center; }
.big {
  font-family: var(--display); font-size: clamp(34px, 7vw, 52px);
  color: var(--paper); font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--ink);
}
.lbl {
  font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--paper);
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 0 var(--ink);
  margin-top: 6px;
}
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chip {
  font-weight: 800; font-size: 13px; padding: 5px 10px; border-radius: 999px;
  background: var(--paper); border: 2px solid var(--ink); font-variant-numeric: tabular-nums;
  transition: background .15s;
}
.chip.hot { background: var(--cube); }
.smallbtn {
  pointer-events: auto; font: 800 13px var(--body); color: var(--ink);
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; box-shadow: 0 3px 0 var(--ink); cursor: pointer;
}
.hbtns { display: flex; gap: 6px; }
.foot .keys { order: 3; flex-basis: 100%; }
#btnRestart { font-size: 16px; line-height: 1; padding: 4px 10px; }
.smallbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.pad {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  max-width: 560px; margin: 0 auto;
}
.pad button {
  height: clamp(76px, 13vh, 116px); border-radius: 22px;
  background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
  display: grid; place-items: center; cursor: pointer; touch-action: none;
  transition: transform .05s, box-shadow .05s;
}
.pad button svg { width: 44px; height: 44px; }
.pad button.on { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); background: var(--cube); }

.overlay {
  position: fixed; inset: 0; display: flex;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(29, 35, 64, .28);
  overflow-y: auto;
}
.card {
  width: min(420px, 100%); margin: auto; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
  padding: 22px; display: flex; flex-direction: column; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 48px; height: 48px; flex: none; border-radius: 10px; background: var(--cube);
  border: 3px solid var(--ink); position: relative; transform: rotate(-6deg);
}
.logo::before, .logo::after {
  content: ""; position: absolute; top: 13px; width: 8px; height: 11px; border-radius: 4px; background: var(--ink);
}
.logo::before { left: 11px; } .logo::after { right: 11px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: clamp(32px, 9vw, 42px); }
h2 { font-size: 34px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.modes { display: flex; flex-direction: column; gap: 10px; }
.mode {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  text-align: left; font: inherit; color: var(--ink);
  background: #fff; border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 4px 0 var(--ink); padding: 12px 14px; cursor: pointer;
}
.mode:hover { background: #fff4cc; }
.mode:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.key {
  font: 800 12px var(--body); width: 24px; height: 24px; border-radius: 6px;
  display: grid; place-items: center; border: 2px solid var(--ink); background: var(--cube);
}
.mname { font-family: var(--display); font-size: 21px; display: block; }
.mdesc { font-size: 13px; color: var(--muted); display: block; margin-top: 2px; }
.mrec { text-align: right; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mrec b { display: block; font-family: var(--display); font-weight: 400; font-size: 19px; letter-spacing: 0; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
kbd { font: 800 12px var(--body); border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; color: var(--ink); background: #fff; }

.result { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.result .num { font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.result .sub { font-size: 14px; color: var(--muted); }
.badge {
  font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  background: var(--good); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px;
}
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.row .primary { grid-column: 1 / -1; font-size: 20px; padding: 16px 10px; }
.row small { font-size: 12px; opacity: .6; margin-left: 4px; }
.exp { font-size: 14px; font-weight: 600; text-align: center; }
.exp b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.exp span { display: block; margin-top: 2px; }
.dif-h { margin: 0 0 -8px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mode.lava { background: linear-gradient(100deg, #fff 55%, #ffe1cc); }
.mode.lava:hover { background: linear-gradient(100deg, #fff4cc 55%, #ffd2b3); }
.mode.lava .key { background: #ff7a3d; }
.mode .nuevo { display: inline-block; vertical-align: 3px; margin-left: 6px; padding: 2px 6px; border-radius: 8px; background: var(--accent); color: var(--paper);
  border: 2px solid var(--ink); font: 400 12px/1 var(--display); transform: rotate(4deg); }
.end-dif { display: flex; flex-direction: column; gap: 6px; }
.end-dif > span { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; }
.row .btn { display: flex; align-items: center; justify-content: center; gap: 6px; }
.lavachip { display: inline-flex; align-items: center; gap: 4px; background: #ffb38a; }
.lavachip.hot { background: #ff3b3b; color: var(--paper); animation: latido .5s ease-in-out infinite; }
@keyframes latido { 50% { transform: scale(1.08); } }
.mchip { display: inline-flex; align-items: center; gap: 4px; background: #b49bff; }
/* en la compu todo un poco más grande (--ui lo calcula cubo-comun.js) */
.card, .hud > *, .tuto, .zone > * { zoom: var(--ui, 1); }
.pad { max-width: calc(560px * var(--ui, 1)); }
/* en pantallas anchas los modos van de a dos, así el menú entra sin scroll */
@media (min-width: 820px) and (min-height: 600px) {
  #menu .card { width: min(580px, 100%); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; }
  .mode { grid-template-columns: auto 1fr; }
  .mode .mrec { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; text-align: left; }
}
.pad button svg { width: calc(44px * var(--ui, 1)); height: calc(44px * var(--ui, 1)); }
.xbtn {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; font: inherit; color: var(--ink);
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); padding: 10px 12px;
}
.xbtn > span:nth-child(2) { flex: 1; min-width: 0; }
.xbtn b { display: block; font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.1; }
.xbtn small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.3; }
.xbtn .sw { flex: none; width: 46px; height: 28px; border-radius: 99px; border: 3px solid var(--ink); background: #e6e2d6; position: relative; }
.xbtn .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); transition: left .15s; }
.xbtn[aria-pressed="true"] { background: #ffd6d6; }
.xbtn[aria-pressed="true"] .sw { background: #ff3b3b; }
.xbtn[aria-pressed="true"] .sw::after { left: 20px; background: var(--paper); }
.xbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.xchip { display: inline-flex; align-items: center; gap: 4px; background: #ff3b3b; }
.tuto {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 16px; pointer-events: none; text-align: center;
  background: var(--ink); color: var(--paper); border-radius: 14px; width: max-content; max-width: calc(100vw - 32px);
}
.tuto b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.tuto span { font-size: 13px; font-weight: 600; }
@media (hover: hover) { .tuto { bottom: auto; top: 22%; } }
.btn {
  font: 800 16px var(--body); color: var(--ink); padding: 14px 10px; cursor: pointer;
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
}
.btn.primary { background: var(--cube); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.zone {
  position: fixed; left: 0; right: 0; top: 24%;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  text-align: center; pointer-events: none; opacity: 0;
}
.zone strong {
  font-family: var(--display); font-weight: 400; font-size: clamp(32px, 8vw, 50px); line-height: 1.05;
  color: var(--paper); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--ink);
}
.zone.show { animation: zoneIn 2s ease forwards; }
@keyframes zoneIn {
  0% { opacity: 0; transform: translateY(12px) scale(.9); }
  12% { opacity: 1; transform: none; }
  80% { opacity: 1; transform: none; }
  100% { opacity: 0; transform: translateY(-10px); }
}
@keyframes zoneFade { 0%, 100% { opacity: 0; } 12%, 80% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .zone.show { animation-name: zoneFade; } }
@media (max-width: 380px) { .card { padding: 18px; } .mdesc { display: none; } }

/* ---------- jerarquía: un solo protagonista por pantalla ---------- */
/* principal: "Otra vez" (en el menú, los modos son la elección principal) */
.card .btn.primary { border-width: 3px; box-shadow: 0 6px 0 var(--ink); font-family: var(--display); font-weight: 400; font-size: 24px; }
/* secundario: Ranking */
.card .btn:not(.primary):not(.ter), .card .smallbtn.sec { background: #fff; border-width: 2px; box-shadow: 0 2px 0 var(--ink); }
.card .smallbtn.sec { padding: 7px 14px; font-size: 14px; }
/* navegación y ajustes: solo texto */
.card .ter { background: transparent !important; border-color: transparent !important; box-shadow: none !important; opacity: .72;
  font: 800 14px var(--body) !important; padding: 8px 10px !important; }
.card .ter:hover { opacity: 1; background: rgba(29, 35, 64, .07) !important; }
.card .ter:active { transform: none; }
</style>

<canvas id="cv"></canvas>

<div class="hud" id="hud" hidden>
  <div class="stat"><span class="big" id="hSteps">0</span><span class="lbl" id="hStepsLbl">escalones</span></div>
  <div class="stat mid"><span class="big" id="hTime">0.00</span><span class="lbl" id="hTimeLbl">segundos</span></div>
  <div class="right">
    <div class="hbtns">
      <button class="smallbtn" id="btnRestart" type="button" aria-label="Reiniciar (R)" title="Reiniciar (R)">↻</button>
      <button class="smallbtn" id="btnQuit" type="button">Menú</button>
    </div>
    <span class="chip" id="hSpeed">0 esc/s</span>
    <span class="chip xchip" id="hX" hidden></span>
    <span class="chip lavachip" id="hLava" hidden></span>
  </div>
</div>

<div class="zone" id="zone" aria-live="polite"><span class="lbl" id="zoneAt"></span><strong id="zoneName"></strong></div>

<div class="tuto" id="tuto" hidden><b>Tocá el lado del próximo escalón</b><span>◀ si sube a la izquierda · ▶ si sube a la derecha</span></div>

<div class="pad" id="pad" hidden>
  <button id="bL" type="button" aria-label="Izquierda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
  <button id="bR" type="button" aria-label="Derecha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <div class="brand"><div class="logo" aria-hidden="true"></div><h1>Escalador</h1></div>
    <p class="intro">Tocá la flecha del lado donde está el próximo escalón. Si le errás, el cubo queda mareado.</p>
    <p class="dif-h">Dificultad</p>
    <div id="difs"></div>
    <p class="dif-h">Modo</p>
    <div class="modes" id="modes"></div>
    <div class="foot">
      <button class="smallbtn ter" id="btnHome" type="button">← Juegos</button>
      <button class="smallbtn sec" id="btnRank" type="button">🏆 Ranking</button>
      <span class="keys" id="keys"></span>
      <button class="smallbtn ter" id="btnMute" type="button">Sonido: sí</button>
    </div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <div class="result">
      <h2 id="eTitle">¡Llegaste!</h2>
      <span class="num" id="eNum">0</span>
      <span class="sub" id="eSub"></span>
      <span class="badge" id="eBadge" hidden>Nuevo récord</span>
      <span class="exp" id="eXp" hidden></span>
    </div>
    <div class="row">
      <button class="btn primary" id="btnAgain" type="button">↻ Otra vez <small>R</small></button>
    </div>
    <div class="end-dif"><span>Dificultad para la próxima</span><div id="difs2"></div></div>
    <div class="row">
      <button class="btn" id="btnRank2" type="button">🏆 Ranking</button>
      <button class="btn ter" id="btnModes" type="button">☰ Modos</button>
      <button class="btn ter" id="btnHome2" type="button">⌂ Juegos</button>
    </div>
    <p class="keys" id="keys2"></p>
  </div>
</div>

<script src="cubo-comun.js"></script>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const STUN = 500;        // ms de mareo al errar
  const STUN_X = 1000;     // en Extremo
  const ROMPE = { extremo: 2000, maestro: 1600 }; // ms que aguanta el escalón donde estás parado antes de romperse
  const VISTA = { normal: Infinity, extremo: 4, maestro: 3 }; // escalones que se ven por delante
  // Lava: arranca 6 escalones abajo y sube cada vez más rápido (escalones por segundo, y aceleración).
  const LAVA = { normal: [2.2, 0.11], extremo: [3, 0.13], maestro: [3.6, 0.15] };
  const LAVA_INICIO = -6;
  const TWEEN = 70;        // ms del saltito visual (la lógica avanza al instante)
  const RISE = 0.85;       // alto de cada escalón, en anchos de escalón
  const SPRINT_GOAL = 100;
  const TIME_LIMIT = 30000;

  const MODES = {
    sprint: { key: '1', name: 'Sprint 100', desc: 'Llegá al escalón 100 lo más rápido posible.' },
    time:   { key: '2', name: '30 segundos', desc: 'Subí todo lo que puedas antes de que suene.' },
    free:   { key: '3', name: 'Libre', desc: 'Sin reloj. Subí hasta el espacio y más allá.' },
    lava:   { key: '4', name: 'Lava', desc: 'La lava sube cada vez más rápido. ¡Que no te alcance!', nuevo: true },
  };
  const SUFIJO = { normal: '', extremo: '-x', maestro: '-m' };
  const LOCAL = { normal: '', extremo: 'X', maestro: 'M' };
  const NOTAS = {
    normal: 'Mareo de medio segundo y ves todos los escalones.',
    extremo: 'Mareo de 1 segundo, ves 4 escalones y si te quedás quieto 2 s, el escalón se rompe. XP ×3.',
    maestro: 'Ves 3 escalones, un error termina la partida y el escalón se rompe a los 1,6 s. XP ×4.',
  };
  const ZONES = [
    ['#ff7a95', '#d94a6c'], ['#ffad4d', '#d9801c'], ['#3fdca8', '#16a676'],
    ['#5cb0ff', '#2f7fe0'], ['#c08bff', '#8f55e0'], ['#ffd84d', '#d4a514'],
  ];
  const SKY = [ // altura en escalones, color arriba, color abajo
    [0,   [98, 198, 255],  [201, 241, 255]],
    [70,  [79, 180, 255],  [255, 233, 176]],
    [130, [255, 138, 92],  [255, 213, 158]],
    [190, [92, 58, 138],   [255, 138, 138]],
    [255, [14, 26, 74],    [59, 91, 176]],
    [340, [4, 6, 15],      [13, 21, 48]],
    [620, [10, 4, 32],     [26, 11, 58]],
    [950, [2, 1, 10],      [18, 10, 42]],
  ];
  const ZONE_NAMES = [ // cartel que aparece al pasar cada altura
    [130, 'Atardecer'], [190, 'Anochecer'], [255, 'Estratosfera'], [330, 'El espacio'],
    [440, 'La Luna'], [650, 'Planetas'], [950, 'Espacio profundo'],
  ];
  const BALLOONS = [['#ff5d7d', '#ffd1db'], ['#ffcc29', '#fff1b8'], ['#1fbf8a', '#c4f5e2'], ['#5cb0ff', '#d4e9ff']];
  const PLANETS = [ // claro, oscuro, anillo
    ['#ffc58a', '#c96a2a', '#f7dfb0'], ['#8ff0e0', '#21857a', '#c9fff5'], ['#ff9fb6', '#b23a60', '#ffd9e3'],
    ['#c6b3ff', '#5a3fc8', '#e6dcff'], ['#ffe08a', '#b8890f', '#fff1c4'],
  ];
  const NEBULA = ['170,90,255', '255,90,170', '60,200,220', '90,120,255'];
  const CC = window.CuboComun; // perfil, XP y personaje compartidos (cubo-comun.js)

  // ---------- récords ----------
  const REC_KEY = 'cubo-escalador-records';
  let rec = {};
  try { rec = JSON.parse(localStorage.getItem(REC_KEY)) || {}; } catch (e) { rec = {}; }
  const saveRec = () => { try { localStorage.setItem(REC_KEY, JSON.stringify(rec)); } catch (e) {} };
  const fmtS = ms => (ms / 1000).toFixed(2);

  // ---------- sonido ----------
  let actx = null, muted = !!rec.muted;
  function beep(freq, dur, type = 'triangle', vol = 0.07, slide = 0) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sfxStep = c => beep(392 * Math.pow(2, (c % 12) / 12), 0.06, 'triangle', 0.08);
  const sfxTurn = c => beep(784 * Math.pow(2, (c % 12) / 12), 0.07, 'square', 0.035, 1.3);
  const sfxBonk =() => { beep(150, 0.28, 'sawtooth', 0.06, 0.45); beep(95, 0.2, 'square', 0.04); };
  const sfxWin = () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'square', 0.05), i * 90));

  // ---------- canvas ----------
  let W = 0, H = 0, U = 60, baseY = 0;
  function resize() {

  // ---------- efectos ----------

  function drawBackdrop(now, h) {

    // la Tierra queda abajo cuando salís de la atmósfera
    const ea = clamp01((h - 240) / 60);
    if (ea > 0) {
      const far = clamp01((h - 300) / 700);
      const R = W * lerp(1.6, 0.7, far) + 200 * (1 - far);
      const topY = lerp(H * 0.66, H * 0.8, far) + (1 - ea) * H * 0.4;
      const cx = W / 2, cy = topY + R;
      ctx.fillStyle = 'rgba(140,200,255,.22)';
      ctx.beginPath(); ctx.arc(cx, cy, R + U * 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2d6fd2'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.clip();
      const span = W * 1.8;
      for (let k = 0; k < 8; k++) {
        const px = ((hash(k + 50) * span + now * 0.006) % span) - W * 0.4;
        const py = topY + U * 0.4 + hash(k + 60) * U * 1.6;
        ctx.fillStyle = '#3fae63';
        ctx.beginPath(); ctx.ellipse(px, py, U * (0.7 + hash(k + 70) * 1.3), U * (0.3 + hash(k + 80) * 0.4), hash(k + 90), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.ellipse(px + U, py - U * 0.3, U * 0.9, U * 0.1, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // globos aerostáticos
    const ba = 1 - clamp01((h - 160) / 40);
    if (ba > 0) {
      const c0 = Math.floor(h / 20);
      for (let k = c0 - 3; k <= c0 + 5; k++) {
        if (k * 20 < 20 || k * 20 > 180 || hash(k + 200) < 0.45) continue;
        balloon(hash(k + 201) * W + Math.sin(now / 1400 + k) * 14, parY(h, k * 20, 0.5), BALLOONS[k % BALLOONS.length], ba);
      }
    }

    // satélites
    if (h > 270 && h < 640) {
      const c0 = Math.floor(h / 30);
      for (let k = c0 - 2; k <= c0 + 4; k++) {
        if (k * 30 < 300 || k * 30 > 570 || hash(k + 300) < 0.45) continue;
        const dir = hash(k + 301) < 0.5 ? -1 : 1, span = W + 140;
        const x = ((hash(k + 302) * span + dir * now * 0.025) % span + span) % span - 70;
        satellite(x, parY(h, k * 30, 0.6), dir * now / 1500 + k);
      }
    }

    // la Luna y después planetas, uno cada 230 escalones
    planet(W * 0.76, parY(h, 470, 0.3), U * 1.7, ['#eeedf5', '#9e9cb3', ''], false, true);
    const n0 = Math.max(0, Math.floor((h - 680) / 230) - 1);
    for (let n = n0; n <= n0 + 3; n++) {
      planet(n % 2 ? W * 0.72 : W * 0.28, parY(h, 680 + n * 230, 0.22), U * (1.1 + hash(n + 700) * 0.9),
        PLANETS[n % PLANETS.length], hash(n + 710) > 0.4, false);
    }
    return night;
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function starPath(cx, cy, r) {
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? r * 0.45 : r;
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath();
  }

  // ---------- bucle ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(now, dt); draw(now);
    requestAnimationFrame(frame);
  }

  let hudCache = '';
  function update(now, dt) {
    if (G.demo && now >= G.botNext && now >= G.stunUntil) {
      const next = G.steps[G.i + 1];
      press(Math.random() < 0.93 ? next.dir : -next.dir, now);
      G.botNext = now + 170 + Math.random() * 140;
    }
    // salto visual
    const t = clamp01((now - G.tw0) / TWEEN), e = 1 - (1 - t) * (1 - t);
    const target = G.steps[G.i];
    G.rx = lerp(G.fromX, target.x, e); G.ry = lerp(G.fromY, G.i, e);
    G.arc = 0; // se desliza en línea recta al próximo escalón, sin saltito
    // cámara
    const k = 1 - Math.exp(-dt * 11);
    cam.x += (G.rx * U - cam.x) * k;
    cam.y += (-G.ry * RISE * U - cam.y) * k;
    shake *= Math.exp(-dt * 18);
    // partículas
    for (const p of particles) { p.age += dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.age < p.life);
    floats = floats.filter(f => now - f.t < 700);
    G.rings = G.rings.filter(r => now - r.t < 320);
    G.ghosts = G.ghosts.filter(g => now - g.t < 140);

    // estrellas fugaces y cartel de zona
    const hh = -cam.y / (RISE * U);
    shooting = shooting.filter(s => now - s.t < 600);
    if (hh > 280 && !reduceMotion && Math.random() < dt * 0.5) {
      shooting.push({ x: W * (0.3 + Math.random() * 0.8), y: Math.random() * H * 0.45,
        vx: -(320 + Math.random() * 320), vy: 140 + Math.random() * 120, t: now });
    }
    if (state === 'play' && !G.demo && G.zone < ZONE_NAMES.length && G.i >= ZONE_NAMES[G.zone][0]) {
      const [at, name] = ZONE_NAMES[G.zone++];
      const z = $('zone');
      $('zoneAt').textContent = 'Escalón ' + at; $('zoneName').textContent = name;
      z.classList.remove('show'); void z.offsetWidth; z.classList.add('show');
      beep(660, 0.12, 'triangle', 0.05); setTimeout(() => beep(990, 0.18, 'triangle', 0.05), 110);
    }
    while (G.moves.length && now - G.moves[0] > 1000) G.moves.shift();

    if (state === 'play' && !G.done && G.mode === 'time' && G.started && now - G.t0 >= TIME_LIMIT) finish(G.t0 + TIME_LIMIT);

    // lava: sube desde que tocás la primera flecha
    if (G.mode === 'lava' && !G.demo && G.started && !G.done) {
      const [v0, a] = LAVA[G.dif], ts = (now - G.t0) / 1000;
      G.lava = LAVA_INICIO + v0 * ts + a * ts * ts / 2;
      if (G.lava >= G.i - 0.15) perder(now, 'lava');
      const cerca = G.i - G.lava;
      if (cerca < 3 && !reduceMotion) shake = Math.max(shake, 2.5);
      if (cerca < 4 && now - (G.rugido || 0) > 650) { G.rugido = now; beep(65 + cerca * 10, 0.25, 'sawtooth', 0.03, 0.8); }
    }

    // Extremo y Maestro: el escalón donde estás se rompe si te quedás quieto (cruje cada vez más rápido antes)
    if (G.x && !G.demo && G.started && !G.done) {
      const q = (now - G.pisado) / ROMPE[G.dif];
      if (q >= 1) { G.cae = { i: G.i, t: now }; perder(now, 'derrumbe'); }
      else if (q > 0.5 && now - G.crujido > (q > 0.8 ? 150 : 300)) { G.crujido = now; beep(170 + q * 260, 0.05, 'square', 0.025); }
    }

    if (state === 'play' || state === 'end') {
      let steps = String(G.i), time, speed = G.moves.length;
      const el = G.done ? G.endT - G.t0 : G.started ? now - G.t0 : 0;
      if (G.mode === 'sprint') time = fmtS(el);
      else if (G.mode === 'time') time = (Math.max(0, TIME_LIMIT - el) / 1000).toFixed(1);
      else if (G.mode === 'lava') time = (el / 1000).toFixed(1);
      else time = String(Math.max(recDe('free', G.dif) || 0, G.i));
      const dist = G.mode === 'lava' ? Math.max(0, Math.floor(G.i - G.lava)) : 0;
      const sig = steps + '|' + time + '|' + speed + '|' + dist;
      if (sig !== hudCache) {
        hudCache = sig;
        if (G.mode === 'lava') {
          $('hLava').textContent = '🔥 Lava a ' + dist + ' esc.';
          $('hLava').classList.toggle('hot', dist < 5);
        }
        $('hSteps').textContent = steps; $('hTime').textContent = time;
        $('hSpeed').textContent = speed + ' esc/s';
        $('hSpeed').classList.toggle('hot', speed >= 7);
      }
    }
  }

  function draw(now) {
    const h = Math.max(0, -cam.y / (RISE * U));
    const [top, bot] = skyAt(h);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, top); g.addColorStop(1, bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    drawBackdrop(now, h);
    const cloudA = 0.85 * (1 - clamp01((h - 140) / 80));

    // nubes con parallax
    const P = 0.4, GAP = 150, cy0 = baseY - cam.y * P;
    const kLo = Math.ceil((cy0 - H - 120) / GAP), kHi = Math.floor((cy0 + 120) / GAP);
    ctx.fillStyle = '#fff';
    for (let k = kLo; k <= kHi && cloudA > 0; k++) {
      if (hash(k) < 0.35) continue;
      const span = W + 360;
      const x = ((hash(k + 77) * span - cam.x * P) % span + span) % span - 180;
      const y = cy0 - k * GAP, s = 26 + hash(k + 13) * 36;
      ctx.globalAlpha = cloudA;
      ctx.beginPath();
      ctx.ellipse(x, y, s * 1.6, s * 0.6, 0, 0, Math.PI * 2);
      ctx.ellipse(x - s * 0.6, y - s * 0.3, s * 0.75, s * 0.6, 0, 0, Math.PI * 2);
      ctx.ellipse(x + s * 0.5, y - s * 0.45, s * 0.85, s * 0.75, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const sxs = reduceMotion ? 0 : (Math.random() - 0.5) * shake, sys = reduceMotion ? 0 : (Math.random() - 0.5) * shake;
    ctx.save();
    ctx.translate(W / 2 - cam.x + sxs, baseY - cam.y + sys);

    // escalones
    const iLo = Math.max(0, G.i - 14), iHi = Math.min(G.steps.length - 1, G.i + 30);
    const sw = U * 0.94, sh = U * 0.34, srad = U * 0.08;
    for (let i = iHi; i >= iLo; i--) {
      ctx.globalAlpha = 1;
      if (G.x) { const lejos = i - G.i - VISTA[G.dif]; if (lejos >= 2) continue; if (lejos > 0) ctx.globalAlpha = 0.3; }
      const st = G.steps[i];
      const lt = i === G.landI ? (now - G.landT) / 180 : -1;
      // el escalón donde estás parado en Extremo/Maestro: se agrieta, tiembla y al final se cae
      const roto = G.cae && G.cae.i === i ? 1 : G.x && !G.demo && G.started && !G.done && i === G.i ? clamp01((now - G.pisado) / ROMPE[G.dif]) : 0;
      const tiembla = roto > 0.6 && !reduceMotion ? (Math.random() - 0.5) * U * 0.07 * roto : 0;
      const cae = G.cae && G.cae.i === i ? U * 9 * ((now - G.cae.t) / 1000) ** 2 : 0;
      const x = st.x * U - sw / 2 + tiembla;
      const y = -i * RISE * U + (lt >= 0 && lt < 1 ? Math.sin(Math.PI * lt) * U * 0.08 : 0) + cae;
      const isGoal = G.mode === 'sprint' && !G.demo && i === SPRINT_GOAL;
      const [c1, c2] = zoneOf(i);
      ctx.fillStyle = 'rgba(29,35,64,.18)'; rr(x + U * 0.05, y + U * 0.08, sw, sh, srad); ctx.fill();
      ctx.fillStyle = c2; rr(x, y, sw, sh, srad); ctx.fill();
      ctx.fillStyle = c1; rr(x, y, sw, sh * 0.62, srad); ctx.fill();
      if (isGoal) {
        const cw = sw / 8;
        for (let c = 0; c < 8; c++) for (let r = 0; r < 2; r++) {
          ctx.fillStyle = (c + r) % 2 ? '#1d2340' : '#fffaf0';
          ctx.fillRect(x + c * cw, y + r * sh * 0.31, cw, sh * 0.31);
        }
        ctx.fillStyle = '#1d2340'; ctx.fillRect(x + sw - U * 0.12, y - U * 1.25, U * 0.06, U * 1.25);
        const wave = Math.sin(now / 160) * U * 0.05;
        ctx.fillStyle = '#ff5d7d';
        ctx.beginPath(); ctx.moveTo(x + sw - U * 0.06, y - U * 1.22);
        ctx.lineTo(x + sw + U * 0.5, y - U * 1.05 + wave); ctx.lineTo(x + sw - U * 0.06, y - U * 0.85); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(x + U * 0.1, y + U * 0.05, sw - U * 0.2, U * 0.04);
      }
      if (lt >= 0 && lt < 1) {
        ctx.fillStyle = `rgba(255,255,255,${0.55 * (1 - lt)})`; rr(x, y, sw, sh, srad); ctx.fill();
      }
      if (roto > 0.3) grietas(x, y, sw, sh, roto);
      if (i > 0 && i % 10 === 0 && !isGoal) {
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.font = `${Math.round(U * 0.22)}px "Lilita One", "Trebuchet MS", sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(i), st.x * U, y + sh * 0.78);
      }
    }

    ctx.globalAlpha = 1;

    if (G.mode === 'lava' && !G.demo) drawLava(now);

    // pista de flecha para los primeros pasos
    if (!G.demo && state === 'play' && G.i < 3 && G.steps[G.i + 1]) {
      const n = G.steps[G.i + 1], ax = n.x * U, ay = -(G.i + 1) * RISE * U - U * 0.55;
      ctx.globalAlpha = 0.55 + 0.35 * Math.sin(now / 150);
      ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ax + n.dir * U * 0.2, ay); ctx.lineTo(ax - n.dir * U * 0.12, ay - U * 0.18);
      ctx.lineTo(ax - n.dir * U * 0.12, ay + U * 0.18); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // partículas
    for (const p of particles) {
      ctx.globalAlpha = 1 - p.age / p.life; ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    // aro al cambiar de dirección
    for (const r of G.rings) {
      const a = (now - r.t) / 320, y = -r.i * RISE * U;
      ctx.globalAlpha = 1 - a; ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = Math.max(2, U * 0.07 * (1 - a));
      ctx.beginPath(); ctx.ellipse(r.x * U, y, U * (0.4 + a * 0.6), U * (0.12 + a * 0.18), 0, 0, Math.PI * 2); ctx.stroke();
    }
    // estela del deslizamiento
    const s0 = U * 0.62, trail = CC ? CC.skin().cuerpo : '#ffcc29';
    for (const g of G.ghosts) {
      const a = (now - g.t) / 140;
      ctx.globalAlpha = 0.35 * (1 - a); ctx.fillStyle = trail;
      rr(g.x * U - s0 / 2, -g.y * RISE * U - s0, s0, s0, s0 * 0.2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawCube(now);

    for (const f of floats) {
      const a = (now - f.t) / 700;
      ctx.globalAlpha = 1 - a;
      ctx.font = `${Math.round(U * 0.4)}px "Lilita One", "Trebuchet MS", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.lineWidth = 5; ctx.strokeStyle = '#1d2340'; ctx.fillStyle = '#fffaf0';
      const fx = f.x * U, fy = -f.y * RISE * U - U * 1.3 - a * U * 0.5;
      ctx.strokeText(f.text, fx, fy); ctx.fillText(f.text, fx, fy);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // aviso rojo en el borde de abajo cuando la lava está cerca o fuera de la pantalla
    if (G.mode === 'lava' && !G.demo && state !== 'menu') {
      const cerca = clamp01(1 - (G.i - G.lava) / 12);
      const gr = ctx.createLinearGradient(0, H, 0, H * 0.55);
      gr.addColorStop(0, `rgba(255,70,30,${0.15 + 0.5 * cerca})`); gr.addColorStop(1, 'rgba(255,70,30,0)');
      ctx.fillStyle = gr; ctx.fillRect(0, H * 0.55, W, H * 0.45);
    }
  }

  // La lava en coordenadas del mundo: superficie ondulada a la altura G.lava, y todo lo de abajo lleno.
  function drawLava(now) {
    const y0 = -G.lava * RISE * U, x0 = cam.x - W, x1 = cam.x + W, fondo = y0 + H * 2;
    const ola = x => Math.sin(x / (U * 0.9) + now / 260) * U * 0.1 + Math.sin(x / (U * 0.37) - now / 170) * U * 0.05;
    ctx.save();
    ctx.shadowColor = '#ff7a3d'; ctx.shadowBlur = reduceMotion ? 0 : U * 0.6;
    const gr = ctx.createLinearGradient(0, y0 - U * 0.2, 0, y0 + U * 3);
    gr.addColorStop(0, '#ffcc29'); gr.addColorStop(0.18, '#ff7a3d'); gr.addColorStop(0.6, '#e0203a'); gr.addColorStop(1, '#7a0f2a');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.moveTo(x0, fondo);
    for (let x = x0; x <= x1; x += U * 0.25) ctx.lineTo(x, y0 + ola(x));
    ctx.lineTo(x1, fondo); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(2.5, U * 0.06);
    ctx.beginPath();
    for (let x = x0; x <= x1; x += U * 0.25) (x === x0 ? ctx.moveTo(x, y0 + ola(x)) : ctx.lineTo(x, y0 + ola(x)));
    ctx.stroke();
    // burbujas y chispas que saltan
    for (let k = 0; k < 14; k++) {
      const f = ((now / (900 + k * 37)) + hash(k + 900)) % 1;
      const x = cam.x + (hash(k + 910) - 0.5) * W * 1.2, y = y0 + U * 0.4 - Math.sin(Math.PI * f) * U * (0.4 + hash(k + 920) * 0.9);
      ctx.globalAlpha = 1 - f; ctx.fillStyle = k % 3 ? '#ffcc29' : '#fffaf0';
      ctx.fillRect(x, y, U * 0.08, U * 0.08);
    }
    ctx.globalAlpha = 1;
  }

  // Grietas sobre un escalón que se está rompiendo: aparecen de a una y el escalón se oscurece.
  const GRIETAS = [
    [[0.5, 0], [0.44, 0.35], [0.53, 0.62], [0.47, 1]],
    [[0.22, 0], [0.28, 0.4], [0.2, 0.72], [0.25, 1]],
    [[0.78, 0], [0.72, 0.45], [0.81, 1]],
  ];
  function grietas(x, y, sw, sh, q) {
    ctx.fillStyle = `rgba(29,35,64,${0.3 * q})`; rr(x, y, sw, sh, U * 0.08); ctx.fill();
    ctx.strokeStyle = 'rgba(29,35,64,.8)'; ctx.lineWidth = Math.max(1.5, U * 0.03); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const n = q > 0.8 ? 3 : q > 0.55 ? 2 : 1;
    for (const g of GRIETAS.slice(0, n)) {
      ctx.beginPath();
      g.forEach(([gx, gy], k) => (k ? ctx.lineTo : ctx.moveTo).call(ctx, x + gx * sw, y + gy * sh));
      ctx.stroke();
    }
  }

  function drawCube(now) {
    const stunned = now < G.stunUntil;
    const s = U * 0.62;
    const bt = clamp01((now - G.bonkT) / 160);
    const bonk = bt < 1 ? Math.sin(Math.PI * bt) * U * 0.22 * G.bonkDir : 0;
    const cx = G.rx * U + bonk;
    const foot = -G.ry * RISE * U + (G.cae ? U * 9 * ((now - G.cae.t) / 1000) ** 2 : 0);   // se cae con el escalón roto
    const lt = (now - G.landT) / 120;
    const squash = lt >= 0 && lt < 1 ? Math.sin(Math.PI * lt) * 0.1 : 0;
    const wob = stunned && !reduceMotion ? Math.sin(now / 35) * 0.08 : 0;

    ctx.save();
    ctx.translate(cx, foot);
    ctx.rotate(wob);
    ctx.scale(1 + squash, 1 - squash);
    if (CC) {
      CC.dibujarCubo(ctx, 0, 0, s, { mirar: G.face, mareado: stunned, t: now });
      ctx.restore();
      return;
    }
    ctx.fillStyle = 'rgba(29,35,64,.2)'; rr(-s / 2 + 3, -s + 4, s, s, s * 0.2); ctx.fill();
    ctx.fillStyle = stunned ? '#c9d3e3' : '#ffcc29';
    ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(2.5, U * 0.05);
    rr(-s / 2, -s, s, s, s * 0.2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; rr(-s * 0.36, -s * 0.9, s * 0.72, s * 0.12, s * 0.06); ctx.fill();

    const ex = s * 0.2, ey = -s * 0.56, look = G.face * s * 0.06;
    ctx.fillStyle = '#1d2340'; ctx.strokeStyle = '#1d2340';
    if (stunned) {
      ctx.lineWidth = Math.max(2, U * 0.04); ctx.lineCap = 'round';
      for (const side of [-1, 1]) {
        const x0 = side * ex, d = s * 0.08;
        ctx.beginPath(); ctx.moveTo(x0 - d, ey - d); ctx.lineTo(x0 + d, ey + d);
        ctx.moveTo(x0 + d, ey - d); ctx.lineTo(x0 - d, ey + d); ctx.stroke();
      }
      ctx.beginPath(); ctx.ellipse(0, -s * 0.26, s * 0.08, s * 0.06, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      for (const side of [-1, 1]) { rr(side * ex + look - s * 0.06, ey - s * 0.1, s * 0.12, s * 0.2, s * 0.06); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,93,125,.55)';
      for (const side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(side * s * 0.3 + look, -s * 0.3, s * 0.08, s * 0.05, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.strokeStyle = '#1d2340'; ctx.lineWidth = Math.max(2, U * 0.035); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(look, -s * 0.34, s * 0.1, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    }
    ctx.restore();

    if (stunned) {
      for (let k = 0; k < 3; k++) {
        const a = now / 110 + k * (Math.PI * 2 / 3);
        const x = cx + Math.cos(a) * s * 0.55, y = foot - s * 1.18 + Math.sin(a) * s * 0.16;
        ctx.fillStyle = '#ffe14d'; ctx.strokeStyle = '#1d2340'; ctx.lineWidth = 2;
        starPath(x, y, s * 0.14); ctx.fill(); ctx.stroke();
      }
    }
  }

  showMenu();
  requestAnimationFrame(frame);
})();
</script>
