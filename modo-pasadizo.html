<title>Pasadizo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: el pasadizo ocupa toda la pantalla y sube; HUD arriba, dos botones gigantes abajo que se mantienen apretados. */
:root {
  --sky: #5b3f2e;
  --ink: #1d2340;
  --paper: #fffaf0;
  --cube: #ffcc29;
  --accent: #ff5d7d;
  --good: #1fbf8a;
  --muted: #5b6382;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
  pointer-events: none; zoom: var(--ui, 1);
}
.stat { display: flex; flex-direction: column; line-height: 1; }
.stat.mid { align-items: center; }
.big {
  font-family: var(--display); font-size: clamp(34px, 7vw, 52px); color: var(--paper); font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); white-space: nowrap;
}
.big small { font-size: .55em; }
.zona {
  font-family: var(--display); font-size: clamp(19px, 4.6vw, 26px); color: var(--paper); white-space: nowrap;
  -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 var(--ink);
}
.lbl {
  font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--paper); margin-top: 6px;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 0 var(--ink);
}
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font-weight: 800; font-size: 13px; padding: 5px 10px; border-radius: 999px;
  background: var(--paper); border: 2px solid var(--ink); font-variant-numeric: tabular-nums;
}
.chip svg { flex: none; color: var(--ink); }
.hbtns { display: flex; gap: 8px; }
.smallbtn {
  pointer-events: auto; font: 800 13px var(--body); color: var(--ink); white-space: nowrap;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; box-shadow: 0 3px 0 var(--ink); cursor: pointer; min-height: 40px; min-width: 44px;
}
.smallbtn.icon { font-size: 17px; line-height: 1; }
.smallbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.pad {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 560px; margin: 0 auto;
  zoom: var(--ui, 1);
}
.pad.off { visibility: hidden; }
.pad button {
  position: relative; overflow: hidden;
  height: clamp(70px, 12vh, 110px); border-radius: 22px; background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; touch-action: none;
  font: 400 clamp(19px, 5.4vw, 26px) var(--display); transition: transform .05s, box-shadow .05s;
}
.pad button > * { position: relative; }
.pad button svg { width: 36px; height: 36px; flex: none; }
/* mientras se mantiene apretado, el botón se llena con la carga */
.pad button::before {
  content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: calc(var(--c, 0) * 100%);
  background: var(--cube); transition: background .1s;
}
.pad button.on { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); background: #ffe9a3; }
.pad button.max::before { background: #ffb020; }
.pad button.rosca::before { background: var(--accent); }

.overlay {
  position: fixed; inset: 0; display: flex; overflow-y: auto; touch-action: pan-y;
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(29, 35, 64, .3);
}
.card {
  width: min(420px, 100%); margin: auto; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
  padding: 20px; display: flex; flex-direction: column; gap: 14px; zoom: var(--ui, 1);
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 48px; height: 48px; flex: none; border-radius: 10px; background: var(--cube);
  border: 3px solid var(--ink); position: relative; transform: rotate(-6deg);
}
.logo::before, .logo::after { content: ""; position: absolute; top: 13px; width: 8px; height: 11px; border-radius: 4px; background: var(--ink); }
.logo::before { left: 11px; } .logo::after { right: 11px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: clamp(32px, 9vw, 42px); }
h2 { font-size: 34px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.intro b { color: var(--ink); }
.back { align-self: flex-start; }
.go { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: stretch; }
.best[hidden] { display: none; }
.best {
  display: flex; flex-direction: column; justify-content: center; padding: 6px 14px;
  border: 3px solid var(--ink); border-radius: 14px; background: #fff;
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.best b { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; line-height: 1.1; }
kbd { font: 800 12px var(--body); border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; color: var(--ink); background: #fff; }

.result { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.result .num { font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.result .num small { font-size: .5em; }
.result .sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lbl-dif { margin: 0 0 -6px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.fin { width: 100%; }
.fin:empty { display: none; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.btn {
  font: 800 16px var(--body); color: var(--ink); padding: 14px 10px; cursor: pointer;
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.small { padding: 10px; font-size: 15px; }
.btn.big { font: 400 26px var(--display); padding: 12px 10px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (max-width: 380px) { .card { padding: 16px; gap: 12px; } }
@media (pointer: coarse) { .kbd-only { display: none; } }
@media (pointer: fine) { .card { gap: 12px; } }
@media (prefers-reduced-motion: reduce) { .pad button, .btn { transition: none; } }
/* jerarquía de botones: un solo protagonista por pantalla (igual que los otros juegos) */
.card .btn.primary { background: var(--cube); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .01em; }
.card .btn.primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.card .btn:not(.primary) { background: #fff; border-width: 2px; box-shadow: 0 2px 0 var(--ink); font-family: var(--body); font-weight: 800; font-size: 15px; }
.card .btn:not(.primary):active { transform: translateY(2px); box-shadow: none; }
.card .ter { background: transparent !important; border: 2px solid var(--ink) !important; box-shadow: 0 2px 0 var(--ink) !important; color: var(--ink);
  font: 800 14px var(--body) !important; padding: 8px 14px !important; min-height: 44px; }
.card .ter:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink) !important; }
</style>

<canvas id="cv"></canvas>

<div class="hud" id="hud" hidden>
  <div class="stat"><span class="big" id="hScore">0 <small>m</small></span><span class="lbl">altura</span></div>
  <div class="stat mid"><span class="zona" id="hZona">Mina</span><span class="lbl" id="hSub">zona 1</span></div>
  <div class="right">
    <div class="hbtns">
      <button class="smallbtn" id="btnQuit" type="button" title="Volver al menú (Esc)">← Menú</button>
      <button class="smallbtn icon" id="btnRestart" type="button" aria-label="Reiniciar (R)" title="Reiniciar (R)">↻</button>

    <span class="chip" id="hDif">Normal</span>

</div>

<div class="pad off" id="pad">
  <button id="bL" type="button" aria-label="Cargar salto a la izquierda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg><span>Izquierda</span></button>
  <button id="bR" type="button" aria-label="Cargar salto a la derecha"><span>Derecha</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <button class="ter smallbtn back" id="btnBack" type="button">← Juegos</button>
    <div class="brand"><div class="logo" aria-hidden="true"></div><h1>Pasadizo</h1></div>
    <p class="intro" data-t>Tu cubo se pega a las paredes. <b>Mantené ◀ o ▶</b> para cargar y <b>soltá</b> para saltar: cuanto más cargás, más alto llegás. Ojo con los pinches, los huecos y las paredes que se rompen.</p>
    <div id="difs"></div>
    <div class="go">
      <span class="best">Récord<b id="mBest">—</b></span>

    <div class="row">
      <button class="btn small" id="btnRank" type="button">🏆 Ranking</button>
      <button class="ter btn small" id="btnMute" type="button">Sonido: sí</button>
    </div>
    <div id="leyenda"></div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <div class="result">
      <h2 id="eTitle">¡Te caíste!</h2>
      <span class="num" id="eNum">0</span>
      <span class="sub" id="eSub"></span>
      <span class="sub" id="eSub2"></span>
      <div class="fin" id="eFin"></div>
    </div>
    <button class="btn primary big" id="btnAgain" type="button">↻ Otra vez <kbd class="kbd-only">R</kbd></button>
    <div class="fin" id="eFin2"></div>
    <p class="lbl-dif" id="eDifL">Dificultad</p>
    <div id="difs2"></div>
    <div class="row">
      <button class="btn small" id="btnRank2" type="button">🏆 Ranking</button>
      <button class="ter btn small" id="btnMenu" type="button">☰ Menú</button>
      <button class="ter btn small" id="btnHome" type="button">⌂ Juegos</button>
    </div>
  </div>
</div>

<script src="cubo-comun.js"></script>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const CC = window.CuboComun; // perfil compartido (XP, personaje, récords); si no está, el juego anda solo
  // «Reducir movimiento» de Opciones (si nunca se tocó, sigue al sistema): sin temblor y chispas chicas
  const reduceMotion = (CC && CC.menosMovimiento) ?? matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frenar = ms => { if (CC && CC.frenar) CC.frenar(ms); };
  const frenado = now => !!(CC && CC.frenado && CC.frenado(now));
  // Textos en inglés (la clave es el texto en español; ver «idioma» en cubo-comun.js)
  if (CC && CC.textos) CC.textos({
    'Pasadizo': 'Passage', 'altura': 'height', 'zona {n}': 'zone {n}', 'Volver al menú (Esc)': 'Back to menu (Esc)', 'Menú': 'Menu',
    'Reiniciar (R)': 'Restart (R)', 'Izquierda': 'Left', 'Derecha': 'Right',
    'Cargar salto a la izquierda': 'Charge a jump to the left', 'Cargar salto a la derecha': 'Charge a jump to the right',
    'Tu cubo se pega a las paredes. <b>Mantené ◀ o ▶</b> para cargar y <b>soltá</b> para saltar: cuanto más cargás, más alto llegás. Ojo con los pinches, los huecos y las paredes que se rompen.':
      'Your cube sticks to the walls. <b>Hold ◀ or ▶</b> to charge and <b>let go</b> to jump: the more you charge, the higher you go. Watch out for spikes, gaps and walls that crumble.',
    'Récord': 'Best', 'Jugar': 'Play', 'Sonido: sí': 'Sound: on', 'Sonido: no': 'Sound: off', 'Otra vez': 'Again',
    'Nuevo récord': 'New best', 'Primer récord': 'First best', 'Récord: {r}': 'Best: {r}',
    'cargar y saltar': 'charge and jump', 'Mantené ◀ o ▶ y soltá para saltar': 'Hold ◀ or ▶ and let go to jump',
    'MÁX': 'MAX', '¡Se pasó!': 'Too much!', '¡Récord!': 'Best!',
    // dificultades
    'Carga lenta, arco guía hasta donde caés y paredes que aguantan.': 'Slow charge, a guide arc all the way to where you land, and sturdy walls.',
    'El arco guía te muestra dónde vas a caer. Si te quedás quieto, la cámara sube.': 'The guide arc shows where you will land. If you stand still, the camera rises.',
    'Guía corta, la carga se pasa de rosca y la cámara sube sola.': 'Short guide, the charge overshoots and the camera rises on its own.',
    'Casi sin guía, más trampas y la cámara más rápida.': 'Almost no guide, more traps and a faster camera.',
    'Sin guía: medí la carga a ojo.': 'No guide: judge the charge by eye.',
    // zonas
    'Mina': 'Mine', 'Cristales': 'Crystals', 'Hielo': 'Ice', 'Magma': 'Magma', 'Cielo': 'Sky', 'Espacio': 'Space',
    '¡Mina!': 'Mine!', '¡Cristales!': 'Crystals!', '¡Hielo!': 'Ice!', '¡Magma!': 'Magma!', '¡Cielo!': 'Sky!', '¡Espacio!': 'Space!',
    // fin de partida
    '¡Pinchado!': 'Spiked!', '¡Al vacío!': 'Into the void!', '¡Te caíste!': 'You fell!', '¡Qué subida!': 'What a climb!', '¡Se terminó!': 'Game over!',
    '{n} salto': '{n} jump', '{n} saltos': '{n} jumps',
    'Te pinchaste': 'You got spiked', 'Caíste al vacío': 'You fell into the void',
  });
  const T = (s, v) => (CC && CC.T ? CC.T(s, v) : v ? s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)) : s);
  // desafío del día (?diario=1): Normal, 3 intentos y el pasadizo sale de la semilla del día (igual para todos)
  const DIA = CC && CC.diarioDe ? CC.diarioDe('pasadizo') : null;
  let azar = Math.random;

  // ---------- reglas ----------
  // Todo se mide en "unidades": el cubo mide 1 (la caja que choca, 0,9) y 1 unidad = 1 metro de altura.
  // Pegado a una pared, mantener la flecha carga el salto y soltarla salta. Para el lado contrario a la pared
  // cruza el pasadizo (cuanto más cargado, más rápido y más alto); para el lado de la pared, trepa un poquito.
  const HALF = 0.45, GRAV = 38, CAIDA_MAX = 24, PASO = 1 / 120;
  const VX0 = 6.5, VX1 = 3.2, VY0 = 3.5, VY1 = 18.5;   // cruzar: vx = VX0 + VX1·carga, vy = VY0 + VY1·carga
  const VT0 = 5, VT1 = 7, VTX = 2;                      // trepar por la misma pared: vy = VT0 + VT1·carga, empujando hacia ella
  const MURO = 60;                                      // las paredes de roca siguen hasta acá a cada lado
  // carga: segundos hasta el máximo · rosca: cuánto aguanta en el máximo antes de pasarse de rosca (0 = nunca)
  // guia: qué parte del arco se ve · fragil: segundos que aguanta una pared frágil · peligro: cuántas trampas
  // sube: la cámara sube sola (unidades por segundo) · racha: qué tan ancha es, como mínimo, la carga que sirve
  const DIFS = {
    facil:   { name: 'Fácil',   carga: 1.1,  rosca: 0,    guia: 1,    fragil: 2.6, peligro: 0.55, sube: 0,    racha: 5 },
    normal:  { name: 'Normal',  carga: 0.95, rosca: 0,    guia: 1,    fragil: 1.9, peligro: 1,    sube: 0,    racha: 4, quieto: true },
    dificil: { name: 'Difícil', carga: 0.85, rosca: 0.45, guia: 0.5,  fragil: 1.5, peligro: 1.25, sube: 0.3,  racha: 3 },
    extremo: { name: 'Extremo', carga: 0.75, rosca: 0.3,  guia: 0.25, fragil: 1.2, peligro: 1.5,  sube: 0.45, racha: 3 },
    maestro: { name: 'Maestro', carga: 0.7,  rosca: 0.2,  guia: 0,    fragil: 1.0, peligro: 1.7,  sube: 0.55, racha: 2 },
  };
  const NOTAS = {
    facil: 'Carga lenta, arco guía hasta donde caés y paredes que aguantan.',
    normal: 'El arco guía te muestra dónde vas a caer. Si te quedás quieto, la cámara sube.',
    dificil: 'Guía corta, la carga se pasa de rosca y la cámara sube sola.',
    extremo: 'Casi sin guía, más trampas y la cámara más rápida.',
    maestro: 'Sin guía: medí la carga a ojo.',
  };
  const XP_MALO = 10, XP_EXPERTO = 260;
  const MUESTRAS = 32;   // cuántas cargas distintas prueba el generador para cada lado
  // Ventana mínima de soltado: entre la primera y la última carga que sirven tiene que haber por lo menos 50 ms de
  // mantener. Con `racha` muestras seguidas la ventana segura es (racha − 1) / MUESTRAS × carga: en Maestro
  // (racha 2, carga 0,7 s) eran 22 ms, imposible de acertar seguido. Ahora la racha sube hasta cubrir los 50 ms:
  // Maestro y Extremo piden 4 muestras (66 y 70 ms), Difícil 3 (53 ms); Fácil y Normal ya pasaban (≥ 89 ms).
  const SOLTAR_MIN = 0.05;
  const rachaMin = D => Math.max(D.racha, 1 + Math.ceil(SOLTAR_MIN * MUESTRAS / D.carga));
  // Normal no tiene cámara que sube sola, pero si te quedás pegado QUIETO segundos sin saltar (después del primer
  // salto), empieza a subir despacio: 0,25 m/s, llegando de a poco en 1,5 s. Saltar la frena de nuevo. Es para que
  // no se pueda pensar cada salto eterno; con el cubo a un tercio de la pantalla quedan unos 15 a 20 s antes de caerte.
  const QUIETO = 4, SUBE_QUIETO = 0.25;

  // zonas: el color cambia a medida que subís
  const ZONAS = [
    { m: 0,   nombre: 'Mina',      fondo: '#6b4a35', fondo2: '#3e2a1f', roca: '#c48a5a', roca2: '#a06c43', borde: '#f0bb88' },
    { m: 70,  nombre: 'Cristales', fondo: '#4a3a86', fondo2: '#251c47', roca: '#8f72dc', roca2: '#6d52bd', borde: '#d3c4ff' },
    { m: 160, nombre: 'Hielo',     fondo: '#3778ad', fondo2: '#1b3d5e', roca: '#a9dcf5', roca2: '#7fbfe2', borde: '#f2fbff' },
    { m: 280, nombre: 'Magma',     fondo: '#73301f', fondo2: '#3a130d', roca: '#7a5251', roca2: '#5c3a3a', borde: '#ff9a5a' },
    { m: 420, nombre: 'Cielo',     fondo: '#62c6ff', fondo2: '#2e78d4', roca: '#a3aed0', roca2: '#8590b5', borde: '#ffffff' },
    { m: 600, nombre: 'Espacio',   fondo: '#252b5e', fondo2: '#0b0e26', roca: '#6b7396', roca2: '#525a7c', borde: '#d6dcff' },
  ];

  // ---------- récords y sonido ----------
  const REC_KEY = 'cubo-pasadizo-records';
  let rec = {};
  try { rec = JSON.parse(localStorage.getItem(REC_KEY)) || {}; } catch (e) { rec = {}; }
  const saveRec = () => { try { localStorage.setItem(REC_KEY, JSON.stringify(rec)); } catch (e) {} };
  let actx = null, muted = !!rec.muted, ruidoBuf = null;
  function audio() {
    if (muted) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function beep(freq, dur, type = 'triangle', vol = 0.07, slide = 0, delay = 0) {
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);

    if (!libre(M, p.x, p.y, gen)) return { tipo: 'cae', x: p.x, y: p.y, top: p.y };
    lanzar(M, p, dir, c, gen);
    let top = p.y;
    if (puntos) puntos.push(p.x, p.y);
    for (let k = 0; k < 230; k++) {
      const r = paso(M, p, gen);
      if (p.y > top) top = p.y;
      if (puntos && k % 3 === 2) puntos.push(p.x, p.y);
      if (r) { if (puntos) puntos.push(p.x, p.y); r.x = p.x; r.y = p.y; r.top = top; return r; }

  // ---------- canvas ----------
  let W = 0, H = 0, S = 40, BASE = 0;

  addEventListener('resize', resize);
  const vistaH = () => BASE / S;

  function newRun(demo, d = 'normal') {

      p: { x: 0, y: HALF, vx: 0, vy: 0, estado: 'pegado', lado: 0, rect: M.ruta.rect, aplastar: 0, estirar: 0, normal: 0, mirar: 1 },
      carga: null, guia: null, max: 0, saltos: 0, empezo: false, proxMarca: 25, zona: 0,

  function saltar() {

  }
  function contacto(c) {

    if (c.tipo === 'vacio') return morir('vacio', c.rect);
    p.estado = 'pegado'; p.lado = c.lado; p.rect = c.rect; p.vx = 0; p.vy = 0; G.acc = 0;
    p.normal = c.lado; p.aplastar = Math.min(1, 0.35 + (c.golpe || 0) / 16); p.estirar = 0;

    const z = zonaIdx(m);

  // la máquina del menú: elige un salto que la deje más arriba y carga justo lo necesario
  function pensarDemo(dt) {

    if (!G.ia) G.ia = { espera: 0.25 + Math.random() * 0.45, plan: null };

        const ok = [];

  // ---------- dibujo ----------
  const INK = '#1d2340';

  // la cara de roca de un lado: desde el borde de la pantalla hasta la cara

      if (k > 0.45 && !reduceMotion) dx = Math.sin(now / 18 + r.id) * S * 0.035 * k;

  function pintarVacio(r, z, now) {

      ctx.moveTo(cara, y0); ctx.lineTo(cara + d * largo, (y0 + y1) / 2); ctx.lineTo(cara, y1);
    }
    ctx.fill(); ctx.stroke();
  }
  function pintarSaliente(r, z) {
    const x = sx(r.x0), y = sy(r.y1), w = (r.x1 - r.x0) * S, h = (r.y1 - r.y0) * S;
    ctx.fillStyle = mezclar(z.borde, z.roca, 0.35); ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, S * 0.06);
    rr(ctx, x, y, w, h, Math.min(h / 2, S * 0.1)); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(x + S * 0.08, y + S * 0.05, w - S * 0.16, Math.max(2, h * 0.22));
  }
  // el contorno de cada pared: la cara y los escalones entre un pedazo y el siguiente
  function contorno(lista, lado) {
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2.5, S * 0.07); ctx.lineCap = 'round';
    const borde = lado < 0 ? -8 : W + 8;
    let ant = null;
    ctx.beginPath();
    for (const r of lista) {
      const cara = sx(lado < 0 ? r.x1 : r.x0), hueco = r.tipo === 'hueco';
      if (ant) {
        const caraAnt = sx(lado < 0 ? ant.x1 : ant.x0), huecoAnt = ant.tipo === 'hueco', y = sy(r.y0);
        if (hueco !== huecoAnt) { ctx.moveTo(hueco ? caraAnt : cara, y); ctx.lineTo(borde, y); }
        if (!hueco && !huecoAnt && Math.abs(cara - caraAnt) > 0.5) { ctx.moveTo(caraAnt, y); ctx.lineTo(cara, y); }
        else if (hueco !== huecoAnt && Math.abs(cara - caraAnt) > 0.5) { ctx.moveTo(caraAnt, y); ctx.lineTo(cara, y); }
      }
      if (!hueco) { ctx.moveTo(cara, sy(r.y0)); ctx.lineTo(cara, sy(r.y1)); }
      ant = r;
    }
    ctx.stroke();
  }
  function dibujarJugador(now) {
    const p = G.p;
    if (p.oculto) return;
    let cx = sx(p.x), cy = sy(p.y), s = S * 0.98;
    let alpha = 1, escala = 1;
    if (p.vacio) {
      // se lo traga el hueco: sigue un poco para adentro y se achica
      const k = Math.min(1, p.vacio.t / 0.6);
      cx = sx(p.vacio.x + p.vacio.dir * k * 1.4); cy = sy(p.vacio.y - k * k * 1.2);
      escala = 1 - k; alpha = 1 - k * 0.6;
      if (k >= 1) return;
    }
    const k = G.carga;
    ctx.save();
    ctx.globalAlpha = alpha;
    // temblor de la carga al máximo
    if (k && (k.c >= 1 || k.rosca) && !reduceMotion) { cx += (Math.random() - 0.5) * S * (k.rosca ? 0.09 : 0.04); cy += (Math.random() - 0.5) * S * 0.03; }
    let ax = cx, ay = cy, fx = 1, fy = 1;
    if (p.estado === 'pegado') {
      const c = k ? k.c : 0, a = p.aplastar;
      const contra = k && (p.lado === k.dir || (p.lado === 0 && alLado(G.M, p, false, k.dir)));
      if (p.lado && !contra) { ax = cx + p.lado * s / 2; fx = 1 - 0.3 * c - 0.28 * a; fy = 1 + 0.14 * c + 0.12 * a; }
      else if (p.lado) { ax = cx + p.lado * s / 2; ay = cy + s / 2; fy = 1 - 0.26 * c; fx = 1 - 0.18 * a + 0.12 * c; }
      else { ay = cy + s / 2; fy = 1 - 0.3 * c - 0.3 * a; fx = 1 + 0.16 * c + 0.2 * a; }
    }
    ctx.translate(ax, ay);
    if (p.estado === 'vuelo' && p.estirar > 0) {
      const ang = Math.atan2(-p.vy, p.vx), e = p.estirar * Math.min(1, Math.hypot(p.vx, p.vy) / 18) * 0.3;
      ctx.rotate(ang); ctx.scale(1 + e, 1 - e * 0.7); ctx.rotate(-ang);
    }
    ctx.scale(fx * escala, fy * escala);
    ctx.translate(-ax, -ay);
    const mirar = p.estado === 'vuelo' ? Math.sign(p.vx) || p.mirar : k ? k.dir : p.mirar;
    if (CC) CC.dibujarCubo(ctx, cx, cy + s / 2, s, { t: now, mirar });
    else { ctx.fillStyle = '#ffcc29'; ctx.strokeStyle = INK; ctx.lineWidth = 3; rr(ctx, cx - s / 2, cy - s / 2, s, s, s * 0.2); ctx.fill(); ctx.stroke(); }
    ctx.restore();
    // el aro de la carga
    if (k && !G.demo) {
      const R = S * 0.82, lw = Math.max(4, S * 0.13), a0 = -Math.PI / 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(29,35,64,.5)'; ctx.lineWidth = lw + 4;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
      const max = k.c >= 1 && !k.rosca;
      ctx.strokeStyle = k.rosca ? '#ff5d7d' : max ? (Math.floor(now / 90) % 2 ? '#fffaf0' : '#ffcc29') : '#ffcc29';
      ctx.lineWidth = lw;
      if (k.c > 0.005) { ctx.beginPath(); ctx.arc(cx, cy, R, a0, a0 + Math.PI * 2 * Math.min(1, k.c)); ctx.stroke(); }
      if (k.rosca || max) {
        texto(T(k.rosca ? '¡Se pasó!' : 'MÁX'), cx, cy - R - S * 0.45, Math.round(Math.max(14, S * 0.42)), k.rosca ? '#ff5d7d' : '#fffaf0');
      }
    }
  }
  function dibujarGuia() {
    const g = G.guia;
    if (!g || !G.carga) return;
    const pts = g.pts, n = pts.length / 2, hasta = G.D.guia >= 1 ? n : Math.max(2, Math.round(n * G.D.guia));
    for (let i = 1; i < hasta; i++) {
      const f = i / n;
      ctx.globalAlpha = (G.D.guia >= 1 ? 0.95 - f * 0.45 : 0.9 * (1 - i / hasta));
      ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx(pts[i * 2]), sy(pts[i * 2 + 1]), Math.max(3, S * 0.085), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (G.D.guia < 1) return;
    // dónde caés: un cubito fantasma (verde si te agarrás, rojo si no)
    const r = g.r, bien = r.tipo === 'pegar', x = sx(r.x), y = sy(r.y), s = S * 0.9;
    ctx.save();
    ctx.setLineDash([S * 0.14, S * 0.1]); ctx.lineWidth = Math.max(2.5, S * 0.07);
    ctx.strokeStyle = bien ? '#7dffb9' : '#ff5d7d';
    rr(ctx, x - s / 2, y - s / 2, s, s, s * 0.2); ctx.stroke();
    ctx.setLineDash([]);
    if (!bien) {
      ctx.beginPath(); ctx.moveTo(x - s * 0.22, y - s * 0.22); ctx.lineTo(x + s * 0.22, y + s * 0.22);
      ctx.moveTo(x + s * 0.22, y - s * 0.22); ctx.lineTo(x - s * 0.22, y + s * 0.22); ctx.stroke();
    }
    ctx.restore();
  }
  function texto(t, x, y, tam, color = '#fffaf0') {
    ctx.save();
    ctx.font = `400 ${tam}px "Lilita One", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, tam * 0.16); ctx.strokeStyle = INK; ctx.strokeText(t, x, y);
    ctx.fillStyle = color; ctx.fillText(t, x, y); ctx.restore();
  }
  let hudCache = '';
  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    if (!G) return;
    const vh = vistaH(), zc = zonaEn(Math.max(0, G.cam + vh * 0.5));
    // fondo: la pared de atrás, con vetas que se mueven más lento (da profundidad)
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, zc.fondo); g.addColorStop(1, zc.fondo2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    const par = G.cam * 0.55;
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    for (let i = Math.floor(par / 2.2) - 1; i < Math.floor(par / 2.2) + vh / 2.2 + 2; i++) {
      const y = BASE - (i * 2.2 - par) * S, a = hash(i * 17), b = hash(i * 29);
      ctx.beginPath(); ctx.ellipse(W / 2 + (a - 0.5) * 5 * S, y, S * (0.5 + b * 1.1), S * (0.16 + a * 0.12), 0, 0, Math.PI * 2); ctx.fill();
    }
    if (zonaIdx(G.cam) >= 5 || zonaIdx(G.cam + vh) >= 5) {
      // estrellitas en el espacio
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      for (let i = 0; i < 40; i++) { const x = hash(i * 7) * W, y = ((hash(i * 11) * H + G.cam * S * 0.2) % H); ctx.fillRect(x, y, 2, 2); }
    }
    // marcas de altura cada 10 m
    ctx.font = `400 ${Math.round(S * 0.5)}px "Lilita One", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let m = Math.max(10, Math.ceil(G.cam / 10) * 10); m < G.cam + vh + 1; m += 10) {
      const y = sy(m);
      ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillText(`${m} m`, W / 2, y);
      ctx.fillRect(W / 2 - S * 1.6, y - 1, S * 0.8, 2); ctx.fillRect(W / 2 + S * 0.8, y - 1, S * 0.8, 2);
    }
    // tu récord
    if (G.record && G.record > G.cam - 1 && G.record < G.cam + vh + 1) {
      const y = sy(G.record);
      ctx.save(); ctx.setLineDash([S * 0.3, S * 0.2]); ctx.strokeStyle = 'rgba(255,250,240,.75)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.restore();
      texto('🏁 ' + T(G.max >= G.record ? '¡Récord!' : 'Récord'), W / 2, y - S * 0.42, Math.round(Math.max(13, S * 0.36)));
    }
    // el pasadizo
    const vis = visibles(), L = [], R = [], sal = [];
    for (const t of vis) { L.push(...t.L); R.push(...t.R); sal.push(...t.sal); }
    for (const r of [...L, ...R]) {
      const z = zonaEn((r.y0 + r.y1) / 2);
      if (r.tipo === 'hueco') pintarVacio(r, z, now); else pintarRoca(r, z, now);
    }
    for (const r of sal) {
      if (r.piso) {
        const z = zonaEn(0), y = sy(0);
        ctx.fillStyle = z.roca; ctx.fillRect(-8, y, W + 16, H - y + 8);
        ctx.fillStyle = z.borde; ctx.globalAlpha = 0.55; ctx.fillRect(-8, y, W + 16, S * 0.14); ctx.globalAlpha = 1;
        ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2.5, S * 0.07);
        ctx.beginPath(); ctx.moveTo(sx(vis[0].xl), y); ctx.lineTo(sx(vis[0].xr), y); ctx.stroke();
      } else pintarSaliente(r, zonaEn(r.y0));
    }
    contorno(L, -1); contorno(R, 1);
    for (const r of [...L, ...R]) if (r.tipo === 'pinches') pintarPinches(r);
    dibujarGuia();
    dibujarJugador(now);
    for (const q of particles) {
      ctx.globalAlpha = Math.min(1, 1.4 * (1 - q.age / q.life)); ctx.fillStyle = q.c;
      const s = q.s * S * (q.polvo ? 1 + q.age / q.life : 1);
      if (q.polvo) { ctx.beginPath(); ctx.arc(sx(q.x), sy(q.y), s / 2, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(sx(q.x) - s / 2, sy(q.y) - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // carteles
    if (!G.demo && state === 'play') {
      if (!G.empezo) {
        const t = Math.round(Math.max(15, Math.min(22, S * 0.46)));
        texto(T('Mantené ◀ o ▶ y soltá para saltar'), W / 2, sy(4.6), t);
      }
      if (banner && now - banner.t < 1600) {
        const k = (now - banner.t) / 1600;
        ctx.globalAlpha = k < 0.8 ? 1 : (1 - k) / 0.2;
        texto(banner.text, W / 2, BASE * 0.3, Math.round(Math.min(40, S * 1.1)));
        ctx.globalAlpha = 1;
      }
      for (const f of floats) {
        const k = (now - f.t) / 1100;
        ctx.globalAlpha = 1 - k; texto(f.text, sx(f.x), sy(f.y) - k * 40, Math.round(S * 0.7), '#ffcc29'); ctx.globalAlpha = 1;
      }
    }
    pintarHud();
  }
  function pintarHud() {
    if (!G || G.demo || state !== 'play') return;
    const m = Math.floor(G.max), k = `${m}|${G.zona}`;
    if (k === hudCache) return;
    hudCache = k;
    $('hScore').innerHTML = `${m} <small>m</small>`;
    $('hZona').textContent = T(ZONAS[G.zona].nombre);
    $('hSub').textContent = T('zona {n}', { n: G.zona + 1 });
  }
  // los botones se llenan con la carga
  let botonesCache = '';
  function pintarBotones() {
    const k = G && !G.demo && state === 'play' ? G.carga : null;
    const key = k ? `${k.dir}|${k.c.toFixed(2)}|${k.rosca}` : '';
    if (key === botonesCache) return;
    botonesCache = key;
    for (const [id, dir] of [['bL', -1], ['bR', 1]]) {
      const b = $(id), mio = k && k.dir === dir;
      b.style.setProperty('--c', mio ? Math.min(1, k.c).toFixed(3) : 0);
      b.classList.toggle('max', !!(mio && k.c >= 1 && !k.rosca));
      b.classList.toggle('rosca', !!(mio && k.rosca));
    }
  }

  // ---------- pantallas ----------
  let sel = null;
  const dif = () => (!DIA && sel ? sel.valor() : 'normal');
  if (CC) {
    sel = CC.selectorDif($('difs'), { juego: 'pasadizo', notas: NOTAS, alCambiar: () => renderMenu() });
    CC.selectorDif($('difs2'), { juego: 'pasadizo', compacto: true, alCambiar: () => renderMenu() });
    if (DIA) DIA.menu($('difs'), []);
    CC.leyendaTeclas($('leyenda'), { jugar: T('cargar y saltar'), extra: [['R', T('reiniciar')]] });
  } else { $('difs').hidden = true; $('difs2').hidden = true; $('eDifL').hidden = true; }
  function renderMenu() {
    const best = CC ? CC.perfil().mejores['pasadizo:' + dif()] : rec[dif()];
    $('mBest').textContent = best ? `${best} m` : '—';
    $('btnRank').hidden = !CC;
    $('btnMute').textContent = T(muted ? 'Sonido: no' : 'Sonido: sí');
  }
  let marca = null;
  function ponerMarca(on) {
    if (marca) { marca.quitar(); marca = null; }
    if (on && CC && CC.sombra && G && !G.demo) marca = CC.sombra.marca('pasadizo', G.diff);
  }
  function soltarTeclas() {
    teclas.l = teclas.r = false;
    for (const b of document.querySelectorAll('.pad button')) b.classList.remove('on');
    if (G && !G.demo) cancelarCarga();
  }
  // primeras partidas (CC.guia): los botones laten uno y otro con una manito hasta el primer salto (el cartel de
  // «Mantené ◀ o ▶ y soltá» ya dice qué hacer)
  let guia = null;
  const sinGuia = () => { if (guia) { guia.listo(); guia = null; } };
  function start() {
    if (DIA) { if (!DIA.empezar()) return DIA.normal(); azar = DIA.azar(); }
    sinGuia();
    guia = CC && CC.guia ? CC.guia('pasadizo', [$('bL'), $('bR')], { ms: 9000 }) : null;
    state = 'play';
    $('menu').hidden = true; $('end').hidden = true; $('hud').hidden = false;
    $('pad').classList.remove('off');
    resize();
    newRun(false, dif());
    $('hDif').innerHTML = (CC ? CC.iconoDif(G.diff, 16) : '') + T(G.D.name);
    soltarTeclas(); hudCache = ''; botonesCache = 'x'; pintarBotones();
    ponerMarca(true);
    if (CC && CC.grabar) CC.grabar();   // la repetición (se sube sola si la partida es récord)
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function cortar() { if (state === 'play' && G && !G.demo && !G.done && G.max >= 1) return settle(); return null; }
  function restart() {
    const r = cortar();
    start();
    if (r && r.xp) banner = { text: `+${r.xp} XP`, t: performance.now() };
  }
  function showMenu() {
    if (CC && CC.grabar) setTimeout(() => CC.grabar(false));   // si quedó una grabación sin partida, se tira
    cortar(); ponerMarca(false); cortarTono(); sinGuia();
    state = 'menu';
    resize();
    newRun(true);
    renderMenu();
    $('menu').hidden = false; $('end').hidden = true; $('hud').hidden = true;
    $('pad').classList.add('off');
    soltarTeclas();
  }
  function showEnd() {
    state = 'end';
    sinGuia();
    $('end').hidden = false; $('hud').hidden = true;
    $('pad').classList.add('off');
    soltarTeclas();
    setTimeout(() => $('btnAgain').focus({ preventScroll: true }), 50);
  }
  const volver = () => { cortar(); if (CC) CC.volver(); else location.href = 'index.html'; };
  const verRanking = t => CC?.verRanking({ juego: 'pasadizo', tabla: t });
  $('btnPlay').addEventListener('click', start);
  $('btnAgain').addEventListener('click', start);
  $('btnBack').addEventListener('click', volver);
  $('btnHome').addEventListener('click', volver);
  $('btnMenu').addEventListener('click', showMenu);
  $('btnRank').addEventListener('click', () => verRanking(dif()));
  $('btnRank2').addEventListener('click', () => verRanking(G ? G.diff : dif()));
  $('btnQuit').addEventListener('click', showMenu);
  $('btnRestart').addEventListener('pointerdown', e => { e.preventDefault(); restart(); });
  $('btnMute').addEventListener('click', () => { muted = !muted; rec.muted = muted; saveRec(); renderMenu(); if (!muted) beep(660, 0.08); else cortarTono(); });

  // ---------- entrada: se mantienen apretados ----------
  // apretar empieza a cargar (si estás agarrado; si estás en el aire, carga apenas te agarrás) y soltar salta.
  // Si el navegador corta el toque (pointercancel), la carga se cancela sin saltar.
  function apretar(dir, on, cancelar) {
    const k = dir < 0 ? 'l' : 'r';
    if (on) { if (teclas[k]) return; teclas[k] = true; ultimaDir = dir; }
    else {
      if (!teclas[k]) return;
      teclas[k] = false;
      if (G && !G.demo && state === 'play' && G.carga && G.carga.dir === dir) { if (cancelar) cancelarCarga(); else saltar(); }
    }
    $(dir < 0 ? 'bL' : 'bR').classList.toggle('on', teclas[k]);
  }
  for (const [id, dir] of [['bL', -1], ['bR', 1]]) {
    const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} apretar(dir, true); });
    b.addEventListener('pointerup', () => apretar(dir, false));
    b.addEventListener('pointercancel', () => apretar(dir, false, true));
    b.addEventListener('lostpointercapture', () => apretar(dir, false));
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
  const TECLA = { ArrowLeft: -1, ArrowRight: 1, a: -1, A: -1, d: 1, D: 1 };
  addEventListener('keydown', e => {
    if (document.getElementById('cc-rank')) return;   // la ventana del ranking maneja su teclado
    const k = e.key;
    if (state === 'play') {
      if (TECLA[k]) { e.preventDefault(); if (!e.repeat) apretar(TECLA[k], true); return; }
      if (k === 'Escape') showMenu();
      else if ((k === 'r' || k === 'R') && !e.repeat) restart();
    } else if (state === 'menu') {
      if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); if (sel && !DIA) sel.siguiente(k === 'ArrowUp' ? -1 : 1); }
      else if (k === 'Enter' && document.activeElement === document.body) start();
      else if (k === 'Escape') volver();
    } else if (state === 'end') {
      if ((k === 'r' || k === 'R') && !e.repeat) start();
      else if (k === 'Escape') showMenu();
      else if ((k === 'Enter' || k === ' ') && document.activeElement === document.body) { e.preventDefault(); start(); }
    }
  });
  addEventListener('keyup', e => { if (TECLA[e.key]) apretar(TECLA[e.key], false); });
  addEventListener('blur', soltarTeclas);
  document.addEventListener('visibilitychange', () => { if (document.hidden) soltarTeclas(); });

  // ---------- arranque ----------
  // pausa al ocultar la pestaña (cubo-comun.js). Va con G.t; la carga que tenías se cancela al ocultarse (soltarTeclas).
  if (CC && CC.pausa) CC.pausa({ activa: () => state === 'play' && G && !G.demo && !G.done });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    // frenado (hitstop): se dibuja sin avanzar nada; `last` ya quedó al día, así que el tiempo frenado no se acumula
    if (!frenado(now)) update(now, dt);
    draw(now);
    requestAnimationFrame(frame);
  }
  resize();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
