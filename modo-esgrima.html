<title>Esgrima</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: la pista de costado en el medio, vos a la izquierda y el rival a la derecha; HUD arriba con las lamparitas
   de los toques y dos botones gigantes abajo (Alta y Baja). */
:root {
  --sky: #e0566e;
  --ink: #1d2340;
  --paper: #fffaf0;
  --cube: #ffcc29;
  --accent: #ff5d7d;
  --good: #1fbf8a;
  --muted: #5b6382;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 10px;
  pointer-events: none; zoom: var(--ui, 1);
}
.stat { display: flex; flex-direction: column; line-height: 1; min-width: 0; }
.stat.mid { align-items: center; }
.big {
  font-family: var(--display); font-size: clamp(34px, 7vw, 52px); color: var(--paper); font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink);
}
.lbl {
  font-weight: 800; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--paper); margin-top: 6px;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 0 var(--ink);
  white-space: nowrap;
}
/* las lamparitas del marcador: verdes las tuyas, rojas las del rival (como en la esgrima de verdad) */
.marcador { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
.lamps { display: flex; gap: 4px; }
.lamp {
  width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--ink); background: rgba(255,250,240,.35);
  transition: background .15s, box-shadow .15s;
}
.lamp.yo.on { background: #35e8a0; box-shadow: 0 0 10px #35e8a0; }
.lamp.el.on { background: #ff4f6d; box-shadow: 0 0 10px #ff4f6d; }
.vs { font-family: var(--display); font-size: 15px; color: var(--paper); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font-weight: 800; font-size: 13px; padding: 5px 10px; border-radius: 999px;
  background: var(--paper); border: 2px solid var(--ink); font-variant-numeric: tabular-nums;
}
.chip svg { flex: none; color: var(--ink); }
.hbtns { display: flex; gap: 8px; }
.smallbtn {
  pointer-events: auto; font: 800 13px var(--body); color: var(--ink); white-space: nowrap;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; box-shadow: 0 3px 0 var(--ink); cursor: pointer; min-height: 40px; min-width: 44px;
}
.smallbtn.icon { font-size: 17px; line-height: 1; }
.smallbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.pad {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 560px; margin: 0 auto;
  zoom: var(--ui, 1);
}
.pad.off { visibility: hidden; }
.pad button {
  height: clamp(70px, 12vh, 110px); border-radius: 22px; background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; touch-action: none;
  font: 400 clamp(19px, 5.4vw, 26px) var(--display); transition: transform .05s, box-shadow .05s, opacity .12s;
}
.pad button svg { width: 34px; height: 34px; flex: none; }
.pad button.on { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); background: var(--cube); }
/* mientras te recuperás de una parada, los botones se apagan un poco: apretar no hace nada */
.pad.espera button:not(.on) { opacity: .55; }

.overlay {
  position: fixed; inset: 0; display: flex; overflow-y: auto; touch-action: pan-y;
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(29, 35, 64, .28);
}
.card {
  width: min(420px, 100%); margin: auto; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
  padding: 20px; display: flex; flex-direction: column; gap: 14px; zoom: var(--ui, 1);
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 48px; height: 48px; flex: none; border-radius: 10px; background: var(--cube);
  border: 3px solid var(--ink); position: relative; transform: rotate(-6deg);
}
.logo::before, .logo::after { content: ""; position: absolute; top: 13px; width: 8px; height: 11px; border-radius: 4px; background: var(--ink); }
.logo::before { left: 11px; } .logo::after { right: 11px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: clamp(32px, 9vw, 42px); }
h2 { font-size: 34px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.intro b { color: var(--ink); }
.back { align-self: flex-start; }
.go { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: stretch; }
.best[hidden] { display: none; }
.best {
  display: flex; flex-direction: column; justify-content: center; padding: 6px 14px;
  border: 3px solid var(--ink); border-radius: 14px; background: #fff;
  font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.best b { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; line-height: 1.1; }
kbd { font: 800 12px var(--body); border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; color: var(--ink); background: #fff; }

.result { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.result .num { font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.result .sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lbl-dif { margin: 0 0 -6px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.fin { width: 100%; }
.fin:empty { display: none; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.btn {
  font: 800 16px var(--body); color: var(--ink); padding: 14px 10px; cursor: pointer;
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.small { padding: 10px; font-size: 15px; }
.btn.big { font: 400 26px var(--display); padding: 12px 10px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (max-width: 380px) { .card { padding: 16px; gap: 12px; } .lamp { width: 12px; height: 12px; } }
@media (pointer: coarse) { .kbd-only { display: none; } }
@media (pointer: fine) { .card { gap: 12px; } }
@media (prefers-reduced-motion: reduce) { .pad button, .btn, .lamp { transition: none; } }
/* jerarquía de botones: un solo protagonista por pantalla (igual que los otros juegos) */
.card .btn.primary { background: var(--cube); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .01em; }
.card .btn.primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.card .btn:not(.primary) { background: #fff; border-width: 2px; box-shadow: 0 2px 0 var(--ink); font-family: var(--body); font-weight: 800; font-size: 15px; }
.card .btn:not(.primary):active { transform: translateY(2px); box-shadow: none; }
.card .ter { background: transparent !important; border: 2px solid var(--ink) !important; box-shadow: 0 2px 0 var(--ink) !important; color: var(--ink);
  font: 800 14px var(--body) !important; padding: 8px 14px !important; min-height: 44px; }
.card .ter:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink) !important; }
</style>

<canvas id="cv"></canvas>

<div class="hud" id="hud" hidden>
  <div class="stat"><span class="big" id="hScore">0</span><span class="lbl">rivales</span></div>
  <div class="stat mid">
    <div class="marcador" aria-label="Toques"><span class="lamps" id="hYo"></span><span class="vs">vs</span><span class="lamps" id="hEl"></span></div>
    <span class="lbl" id="hRival">rival 1</span>
  </div>
  <div class="right">
    <div class="hbtns">
      <button class="smallbtn" id="btnQuit" type="button" title="Volver al menú (Esc)">← Menú</button>
      <button class="smallbtn icon" id="btnRestart" type="button" aria-label="Reiniciar (R)" title="Reiniciar (R)">↻</button>
    </div>
    <span class="chip" id="hDif">Normal</span>
  </div>
</div>

<div class="pad off" id="pad">
  <button id="bL" type="button" aria-label="Parada alta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15l8-8 8 8"/></svg>Alta</button>
  <button id="bR" type="button" aria-label="Parada baja">Baja<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l8 8 8-8"/></svg></button>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <button class="ter smallbtn back" id="btnBack" type="button">← Juegos</button>
    <div class="brand"><div class="logo" aria-hidden="true"></div><h1>Esgrima</h1></div>
    <p class="intro" data-t>Mirá cómo se carga tu rival: <b>arriba</b> o <b>abajo</b>. Pará con <b>◀ Alta</b> o <b>▶ Baja</b> justo antes de que te toque: si es justo justo, contraatacás. Cuidado con las fintas.</p>
    <div id="difs"></div>
    <div class="go">
      <span class="best">Récord<b id="mBest">—</b></span>
      <button class="btn primary big" id="btnPlay" type="button">Jugar</button>
    </div>
    <div class="row">
      <button class="btn small" id="btnRank" type="button">🏆 Ranking</button>
      <button class="ter btn small" id="btnMute" type="button">Sonido: sí</button>
    </div>
    <div id="leyenda"></div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <div class="result">
      <h2 id="eTitle">¡Touché!</h2>
      <span class="num" id="eNum">0</span>
      <span class="sub" id="eSub"></span>
      <span class="sub" id="eSub2"></span>
      <div class="fin" id="eFin"></div>
    </div>
    <button class="btn primary big" id="btnAgain" type="button">↻ Otra vez <kbd class="kbd-only">R</kbd></button>
    <div class="fin" id="eFin2"></div>
    <p class="lbl-dif" id="eDifL">Dificultad</p>
    <div id="difs2"></div>
    <div class="row">
      <button class="btn small" id="btnRank2" type="button">🏆 Ranking</button>
      <button class="ter btn small" id="btnMenu" type="button">☰ Menú</button>
      <button class="ter btn small" id="btnHome" type="button">⌂ Juegos</button>
    </div>
  </div>
</div>

<script src="cubo-comun.js"></script>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const CC = window.CuboComun; // perfil compartido (XP, personaje, récords); si no está, el juego anda solo
  // «Reducir movimiento» de Opciones (si nunca se tocó, sigue al sistema): sin temblor y chispas chicas
  const reduceMotion = (CC && CC.menosMovimiento) ?? matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frenar = ms => { if (CC && CC.frenar) CC.frenar(ms); };
  const frenado = now => !!(CC && CC.frenado && CC.frenado(now));
  // Textos en inglés (la clave es el texto en español; ver «idioma» en cubo-comun.js, si ya está)
  if (CC && CC.textos) CC.textos({
    'Esgrima': 'Fencing', 'rivales': 'rivals', 'Alta': 'High', 'Baja': 'Low', 'Parada alta': 'High parry', 'Parada baja': 'Low parry',
    'Toques': 'Touches', 'rival {n}': 'rival {n}',
    'Mirá cómo se carga tu rival: <b>arriba</b> o <b>abajo</b>. Pará con <b>◀ Alta</b> o <b>▶ Baja</b> justo antes de que te toque: si es justo justo, contraatacás. Cuidado con las fintas.':
      'Watch how your rival winds up: <b>high</b> or <b>low</b>. Parry with <b>◀ High</b> or <b>▶ Low</b> right before the hit: nail the timing and you strike back. Watch out for feints.',
    '¡Parada perfecta!': 'Perfect parry!', '¡Contraataque!': 'Riposte!', 'Bloqueo': 'Block', 'esperá más y contraatacás': 'wait longer to riposte',
    '¡Tarde!': 'Too late!', '¡Muy temprano!': 'Too early!', '¡Era arriba!': 'It was high!', '¡Era abajo!': 'It was low!',
    '¡Al aire!': 'Whiff!', '¡Te empujó!': 'Pushed back!', '¡Lo sacaste de la pista!': 'You pushed them off the strip!',
    '¡Te sacó de la pista!': 'Pushed off the strip!', '¡Te quedaste sin pista!': 'Out of strip!', 'Toque de {n}': 'Touch for {n}',
    '¡En guardia!': 'En garde!', '¡Ya!': 'Fight!', '¡Venciste a {n}!': 'You beat {n}!', 'Rival {n}': 'Rival {n}',
    'Principiante': 'Beginner', 'Veloz': 'Fast', 'Fintas': 'Feints', 'Mano pesada': 'Heavy hand', 'Jefe': 'Boss',
    'Ataca lento y sin trampas.': 'Slow attacks, no tricks.', 'Ataca enseguida: no te duermas.': 'Attacks right away: stay sharp.',
    'Amaga y cambia de lado: esperá hasta el final.': 'Fakes and switches sides: wait until the end.',
    'Pega fuerte: aunque lo bloquees, te empuja.': 'Hits hard: even when you block, you get pushed.',
    'Hace de todo. ¡Es el jefe!': 'Does it all. It\'s the boss!',
    'Parada más larga y rivales lentos. El rival necesita 4 toques.': 'Longer parry and slow rivals. The rival needs 4 touches.',
    'Ganá 3 toques a cada rival. Cada uno es mejor que el anterior.': 'Score 3 touches on each rival. Each one is better than the last.',
    'Ataques más rápidos y más fintas.': 'Faster attacks and more feints.',
    'Rapidísimos y con 2 toques te ganan.': 'Super fast, and 2 touches beat you.',
    'La parada más corta y fintas por todos lados.': 'The shortest parry and feints everywhere.',
    '¡Maestro de armas!': 'Master of arms!', '¡Gran esgrimista!': 'Great fencer!', '¡Bien ahí!': 'Nice!', '¡Touché!': 'Touché!',
    '{n} rival vencido': '{n} rival beaten', '{n} rivales vencidos': '{n} rivals beaten', 'te ganó {n}': '{n} beat you',
    'Paradas perfectas: {n} · mejor racha: {m}': 'Perfect parries: {n} · best streak: {m}', 'récord: {t}': 'best: {t}',
    'parar alta / baja': 'parry high / low', 'reiniciar': 'restart', '×{n} seguidas': '×{n} in a row',
    '◀ ¡Alta!': '◀ High!', '¡Baja! ▶': 'Low! ▶',
    'Récord': 'Best', 'Jugar': 'Play', 'Sonido: sí': 'Sound: on', 'Sonido: no': 'Sound: off', 'Otra vez': 'Again', 'Menú': 'Menu',
    'Volver al menú (Esc)': 'Back to menu (Esc)', 'Reiniciar (R)': 'Restart (R)', 'Nuevo récord': 'New best', 'Primer récord': 'First best',
  });
  const T = (s, v) => (CC && CC.T ? CC.T(s, v) : v ? s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)) : s);
  // desafío del día (?diario=1): en Normal, 3 intentos y los rivales atacan con la semilla del día
  const DIA = CC && CC.diarioDe ? CC.diarioDe('esgrima') : null;
  let azar = Math.random;

  // ---------- reglas ----------
  // El rival ataca; vos parás. Apretar Alta o Baja levanta una parada que dura `activa` segundos: si el golpe llega
  // mientras está a la altura correcta, lo bloqueás. Si llega en los primeros `perf` segundos (apretaste justo antes),
  // es parada perfecta y contraatacás: toque tuyo. Después de una parada que no bloqueó nada hay `recup` segundos sin
  // poder parar (así no sirve apretar sin mirar). Cada bloqueo lo hace retroceder un paso: si sale de la pista, también
  // es toque tuyo. Ganás el duelo con 3 toques; el rival, con `aguante`. Puntaje: rivales vencidos seguidos.
  const TOQUES = 3, PISTA = 4, PASO = 0.62, L_PISTA = 6.3;
  // el amague: se tira apenas (lo bastante corto para que se note si esperás) y vuelve
  const AMAGUE_IDA = 0.13, AMAGUE_VUELTA = 0.24;
  const DIFS = {
    facil:   { name: 'Fácil',   activa: 0.42, perf: 0.13,  recup: 0.22, vel: 1.3,  finta: 0.55, aguante: 4 },
    normal:  { name: 'Normal',  activa: 0.34, perf: 0.10,  recup: 0.26, vel: 1.0,  finta: 1.0,  aguante: 3 },
    dificil: { name: 'Difícil', activa: 0.30, perf: 0.085, recup: 0.28, vel: 0.9,  finta: 1.2,  aguante: 3 },
    extremo: { name: 'Extremo', activa: 0.29, perf: 0.08,  recup: 0.30, vel: 0.86, finta: 1.3,  aguante: 2 },
    maestro: { name: 'Maestro', activa: 0.26, perf: 0.07,  recup: 0.32, vel: 0.8,  finta: 1.45, aguante: 2 },
  };
  const NOTAS = {
    facil: 'Parada más larga y rivales lentos. El rival necesita 4 toques.',
    normal: 'Ganá 3 toques a cada rival. Cada uno es mejor que el anterior.',
    dificil: 'Ataques más rápidos y más fintas.',
    extremo: 'Rapidísimos y con 2 toques te ganan.',
    maestro: 'La parada más corta y fintas por todos lados.',
  };
  // Estilos de ataque. espera: cuánto se carga (s, al azar entre los dos) · estoc: lo que tarda la estocada ·
  // pausa: entre ataques · cambio: prob. de cambiar de altura justo antes de tirarse · amague: prob. de tirarse a medias
  // y volver · doble: prob. de un segundo ataque enseguida si le bloqueás el primero.
  const ESTILOS = {
    novato:  { nombre: 'Principiante', tip: 'Ataca lento y sin trampas.', espera: [0.8, 1.5], estoc: 0.56, pausa: [0.7, 1.2], cambio: 0, amague: 0, doble: 0 },
    rapido:  { nombre: 'Veloz', tip: 'Ataca enseguida: no te duermas.', espera: [0.3, 0.8], estoc: 0.38, pausa: [0.3, 0.6], cambio: 0.08, amague: 0.06, doble: 0.18 },
    fintero: { nombre: 'Fintas', tip: 'Amaga y cambia de lado: esperá hasta el final.', espera: [0.5, 1.2], estoc: 0.45, pausa: [0.5, 0.9], cambio: 0.3, amague: 0.25, doble: 0 },
    pesado:  { nombre: 'Mano pesada', tip: 'Pega fuerte: aunque lo bloquees, te empuja.', espera: [0.6, 2.0], estoc: 0.58, pausa: [0.6, 1.1], cambio: 0.06, amague: 0.1, doble: 0.3, pesado: true },
    jefe:    { nombre: 'Jefe', tip: 'Hace de todo. ¡Es el jefe!', espera: [0.35, 1.4], estoc: 0.42, pausa: [0.4, 0.8], cambio: 0.22, amague: 0.18, doble: 0.2 },
  };
  // el primero es una práctica; después se repiten del 2 al último, cada vuelta más rápidos
  const RIVALES = [
    { n: 'Pipo', c: '#9fd36b', e: 'novato', sk: 'clasico' },
    { n: 'Chispa', c: '#62c6ff', e: 'rapido', sk: 'gorra' },
    { n: 'La Gata', c: '#c38bff', e: 'fintero', sk: 'gato' },
    { n: 'Bastión', c: '#8fa0c4', e: 'pesado', sk: 'vikingo' },
    { n: 'Don Florete', c: '#ff7a59', e: 'jefe', sk: 'rey' },
    { n: 'Rayo', c: '#8f9bff', e: 'rapido', sk: 'robot' },
    { n: 'Mimo', c: null, e: 'fintero', sk: 'ninja' },
    { n: 'Muralla', c: '#c99a66', e: 'pesado', sk: 'pirata' },
    { n: 'La Condesa', c: '#8f6bff', e: 'jefe', sk: 'rey' },
  ];
  const rivalDe = k => {
    const i = k < RIVALES.length ? k : 1 + (k - 1) % (RIVALES.length - 1), v = k < RIVALES.length ? 0 : Math.floor((k - 1) / (RIVALES.length - 1));
    const r = RIVALES[i];
    return { ...r, nivel: k, n: r.n + (v ? ' ' + ['II', 'III', 'IV', 'V'][Math.min(3, v - 1)] : '') };

  // ---------- el cerebro del rival ----------

  $('btnRestart').addEventListener('pointerdown', e => { e.preventDefault(); restart(); });
  $('btnMute').addEventListener('click', () => { muted = !muted; rec.muted = muted; saveRec(); renderMenu(); if (!muted) metal(0.08, 0.3); });

  // ---------- entrada: cada toque es una parada ----------
  const apretones = {};
  function tocar(btn, alto) {
    if (state !== 'play' || !G || G.demo) return;
    if (parar(alto)) sinGuia();
    btn.classList.add('on');
    clearTimeout(apretones[btn.id]);
    apretones[btn.id] = setTimeout(() => btn.classList.remove('on'), 130);
  }
  for (const [id, alto] of [['bL', true], ['bR', false]]) {
    const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); tocar(b, alto); });
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
  // ← y A: alta · → y D: baja (↑ y ↓ también, por si alguien las prueba)
  const TECLA = { arrowleft: true, a: true, arrowup: true, arrowright: false, d: false, arrowdown: false };
  addEventListener('keydown', e => {
    if (document.getElementById('cc-rank')) return;   // la ventana del ranking maneja su teclado
    const k = e.key;
    if (state === 'play') {
      const t = TECLA[k.toLowerCase()];
      if (t !== undefined) { e.preventDefault(); if (!e.repeat) tocar($(t ? 'bL' : 'bR'), t); return; }
      if (k === 'Escape') showMenu();
      else if ((k === 'r' || k === 'R') && !e.repeat) restart();
    } else if (state === 'menu') {
      if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); if (sel && !DIA) sel.siguiente(k === 'ArrowUp' ? -1 : 1); }
      else if (k === 'Enter' && document.activeElement === document.body) start();
      else if (k === 'Escape') volver();
    } else if (state === 'end') {
      if ((k === 'r' || k === 'R') && !e.repeat) start(true);
      else if (k === 'Escape') showMenu();
      else if ((k === 'Enter' || k === ' ') && document.activeElement === document.body) { e.preventDefault(); start(true); }
    }
  });
  addEventListener('blur', soltarBotones);

  // ---------- arranque ----------
  let last = performance.now(), manual = false;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    // frenado (hitstop): se dibuja sin avanzar nada; `last` ya quedó al día, así que el tiempo frenado no se acumula
    if (!manual && !frenado(now)) update(now, dt);
    draw(now);
    requestAnimationFrame(frame);
  }
  showMenu();
  requestAnimationFrame(frame);
  // para probar desde la consola: __esgrima.manual(true) frena el reloj y paso(dt) avanza a mano
  window.__esgrima = { get G() { return G; }, parar, start, manual: v => { manual = v; }, paso(dt, dibujar = true) { const n = performance.now(); update(n, dt); if (dibujar) draw(n); } };
})();
</script>
